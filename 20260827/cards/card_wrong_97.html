<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; padding: 20px; }
.container { max-width: 860px; margin: 0 auto; }

	.wrong-list .wl-nums span { display: inline-block; padding: 2px 10px; margin: 3px 4px; background: #fff1f0; border: 1px solid #ffa39e; border-radius: 4px; font-size: 13px; font-weight: 600; color: #cf1322; }
	.copy-area { margin-top: 14px; }

	.copy-area .copy-btn { margin-top:6px; padding:6px 20px; background:#667eea; color:#fff; border:none; border-radius:6px; font-size:13px; cursor:pointer; }

@keyframes fadeIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
.question-card { animation: fadeIn 0.3s ease; }
</style>

<script>
const QUESTIONS = [{"id": 5173, "index": 1, "type": "single", "stem": "肝素抗凝的主要机制是", "options": {"A": "抑制凝血酶原的激活", "B": "抑制FⅩ的激活", "C": "促进纤维蛋白吸附凝血酶", "D": "增强抗凝血酶的活性"}, "answer": "D", "explanation": "《生理学》第9版P78。肝素具有强的抗凝作用，但在缺乏抗凝血酶的条件下，肝素的抗凝作用很弱。因此，肝素主要通过增强抗凝血酶的活性而发挥间接抗凝作用。", "module": "血液", "is_single": true, "review_source_index": 28}, {"id": 5852, "index": 2, "type": "single", "stem": "1944年,美国细菌学家O.Avery通过实验证实", "options": {"A": "DNA是遗传物质", "B": "端粒酶有逆转录酶活性", "C": "逆转录现象的存在", "D": "溶液中的DNA主要呈双螺旋结构"}, "answer": "A", "explanation": "暂无解析", "module": "核酸的结构与功能", "is_single": true, "review_source_index": 29}, {"id": 983, "index": 3, "type": "single", "stem": "人的头发数量有（ ）根。", "options": {"A": "2万～5万", "B": "5万～10万", "C": "10万～15万", "D": "15万～20万"}, "answer": "C", "explanation": "通常情况下，人的头发数量大约在10万根左右，C选项10万 - 15万符合这一常识范围。答案：C", "module": "人群营养", "is_single": true, "review_source_index": 31}, {"id": 2810, "index": 4, "type": "single", "stem": "（ ）可能是人体内合成亚硝胺的重要场所。", "options": {"A": "口腔", "B": "食道", "C": "胃", "D": "小肠"}, "answer": "B", "explanation": "亚硝胺的合成需要仲胺和亚硝酸盐在一定条件下反应。胃酸环境下，亚硝酸盐易转化为亚硝胺 ，但食道中可能存在局部酸性环境或食物停留时间较长，利于亚硝胺形成。所以，正确答案是B选项：“食道 ”。", "module": "人群营养", "is_single": true, "review_source_index": 33}, {"id": 2520, "index": 5, "type": "single", "stem": "二英化合物是一类稳定的亲脂性固体物质，分解温度大于（ ）。", "options": {"A": "500℃", "B": "10000℃", "C": "700℃", "D": "3000℃"}, "answer": "C", "explanation": "二噁英化合物分解温度大于700℃ ，这是该物质的一个特性知识点。答案：C", "module": "食品卫生", "is_single": true, "review_source_index": 37}, {"id": 1218, "index": 6, "type": "multiple", "stem": "关于幼儿合理安排进餐，说法正确的是（ ）。", "options": {"A": "1～2岁进餐4～5次", "B": "2～3岁进餐4～5次", "C": "每餐间隔时间3～3.5h", "D": "早、中、晚三餐", "E": "午点和晚点两次点心"}, "answer": ["B", "C", "D", "E"], "explanation": "答案：BCDE幼儿进餐次数的安排需根据其年龄特点和生理需求。一般来说，1～2岁的幼儿进餐 次数较多，通常为5～6次，而2～3岁的幼儿进餐4～5次。每餐间隔时间建议为3～3.5小时，以保证幼儿有足 够的时间消化食物，同时避免过度饥饿。合理的进餐安排通常包括早、中、晚三餐，以及午点和晚点两次点 心，以满足幼儿的能量和营养需求。因此，BCDE选项是正确的。", "module": "食品卫生", "is_single": false, "review_source_index": 39}, {"id": 2063, "index": 7, "type": "single", "stem": "新的《食品添加剂卫生管理办法》的发布时间是（ ）。", "options": {"A": "2002年3月28日", "B": "2002年7月1日", "C": "2010年3月15日", "D": "2010年3月30日"}, "answer": "A", "explanation": "需要记忆《食品添加剂卫生管理办法》的发布时间，直接回忆对应时间。答案：A ，《食品添 加剂卫生管理办法》发布时间为2002年3月28日 。", "module": "人群营养", "is_single": true, "review_source_index": 40}, {"id": 4265, "index": 8, "type": "single", "stem": "下列污染物中可抑制胆碱酯酶的是", "options": {"A": "黄曲霉毒素", "B": "氨基甲酸酯类", "C": "拟除虫菊酯类", "D": "有机氯"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P268。氨基甲酸酯与有机磷的中毒机制一样,均为抑制胆碱酯酶活性。因此正确答案为B。", "module": "食品卫生", "is_single": true, "review_source_index": 41}, {"id": 310, "index": 9, "type": "single", "stem": "《餐饮服务许可证》许可事项变更（ ），需要进行现场核查的。", "options": {"A": "单位名称", "B": "备注项目", "C": "法定代表人（负责人或者业主）", "D": "地址门牌号改变（实际经营场所未改变）"}, "answer": "B", "explanation": "正确答案：B。选项解析：A.单位名称；B.备注项目；C.法定代表人（负责人或者业主）；D.地址门牌号改变（实际经营场所未改变）。建议查阅教材相应章节巩固知识。", "module": "食品卫生", "is_single": true, "review_source_index": 43}, {"id": 5487, "index": 10, "type": "single", "stem": "脑脊液中H+浓度升高使呼吸运动加强的最主要途径是", "options": {"A": "直接刺激脑桥呼吸中枢", "B": "直接刺激延髓呼吸中枢", "C": "刺激颈动脉窦和主动脉弓感受器", "D": "刺激中枢化学敏感区"}, "answer": "D", "explanation": "《生理学》第9版P172。中枢化学感受器的生理性刺激是脑脊液和局部细胞外液的氢离子，而不是CO2，故脑脊液中H+浓度升高可刺激中枢化学感受器使呼吸运动加强。选D。", "module": "呼吸", "is_single": true, "review_source_index": 46}, {"id": 3612, "index": 11, "type": "single", "stem": "含铬丰富的食物不包括", "options": {"A": "肉类", "B": "鱼贝类", "C": "精制谷物", "D": "啤酒酵母"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P68。膳食铬的主要来源是谷类、肉类、鱼贝类,但经过加工精制的谷类食物铬含量明显降低。", "module": "基础营养", "is_single": true, "review_source_index": 47}, {"id": 2453, "index": 12, "type": "multiple", "stem": "细菌性食物中毒的流行病学特点（ ）。", "options": {"A": "一般病程短", "B": "全年皆可发病，7～9月高发", "C": "病死率高", "D": "中毒食品以植物性食品为主"}, "answer": ["A", "B"], "explanation": "细菌性食物中毒一般病程较短，多在1 - 3天内恢复，A正确；全年皆可发病，夏秋季（7 - 9月 ）气温高、湿度大，利于细菌生长繁殖，高发，B正确；大多数细菌性食物中毒病死率较低，C错误；中毒食 品以动物性食品为主，D错误。答案：AB", "module": "DRIs", "is_single": false, "review_source_index": 48}, {"id": 1567, "index": 13, "type": "multiple", "stem": "锌的良好来源是（ ）。", "options": {"A": "花生", "B": "动物内脏", "C": "红色肉", "D": "海产品", "E": "谷类胚芽"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "答案：ABCDE锌的良好来源包括贝壳类海产品、红色肉类、动物内脏、干果类、谷类胚芽、麦麸 、花生和花生酱等。选项中的花生、动物内脏、红色肉、海产品、谷类胚芽均属于锌的良好来源。", "module": "人群营养", "is_single": false, "review_source_index": 49}, {"id": 2853, "index": 14, "type": "multiple", "stem": "下列消毒奶的理化指标正确的有（ ）。", "options": {"A": "脂肪≥3.1％", "B": "酸度≤18.0％", "C": "蛋白质≤2.9％", "D": "杂质度≤5mg/kg", "E": "非脂肪固体≥8.1％"}, "answer": ["A", "B", "E"], "explanation": "消毒奶的理化指标主要包括脂肪、蛋白质、非脂固体、杂质度和酸度。根据标准： 脂肪含量应 ≥3.1％。 酸度应≤18.0％。 非脂肪固体应≥8.1％。蛋白质含量应为≥2.9％，而不是≤2.9％；杂质度应 ≤2mg/kg，而不是≤5mg/kg。因此，正确的选项是A、B和E。所以，正确答案是ABE。", "module": "人群营养", "is_single": false, "review_source_index": 52}, {"id": 1092, "index": 15, "type": "multiple", "stem": "对营养强化剂的要求包括下列哪几项（ ）。", "options": {"A": "在强化过程中，不改变食物原有感官性状", "B": "终产品中强营养元素的生物利用率高", "C": "储藏过程中稳定性良好", "D": "强化剂与载体亲和性高", "E": "营养素间不发生拮抗作用"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "营养强化剂要求在强化时不改变食物原有感官性状（A），这样不会影响食物的外观、口感等 ；强化后营养元素生物利用率要高（B），才能达到强化目的；在储藏过程稳定性良好（C），否则易失效 ；强化剂与载体亲和性高（D），便于均匀分布；营养素间不发生拮抗作用（E），避免相互影响吸收。答案 ：ABCDE", "module": "DRIs", "is_single": false, "review_source_index": 53}, {"id": 5952, "index": 16, "type": "single", "stem": "肌组织进行糖酵解时避免代谢产物堆积于局部的方式的是", "options": {"A": "丙氨酸-葡萄糖循环", "B": "柠檬酸-丙酮酸循环", "C": "三羧酸循环", "D": "乳酸循环"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P115-P116。肌收缩产生的乳酸在肝内糖异生形成乳酸循环。乳酸循环的生理意义为技能回收乳酸中的能量，有课避免乳酸堆积而引起酸中毒。", "module": "氨基酸代谢", "is_single": true, "review_source_index": 57}, {"id": 1031, "index": 17, "type": "multiple", "stem": "孕期体重的增加是由于（ ）。", "options": {"A": "胎儿", "B": "羊水", "C": "胎盘", "D": "血容量的增加", "E": "乳腺"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "孕期体重增加是多种因素共同作用，胎儿、羊水、胎盘、血容量增加、乳腺增大等都会使体重 上升。这几个选项都参与其中。答案：ABCDE", "module": "人群营养", "is_single": false, "review_source_index": 59}, {"id": 487, "index": 18, "type": "multiple", "stem": "下列属于纯热能食物的有（ ）。", "options": {"A": "植物油", "B": "淀粉", "C": "蔗糖", "D": "面粉", "E": "酒"}, "answer": ["A", "B", "C", "E"], "explanation": "纯热能食物主要提供能量，植物油富含油脂，淀粉、蔗糖是常见供能糖类，酒含有酒精可提供 能量，而面粉除了含淀粉能供能外，还含有一定量蛋白质等其他成分。答案：ABCE", "module": "食品卫生", "is_single": false, "review_source_index": 60}, {"id": 5402, "index": 19, "type": "single", "stem": "关于肾上腺素和去甲肾上腺素的叙述,正确的是①在化学结构上都属于儿茶酚胺②均来自肾上腺髓质的分泌③肾上腺素可与α及β两类受体结合④在完整机体中,注射去甲肾上腺素引起血压升高,心率加快", "options": {"A": "①②③④", "B": "①②③", "C": "①②④", "D": "①③④"}, "answer": "B", "explanation": "暂无解析", "module": "血液循环", "is_single": true, "review_source_index": 61}, {"id": 5460, "index": 20, "type": "single", "stem": "血液中PCO2升高使呼吸运动加强的最主要途径是", "options": {"A": "直接刺激脑桥呼吸中枢", "B": "直接刺激延髓呼吸中枢", "C": "刺激中枢化学感受器", "D": "刺激颈动脉窦和主动脉弓感受器"}, "answer": "C", "explanation": "《生理学》第9版P172。血液中的CO2能迅速通过血脑屏障，使化学感受器周围细胞外液中的氢离子浓度升高，从而刺激中枢化学感受器，引起呼吸中枢兴奋，使呼吸运动加深加快。故选C。", "module": "呼吸", "is_single": true, "review_source_index": 63}, {"id": 735, "index": 21, "type": "single", "stem": "厨房里食物烧焦、炸焦、煮焦、易产生（ ）。", "options": {"A": "焦糖物", "B": "多环芳烃", "C": "亚硝胺", "D": "杂环胺"}, "answer": "B", "explanation": "厨房里食物烧焦、炸焦、煮焦的过程中，容易产生多环芳烃和杂环胺等有害物质。多环芳烃主 要来自于有机物的不完全燃烧或高温热解，而杂环胺则是在高温烹调富含蛋白质的食物时容易产生的。焦糖 物主要是在糖类加热过程中形成的，亚硝胺则主要来自于亚硝酸盐与胺类物质的反应，这两种物质在食物烧 焦的过程中不是主要的产物。因此，正确答案是B和D，即多环芳烃和杂环胺。所以，正确答案是BD。", "module": "食品卫生", "is_single": true, "review_source_index": 65}, {"id": 1274, "index": 22, "type": "multiple", "stem": "头发样本剪取被测者枕部发际处至耳后的原因（ ）。", "options": {"A": "剪取此处头发不影响美观", "B": "此处头发不会有洗发或护发剂的残留", "C": "此处头发不受激素水平的控制", "D": "此处头发生长慢，可以反映更长时间的营养状况", "E": "此处头发生长速度较快，机体提供营养较多 F.此处头发保留了人体更多的遗传信息"}, "answer": ["A", "C", "D"], "explanation": "正确答案：A、C、D。选项解析：A.剪取此处头发不影响美观；B.此处头发不会有洗发或护发剂的残留；C.此处头发不受激素水平的控制；D.此处头发生长慢，可以反映更长时间的营养状况；E.此处头发生长速度较快，机体提供营养较多 F.此处头发保留了人体更多的遗传信息。建议查阅教材相应章节巩固知识。", "module": "人群营养", "is_single": false, "review_source_index": 66}, {"id": 6351, "index": 23, "type": "single", "stem": "9岁女童,通过基因检测发现有先天性中链脂酰CoA脱氢酶缺陷,那么在禁食状态下,该女童最有可能出现的症状或临床表现为", "options": {"A": "低乳酸血症", "B": "酮症酸中毒", "C": "高血糖", "D": "二元酸酸中毒"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P149。 当禁食时，机体没有充足糖供应，需脂肪酸供能，脂酰CoA脱氢酶缺乏时，丙二酸单酰CoA增加，导致二元酸中毒。", "module": "脂质代谢", "is_single": true, "review_source_index": 67}, {"id": 2067, "index": 24, "type": "single", "stem": "率必须有以下内容才能构成“率”。但不包括（ ）", "options": {"A": "受累人群数目，", "B": "可以是某病的临床症状、死亡、残疾、实验室异常等", "C": "被观察到的受累人群所处的总体数目", "D": "相对危险度", "E": "规定的时间"}, "answer": "D", "explanation": "率是表示在一定的条件下某现象实际发生的例数与可能发生该现象的总例数之比，所以要有受 累人群数目、总体数目及规定时间，某病的临床症状等也可作为观察指标计算率。而相对危险度是两个率的 比值，不是构成率本身的要素。答案：D", "module": "人群营养", "is_single": true, "review_source_index": 72}, {"id": 2474, "index": 25, "type": "multiple", "stem": "含碘量丰富的食品有（ ）。", "options": {"A": "海带", "B": "深绿色蔬菜", "C": "干贝", "D": "紫菜"}, "answer": ["A", "C", "D"], "explanation": "海带、紫菜是常见的含碘量极为丰富的食物，干贝也含有一定量碘。而深绿色蔬菜一般不是碘 的良好来源。答案：ACD", "module": "食品卫生", "is_single": false, "review_source_index": 73}, {"id": 5700, "index": 26, "type": "single", "stem": "人们发现下列-些现象:仅用肥肉喂狗一段时间,其体内血糖含量并未降低;谷类食物饲养鸭能迅速育肥;用只含蛋白质的食物饲养动物,动物也可以在体内积存脂肪;用蛋白质饲养患糖尿病的狗,发现狗尿液中含有葡萄糖。从以上现象分析糖、脂肪、氨基酸之间的互变关系,准确的是", "options": {"A": "糖、脂肪、氨基酸三者之间完全可以互变", "B": "糖和氨基酸可以互变,脂肪可以转变为糖和氨基酸", "C": "脂肪和氨基酸可以互变,糖可以转变为脂肪和氨基", "D": "糖和氨基酸可以转变为脂肪,氨基酸可以转变为糖"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P216。 参考人体分别在摄入高糖、高脂和高蛋白饮食状况下三种物质之间的转化关系。 人体摄入高糖膳食后，特别是总热量的摄入又较高时，体内胰岛素水平明显升高，胰高血糖素降低。在胰岛素作用下，小肠吸收的葡萄糖部分在骨骼肌合成肌糖原、在肝合成肝糖原和甘油三酯，后者输送至脂肪等组织储存:大部分葡萄糖直接被输送到脂肪组织、骨骼肌、脑等组织转换成甘油三酯等非糖物质储存或利用。 进食高蛋白膳食后，体内胰岛素水平中度升高，胰高血糖素水平升高。在两者协同作用下，肝糖原分解补充血糖、供应脑组织等。由小肠吸收的氨基酸主要在肝通过丙酮酸异生为葡萄糖，供应脑组织及其他肝外组织；部分氨基酸转化为乙酰辅酶A，合成甘油三酯，供应脂肪组织等肝外组织；还有部分氨基酸直接输送到骨骼肌。 进食高脂膳食后，体内胰岛素水平降低，胰高血糖素水平升高。在胰高血糖素作用下，肝糖原分解补充血糖、供给脑组织等。肌组织氨基酸分解，转化为丙酮酸，输送至肝异生为葡萄糖，供应血糖及肝外组织。由小肠吸收的甘油三酯主要输送到脂肪、肌组织等。脂肪组织在接受吸收的甘油三酯同时，也部分分解脂肪成脂肪酸，输送到其他组织。肝氧化脂肪酸，产生酮体，供应脑等肝外组织。", "module": "代谢的整合与调节", "is_single": true, "review_source_index": 74}, {"id": 4325, "index": 27, "type": "single", "stem": "亚硫酸盐能破坏肉、鱼等动物性食品中的", "options": {"A": "维生素A", "B": "维生素B1", "C": "维生素B2", "D": "维生素E"}, "answer": "B", "explanation": "《营养与食品卫生学》第8版 ": false, "review_source_index": 133}, {"id": 5188, "index": 62, "type": "single", "stem": "不引起红细胞沉降率加速的因素是", "options": {"A": "红细胞叠连增多", "B": "血浆胆固醇含量增多", "C": "血浆白蛋白含量增多", "D": "血浆球蛋白含量增多"}, "answer": "C", "explanation": "《生理学》第9版P63。若红细胞彼此以凹面相贴，称为红细胞叠连。发生叠连后，红细胞团块的总表面积与总体积之比减小，摩擦力相对减小而红细胞沉降率加快。通常血浆中纤维蛋白原、球蛋白和胆固醇的含量增高时，可加速红细胞叠连和沉降率；血浆中白蛋白、卵磷脂的含量增多时则可抑制叠连发生，使沉降率减慢。", "module": "血液", "is_single": true, "review_source_index": 135}, {"id": 1395, "index": 63, "type": "multiple", "stem": "科普文章的准确性包括（ ）。", "options": {"A": "事实要准", "B": "概念要准", "C": "数据要准", "D": "字数要准", "E": "语言要准"}, "answer": ["A", "B", "C", "E"], "explanation": "科普文章需准确传递知识信息，事实、概念、数据、语言准确都至关重要，而字数并非衡量科 普文章准确性的关键因素。答案：ABCE", "module": "人群营养", "is_single": false, "review_source_index": 138}, {"id": 2027, "index": 64, "type": "multiple", "stem": "个人健康档案的基本资料一般包括（ ）。", "options": {"A": "人口学资料", "B": "健康行为资料", "C": "临床资料", "D": "问题目录", "E": "生活资料"}, "answer": ["A", "B", "C"], "explanation": "个人健康档案基本资料涵盖人口学资料，如年龄、性别等；健康行为资料，像吸烟、运动等习 惯；临床资料，包含既往病史、过敏史等。问题目录不属于基本资料，生活资料表述宽泛不准确。答案：ABC", "module": "DRIs", "is_single": false, "review_source_index": 141}, {"id": 247, "index": 65, "type": "single", "stem": "食物中某营养素含量的计算公式是（ ）。", "options": {"A": "∑[食物量（g）×可食部×食物中某种营养素含量/100g]", "B": "∑[食物量（g）×可食部×食物中某种营养素含量×100g]", "C": "∑[食物量（g）×食物中某种营养素含量/100g]", "D": "∑[食物量（g）×可食部×食物中某种营养素含量]"}, "answer": "A", "explanation": "计算食物中某营养素含量，需考虑食物量、可食部，还要结合每100g食物中该营养素含量，是 用食物量乘以可食部再乘以每100g食物中营养素含量的比例（即营养素含量/100g ）。答案：A", "module": "食品卫生", "is_single": true, "review_source_index": 143}, {"id": 5757, "index": 66, "type": "single", "stem": "下丘脑视上核被损坏后,将出现下列哪种变化", "options": {"A": "尿量增加,尿浓缩", "B": "尿量增加,尿稀释", "C": "尿量减少,尿稀释", "D": "尿量减少,尿浓缩"}, "answer": "B", "explanation": "《生理学》第9版P246. 抗利尿激素（ADH),是一种九肽激素。它由位于下丘脑视上核和室旁核的神经内分泌细胞所合成。当创伤或者手术引起的下丘脑损伤，抗利尿激素合成和释放减少，会使集合管对水的重吸收减少，尿量明显增加，尿渗透压降低，尿稀释。", "module": "尿的生成和排出", "is_single": true, "review_source_index": 144}, {"id": 1082, "index": 67, "type": "multiple", "stem": "初乳中营养素含量比成熟乳丰富的有（ ）。", "options": {"A": "蛋白质", "B": "乳糖", "C": "长链多不饱和脂肪酸", "D": "脂肪", "E": "乳铁蛋白"}, "answer": ["A", "C", "E"], "explanation": "初乳中蛋白质、长链多不饱和脂肪酸、乳铁蛋白等含量比成熟乳丰富，而乳糖和脂肪含量低于 成熟乳。答案：ACE 。", "module": "DRIs", "is_single": false, "review_source_index": 146}, {"id": 213, "index": 68, "type": "multiple", "stem": "一般来说，蔬菜、水果类主要提供（ ）。", "options": {"A": "碳水化合物", "B": "膳食纤维", "C": "蛋白质", "D": "矿物质", "E": "维生素C和胡萝卜素"}, "answer": ["B", "D", "E"], "explanation": "答案：BDE分析：蔬菜、水果类食物主要提供膳食纤维、矿物质、维生素 C 和胡萝卜素，碳水 化合物含量较少，蛋白质含量极低。", "module": "食品卫生", "is_single": false, "review_source_index": 148}, {"id": 6089, "index": 69, "type": "single", "stem": "体内ATP生成的主要方式是", "options": {"A": "氧化磷酸化", "B": "底物水平磷酸化", "C": "三羧酸循环", "D": "磷酸肌酸分解"}, "answer": "A", "explanation": "《生物化学与分子生物学》第9版P132。 ATP作为机体最主要的能量载体，其生成量主要取决于氧化磷酸化的速率。", "module": "生物氧化", "is_single": true, "review_source_index": 149}, {"id": 1277, "index": 70, "type": "multiple", "stem": "常用的评价成人超重和肥胖的体格测量指标包括（ ）。", "options": {"A": "体重", "B": "体质指数", "C": "腰围", "D": "腰臀比值", "E": "腰围身高比值"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "答案：ABCDE评价成人超重和肥胖的体格测量指标主要有体重、体质指数（BMI）、腰围、腰臀 比值、腰围身高比值等。体重反映身体总体的重量情况；体质指数是通过体重和身高的关系来评估肥胖程度 ；腰围可反映腹部脂肪堆积；腰臀比值能体现腹部脂肪分布与整体脂肪分布的比例关系；腰围身高比值也有 助于判断肥胖情况。", "module": "人群营养", "is_single": false, "review_source_index": 151}, {"id": 1170, "index": 71, "type": "single", "stem": "当平均摄入量或中位摄入量在AI以下时，则（ ）判断群体摄入不足的程度。", "options": {"A": "不可能", "B": "可能", "C": "不知道能否", "D": "能"}, "answer": "A", "explanation": "AI（适宜摄入量）是通过观察或实验获得的健康人群某种营养素的摄入量。当平均摄入量或中 位摄入量在AI以下时，由于缺乏足够的资料来准确界定群体中摄入不足的比例，所以不可能判断群体摄入不 足的程度。答案：A", "module": "人群营养", "is_single": true, "review_source_index": 152}, {"id": 6145, "index": 72, "type": "single", "stem": "在糖酵解过程中,下列哪个酶催化的反应是不可逆的", "options": {"A": "醛缩酶", "B": "烯醇化酶", "C": "丙酮酸激酶", "D": "磷酸甘油酸激酶"}, "answer": "C", "explanation": "《生物化学与分子生物学》第9版P92。 糖酵解最后一步，由丙酮酸激酶催化，不可逆，是糖酵解的第三个限速步骤，也是第二次底物水平磷酸化。", "module": "糖代谢", "is_single": true, "review_source_index": 157}, {"id": 1030, "index": 73  "options": {"A": "促进胶原合成", "B": "促进类固醇羟化", "C": "促进铁吸收", "D": "促进神经递质合成"}, "answer": "C", "explanation": "维生素C参与多种羟化反应，能促进胶原合成、类固醇羟化、神经递质合成等。而促进铁吸收并 非是维生素C参与的羟化反应。答案：C", "module": "食物营养", "is_single": true, "review_source_index": 166}, {"id": 6049, "index": 80, "type": "single", "stem": "PAPS的前体氨基酸是", "options": {"A": "Trp", "B": "Ala", "C": "Tyr", "D": "Cys"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P191。半胱氨酸是体内硫酸根的主要来源。体内的硫酸根，一部分以无机盐的形式随尿排出，另一部分由ATP或化成活性硫酸根，即3‘-磷酸腺苷-5’磷酸硫酸PAPS。因此其前体氨基酸为半胱氨酸Cys。Trp 色氨酸； Ala 丙氨酸； Tyr 酪氨酸选D。", "module": "氨基酸代谢", "is_single": true, "review_source_index": 167}, {"id": 5212, "index": 81, "type": "single", "stem": "造血干细胞的主要特征是①数目相对稳定②自我复制能力强③能够多向性分化④具有特殊的形态特点", "options": {"A": "①②③", "B": "②③④", "C": "①②④", "D": "①②③④"}, "answer": "A", "explanation": "《生理学》第9版P61。造血干细胞具有自我复制、多向分化与重建长期造血的能力。造血干细胞具有对称性与非对称性有丝分裂能力。通过对称性有丝分裂产生两个完全相同的子代干细胞。通过非对称性有丝分裂产生一个子代干细胞和一个早期祖细胞。造血干细胞通过自我复制和自我维持可保持自身细胞数量的稳定；通过多向分化则可形成各系定向祖细胞。", "module": "血液", "is_single": true, "review_source_index": 169}, {"id": 3582, "index": 82, "type": "single", "stem": "下列关于食物蛋白质营养评价的描述中，错误的是：", "options": {"A": "进行蛋白质真消化率测定时，需要考虑粪代谢氮", "B": "蛋白质功效比值和生物价都是评价蛋白质利用率的方法", "C": "氨基酸评分仅考虑蛋白质氨基酸组成，未考虑蛋白质消化率", "D": "蛋白质净利用率=蛋白质功效比值×消化率"}, "answer": "D", "explanation": "蛋白质净利用率（NPU）= 生物价（BV）× 消化率，而不是蛋白质功效比值（PER）× 消化率。NPU = 储留氮÷摄入氮×100%，综合反映了蛋白质的消化率和利用率。", "module": "基础营养", "is_single": true, "review_source_index": 174}, {"id": 2224, "index": 83, "type": "multiple", "stem": "下列可以判断为肝癌高危人群的有（ ）", "options": {"A": "生活在肝癌高发区", "B": "年龄在35岁以上，有乙型肝炎病毒或丙型肝炎病毒感染的血清学证据", "C": "家庭成员中有人患肝癌", "D": "年龄在35岁以上，有慢性肝炎史者", "E": "幼时患过甲型肝炎"}, "answer": ["B", "D"], "explanation": "肝癌高危人群主要与病毒感染及肝脏基础疾病相关。A选项仅生活在高发区不是关键因素；C选 项家庭成员患肝癌并非直接判定标准；E选项甲型肝炎一般不发展为慢性，与肝癌关系不大。而乙肝、丙肝病 毒感染及慢性肝炎病史，年龄35岁以上，符合肝癌高危人群特征。答案：BD", "module": "人群营养", "is_single": false, "review_source_index": 175}, {"id": 2627, "index": 84, "type": "multiple", "stem": "关于副溶血弧菌食物中毒的叙述，正确的是（ ）。", "options": {"A": "沿海地区最常见的食物中毒", "B": "好发食品为海产品",   try { localPayload = JSON.parse(localStorage.getItem(RD_STORAGE_KEY) || 'null'); } catch (e) {}
  try {
    const response = await fetch(RD_PROGRESS_API + '?date=' + encodeURIComponent(RD_DATE) + '&card_key=' + encodeURIComponent(RD_CARD_KEY));
    if (response.ok) serverPayload = await response.json();
  } catch (e) {}
  const saved = Object.assign({},
    localPayload && localPayload.completed || {},
    serverPayload && serverPayload.completed || {}
  );
  lastConfirmedPosition = Math.max(
    Number(localPayload && localPayload.last_position || 0),
    Number(serverPayload && serverPayload.last_position || 0)
  );
  restoringProgress = true;
  Object.entries(saved).forEach(([questionId, record]) => {
    const qIdx = QUESTIONS.findIndex(q => String(q.id) === String(questionId));
    if (qIdx < 0) return;
    const answers = Array.isArray(record.answer) ? record.answer : [];
    userAnswers[qIdx] = answers.slice();
    const card = document.getElementById(`qcard-${qIdx}`);
    answers.forEach(key => {
      const option = card.querySelector(`.option[data-key="${key}"]`);
      if (option) option.classList.add('selected');
    });
    checkQuestion(qIdx, false);
    lastConfirmedPosition = Math.max(lastConfirmedPosition, qIdx + 1);
  });
  QUESTIONS.forEach((q, qIdx) => {
    if (!PRECOMPLETED_IDS.has(String(q.id)) || saved[String(q.id)]) return;
    const card = document.getElementById(`qcard-${qIdx}`);
    card.dataset.completed = 'true';
    card.classList.add('recorded');
    card.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));
    const button = document.getElementById(`checkBtn-${qIdx}`);
    button.disabled = true;
    button.textContent = '已记录完成';
    document.getElementById(`result-${qIdx}`).textContent = '已保存到总进度';
    lastConfirmedPosition = Math.max(lastConfirmedPosition, qIdx + 1);
  });
  restoringProgress = false;
  updateLiveSummary();
  if (Object.keys(saved).length) saveProgress();
  const completedCount = Object.keys(saved).length;
  if (completedCount > 0) {
    const nextIdx = QUESTIONS.findIndex((q, i) => document.getElementById(`qcard-${i}`).dataset.completed !== 'true');
    const resumeBadge = document.getElementById('resumeBadge');
    if (nextIdx >= 0) {
      resumeBadge.textContent = `📍 已恢复：上次做到第 ${lastConfirmedPosition} 题，本次从第 ${nextIdx + 1} 题继续`;
      resumeBadge.style.display = 'block';
      setTimeout(() => document.getElementById(`qcard-${nextIdx}`).scrollIntoView({behavior:'smooth', block:'start'}), 250);
    } else {
      resumeBadge.textContent = `✅ 已恢复：本卷 ${QUESTIONS.length} 题均已完成`;
      resumeBadge.style.display = 'block';
    }
  }
}

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const isSingle = q.is_single;
    const optionsHtml = Object.entries(q.options).map(([key, val]) =>
      `<div class="option ${isSingle?'option-single':'option-multi'}" data-q="${i}" data-key="${key}" onclick="selectOption(${i},'${key}',${isSingle})"><span class="option-key">${key}.</span><span>${val}</span></div>`
    ).join('');

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `qcard-${i}`;
    card.innerHTML = `
      <div class="q-header">
        <span class="q-number">#${i+1} <span style="font-weight:400;color:#999;font-size:13px">/ ${QUESTIONS.length}</span></span>
        <span><span class="q-type">${isSingle?'单选题':'多选题'}</span><span class="q-module">${q.module}</span></span>
      </div>
      <div class="q-stem">${q.stem}</div>
      <div class="options">${optionsHtml}</div>
      <div class="question-actions">
        <button class="btn-check-one" id="checkBtn-${i}" onclick="checkQuestion(${i})">✅ 确认本题</button>
        <span class="answer-result" id="result-${i}"></span>
      </div>
      <div class="explanation-box" id="exp-${i}">
        <div class="exp-label" id="answer-${i}">✅ 正确答案：</div>
        <div>${q.explanation.replace('\n','<br>')}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function selectOption(qIdx, key, isSingle) {
  const card = document.getElementById(`qcard-${qIdx}`);
  if (card.dataset.completed === 'true') return;
  const opts = card.querySelectorAll('.option');
  if (isSingle) {
    opts.forEach(o => o.classList.remove('selected'));
    opts.forEach(o => {
      if (o.dataset.key === key) o.classList.add('selected');
    });
    userAnswers[qIdx] = [key];
  } else {
    const el = card.querySelector(`.option[data-key="${key}"]`);
    el.classList.toggle('selected');
    const selected = [...card.querySelectorAll('.option.selected')].map(o => o.dataset.key);
    userAnswers[qIdx] = selected.length > 0 ? selected : null;
  }
}

function checkQuestion(qIdx, force=false) {
  const q = QUESTIONS[qIdx];
  const card = document.getElementById(`qcard-${qIdx}`);
  if (card.dataset.graded === 'true') return card.classList.contains('correct');
  const userAns = userAnswers[qIdx] || [];
  if (!userAns.length && !force) {
    alert('请先选择答案，再确认本题。');
    return null;
  }
  const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
  const isCorrect = userAns.length > 0 && JSON.stringify(userAns.slice().sort()) === JSON.stringify(correctAnswer);
  const opts = card.querySelectorAll('.option');
  card.dataset.graded = 'true';
  card.dataset.completed = 'true';
  card.classList.add(isCorrect ? 'correct' : 'wrong');
  opts.forEach(o => {
    o.classList.add('disabled');
    const key = o.dataset.key;
    if (correctAnswer.includes(key)) o.classList.add('correct-answer');
    if (userAns.includes(key) && !correctAnswer.includes(key)) o.classList.add('wrong-answer');
  });
  const result = document.getElementById(`result-${qIdx}`);
  result.textContent = isCorrect ? '回答正确' : `回答错误，正确答案：${correctAnswer.join('、')}`;
  result.className = `answer-result ${isCorrect ? 'correct-text' : 'wrong-text'}`;
  document.getElementById(`answer-${qIdx}`).textContent = `✅ 正确答案：${correctAnswer.join('、')}`;
  document.getElementById(`exp-${qIdx}`).classList.add('show');
  const button = document.getElementById(`checkBtn-${qIdx}`);
  button.disabled = true;
  button.textContent = '已确认';
  completedAnswers[String(q.id)] = {answer: userAns.slice().sort(), is_correct: isCorrect};
  lastConfirmedPosition = Math.max(lastConfirmedPosition, qIdx + 1);
  if (!restoringProgress) saveProgress();
  updateLiveSummary();
  return isCorrect;
}

window.addEventListener('pagehide', () => {
  const body = JSON.stringify(progressPayload());
  try {
    navigator.sendBeacon(RD_PROGRESS_API, new Blob([body], {type:'text/plain;charset=UTF-8'}));
  } catch (e) {}
});

function updateLiveSummary() {
  const graded = QUESTIONS.map((q, i) => document.getElementById(`qcard-${i}`)).filter(card => card.dataset.graded === 'true');
  const correct = graded.filter(card => card.classList.contains('correct')).length;
  const wrong = graded.length - correct;
  const pct = graded.length ? Math.round(correct / graded.length * 100) : 0;
  document.getElementById('scoreBadge').textContent = `已做 ${graded.length}/${QUESTIONS.length}｜正确 ${correct}`;
  document.getElementById('scoreBadge').style.color = pct >= 70 ? '#52c41a' : pct >= 50 ? '#faad14' : '#ff4d4f';
  document.getElementById('summaryTotal').textContent = graded.length;
  document.getElementById('summaryCorrect').textContent = correct;
  document.getElementById('summaryWrong').textContent = wrong;
  document.getElementById('summaryRate').textContent = pct + '%';
}

function submitQuiz() {
  QUESTIONS.forEach((q, i) => {
    if ((userAnswers[i] || []).length) checkQuestion(i, false);
  });

  const total = document.querySelectorAll('.question-card[data-graded="true"]').length;
  if (!total) {
    alert('还没有已作答题目。请先选择答案并确认本题。');
    return;
  }
  const correct = document.querySelectorAll('.question-card.correct').length;
  const wrong = total - correct;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreBadge').innerHTML = `${correct}/${total} (${pct}%)`;
  document.getElementById('scoreBadge').style.color = pct >= 70 ? '#52c41a' : pct >= 50 ? '#faad14' : '#ff4d4f';

  // Update summary
  document.getElementById('summaryTotal').textContent = total;
  document.getElementById('summaryCorrect').textContent = correct;
  document.getElementById('summaryWrong').textContent = wrong;
  document.getElementById('summaryRate').textContent = pct + '%';
  document.getElementById('summaryBar').classList.add('show');

  // Scroll to top
  window.scrollTo({top: 0, behavior: 'smooth'});

  // Show wrong list with detail
  const wrongIndices = [];
  const wrongDetails = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) {
      wrongIndices.push(i + 1);
      const userAns = userAnswers[i] || [];
      const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
      wrongDetails.push({
        idx: i + 1,
        id: q.id,
        module: q.module,
        stem: q.stem,
        userAnswer: userAns.length ? userAns.join(', ') : '（未作答）',
        correctAnswer: correctAnswer.join(', '),
      });
    }
  });
  const wrongNumsEl = document.getElementById('wrongNums');
  const detailText = document.getElementById('wrongDetailText');
  if (wrongIndices.length > 0) {
    wrongNumsEl.innerHTML = wrongIndices.map(n => `<span>#${n}</span>`).join('');
    // Build detail text for copying
    let text = '===== RD 错题报告 =====\n';
    text += '共 ' + wrongIndices.length + ' 题\n\n';
    wrongDetails.forEach((w, i) => {
      text += '--- 第' + w.idx + '题 ---\n';
      text += '题号: ' + w.idx + '  (数据库ID: ' + w.id + ')\n';
      text += '模块: ' + w.module + '\n';
      text += '题干: ' + w.stem + '\n';
      text += '你的答案: ' + w.userAnswer + '\n';
      text += '正确答案: ' + w.correctAnswer + '\n';
      text += '——————————————\n';
    });
    text += '\n请帮我分析这些错题的错因和薄弱点。';
    detailText.value = text;
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = '';
  } else {
    wrongNumsEl.innerHTML = '<span style="color:#52c41a;font-weight:600;">🎉 全部正确！</span>';
    detailText.value = '🎉 全部正确，太棒了！';
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = 'none';
  }
}

function resetQuiz() {
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    card.className = 'question-card';
    delete card.dataset.graded;
    card.querySelectorAll('.option').forEach(o => {
      o.classList.remove('selected', 'correct-answer', 'wrong-answer', 'disabled');
    });
    document.getElementById(`exp-${i}`).classList.remove('show');
    const checkBtn = document.getElementById(`checkBtn-${i}`);
    checkBtn.disabled = false;
    checkBtn.textContent = '✅ 确认本题';
    const result = document.getElementById(`result-${i}`);
    result.textContent = '';
    result.className = 'answer-result';
  });
  document.getElementById('scoreBadge').innerHTML = '待提交';
  document.getElementById('scoreBadge').style.color = '#667eea';
  document.getElementById('wrongList').classList.remove('show');
  document.getElementById('copyWrongBtn').style.display = 'none';
  document.getElementById('resumeBadge').style.display = 'none';
}

function copyWrongDetail() {
  const ta = document.getElementById('wrongDetailText');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try {
    navigator.clipboard.writeText(ta.value).then(() => {
      alert('✅ 已复制错题详情，请发给教练分析！');
    }).catch(() => {
      document.execCommand('copy');
      alert('✅ 已复制，请发给教练分析！');
    });
  } catch(e) {
    document.execCommand('copy');
    alert('✅ 已复制，请发给教练分析！');
  }
}

function copyWrongAnswers() {
  const wrongIndices = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) wrongIndices.push(i + 1);
  });
  if (wrongIndices.length === 0) {
    alert('🎉 全部正确，没有错题！');
    return;
  }
  const text = wrongIndices.join(', ');
  navigator.clipboard.writeText(text).then(() => {
    alert(`✅ 已复制错题号：${text}`);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert(`✅ 已复制错题号：${text}`);
  });
}

try {
  renderQuestions();
  document.getElementById('jsFallback').style.display = 'none';
  restoreProgress();
} catch(e) {
  document.getElementById('jsFallback').innerHTML =
    '<div style="font-size:48px;margin-bottom:16px;">❌</div>' +
    '<div style="font-size:16px;color:#ff4d4f;">题目加载失败</div>' +
    '<div style="font-size:13px;margin-top:8px;color:#999;">错误: ' + e.message + '</div>' +
    '<div style="font-size:13px;margin-top:4px;color:#999;">请截屏此错误信息发给教练修复</div>';
  console.error('RD题卡渲染错误:', e);
}
</script>
