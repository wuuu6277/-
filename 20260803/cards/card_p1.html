<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; padding: 20px; }
.container { max-width: 860px; margin: 0 auto; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border-radius: 16px; padding: 28px 32px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
.header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
.header .meta { font-size: 14px; opacity: 0.9; }
.controls { background: #fff; border-radius: 12px; padding: 16px 24px; margin-bottom: 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.controls button { padding: 10px 28px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
.btn-submit { background: #667eea; color: #fff; }
.btn-submit:hover { background: #5a6fd6; transform: translateY(-1px); }
.btn-reset { background: #e8e8e8; color: #555; }
.btn-reset:hover { background: #ddd; }
.score-badge { margin-left: auto; font-size: 16px; font-weight: 600; color: #667eea; background: #f0f2ff; padding: 6px 16px; border-radius: 20px; }
.question-card { background: #fff; border-radius: 12px; padding: 24px 28px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: all 0.2s; border-left: 4px solid transparent; }
.question-card.correct { border-left-color: #52c41a; background: #f6ffed; }
.question-card.wrong { border-left-color: #ff4d4f; background: #fff2f0; }
.q-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 8px; }
.q-number { font-size: 15px; font-weight: 700; color: #667eea; min-width: 60px; }
.q-type { font-size: 12px; padding: 2px 10px; border-radius: 10px; background: #f0f2ff; color: #667eea; font-weight: 600; }
.q-module { font-size: 12px; color: #999; margin-left: 4px; }
.q-stem { font-size: 16px; line-height: 1.7; margin-bottom: 16px; font-weight: 500; }
.options { display: flex; flex-direction: column; gap: 8px; }
.option { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border: 2px solid #e8e8e8; border-radius: 8px; cursor: pointer; transition: all 0.15s; font-size: 15px; line-height: 1.5; }
.option:hover { border-color: #667eea; background: #f8f9ff; }
.option.selected { border-color: #667eea; background: #f0f2ff; }
.option.correct-answer { border-color: #52c41a; background: #f6ffed; }
.option.wrong-answer { border-color: #ff4d4f; background: #fff2f0; }
.option-key { font-weight: 700; color: #667eea; min-width: 24px; }
.option.disabled { pointer-events: none; opacity: 0.85; }
.explanation-box { margin-top: 14px; padding: 14px 18px; background: #fafafa; border-radius: 8px; border-left: 4px solid #667eea; display: none; font-size: 14px; line-height: 1.7; color: #555; }
.explanation-box.show { display: block; }
.explanation-box .exp-label { font-weight: 700; color: #667eea; margin-bottom: 6px; }
.footer { text-align: center; color: #999; font-size: 12px; padding: 20px 0; }
.status-bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.stat-item { font-size: 13px; color: #666; }
.stat-item strong { color: #333; }
.summary-bar { background: #fff; border-radius: 12px; padding: 20px 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.summary-grid { display: flex; gap: 24px; flex-wrap: wrap; }
.summary-item { text-align: center; }
.summary-item .num { font-size: 28px; font-weight: 700; }
.summary-item .label { font-size: 13px; color: #999; margin-top: 2px; }
.btn-copy-wrong { background: #ff4d4f; color: #fff; }
.btn-copy-wrong:hover { background: #e04343; transform: translateY(-1px); }
.wrong-list { margin-top: 14px; padding: 14px 18px; background: #fff2f0; border: 1px solid #ffccc7; border-radius: 8px; display: none; }
.wrong-list.show { display: block; }
.wrong-list .wl-title { font-weight: 600; color: #ff4d4f; margin-bottom: 6px; font-size: 15px; }
.wrong-list .wl-nums { font-size: 14px; line-height: 1.8; color: #333; }
	.wrong-list .wl-nums span { display: inline-block; padding: 2px 10px; margin: 3px 4px; background: #fff1f0; border: 1px solid #ffa39e; border-radius: 4px; font-size: 13px; font-weight: 600; color: #cf1322; }
	.copy-area { margin-top: 14px; }
	.copy-area textarea { width:100%; height:140px; font-size:13px; font-family:"Courier New",monospace; padding:10px; border:1px solid #d9d9d9; border-radius:6px; background:#fafafa; resize:vertical; box-sizing:border-box; }
	.copy-area .copy-btn { margin-top:6px; padding:6px 20px; background:#667eea; color:#fff; border:none; border-radius:6px; font-size:13px; cursor:pointer; }
	.copy-area .copy-btn:hover { background:#5a6fd6; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
.question-card { animation: fadeIn 0.3s ease; }
</style>
</head>

<div class="container">

      <div style="font-size:16px;">题目加载中...</div>
      <div style="font-size:13px;margin-top:8px;">如果持续看不到题目，请刷新页面或重新生成题卡</div>
    </div>
  </div>

</div>

<script>
const QUESTIONS = [{"id": 3440, "index": 1, "type": "multiple", "stem": "关于口服营养补充（ONS），以下叙述正确的有？", "options": {"A": "ONS是最为经济有效的营养治疗方式", "B": "每天通过ONS提供的能量大于400~600kcal才能更好地发挥作用", "C": "ONS制剂宜大口、快速服用以提高依从性", "D": "ONS通常作为加餐，建议一日三餐之间和晚餐后使用，即\"3+3\"模式", "E": "每次20~50ml，每次间隔10~30分钟"}, "answer": ["A", "B", "D", "E"], "explanation": "C错误：ONS制剂宜小口、慢速服用，尤其是高能量密度制剂，以免出现头晕、心慌、腹泻等不适。A正确：ONS是最为经济有效的营养治疗方式；B正确：每天>400~600kcal才能更好发挥作用；D正确：\"3+3\"模式；E正确：每次20~50ml，间隔10~30分钟。", "module": "临床营养", "is_single": false}, {"id": 3465, "index": 2, "type": "multiple", "stem": "肠外营养的代谢相关并发症包括？", "options": {"A": "高血糖和低血糖", "B": "脂肪超载综合征", "C": "肝功能损害（PN相关性肝病）", "D": "再喂养综合征", "E": "导管相关血流感染"}, "answer": ["A", "B", "C", "D"], "explanation": "E错误：导管相关血流感染属于导管相关并发症，而非代谢相关并发症。PN代谢相关并发症包括：糖代谢紊乱（高/低血糖）、氨基酸代谢紊乱、脂肪超载综合征、微量营养素异常、再喂养综合征、肝功能损害、胆囊胆泥和结石形成、肾结石、代谢性骨病等。", "module": "临床营养", "is_single": false}, {"id": 2379, "index": 3, "type": "multiple", "stem": "食源性疾病的病原物可概括为（ ）。", "options": {"A": "寄生虫", "B": "生物性病原物", "C": "化学性病原物", "D": "物理性病原物", "E": "放射性核素"}, "answer": ["B", "C", "D"], "explanation": "食源性疾病病原物分为生物性、化学性和物理性三类，A选项寄生虫属于生物性病原物中的一类 。生物性、化学性、物理性病原物能较全面概括食源性疾病病原物。答案：BCD", "module": "临床营养", "is_single": false}, {"id": 2378, "index": 4, "type": "multiple", "stem": "环境中二英的主要来源包括（ ）。", "options": {"A": "除草剂和落叶剂的使用", "B": "医院的废弃物", "C": "环境中光化学反应", "D": "城市垃圾的焚烧", "E": "汽车尾气"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "二噁英主要来源于城市垃圾的焚烧、医院的废弃物、环境中光化学反应、除草剂和落叶剂的使 用以及汽车尾气等。这些来源都可能导致二噁英的产生和释放到环境中。所以，正确答案是ABCDE。", "module": "临床营养", "is_single": false}, {"id": 2381, "index": 5, "type": "multiple", "stem": "食物中毒按病原物质分为（ ）。", "options": {"A": "维生素A中毒", "B": "有毒动植物中毒", "C": "真菌毒素和霉变食品中毒", "D": "细菌性食物中毒"}, "answer": ["B", "C", "D"], "explanation": "食物中毒按病原物质分为细菌性食物中毒、真菌毒素和霉变食品中毒、有毒动植物中毒、化学 性食物中毒等几类。A选项维生素A中毒不属于食物中毒按病原物质分类范畴。答案为BCD 。", "module": "临床营养", "is_single": false}, {"id": 3480, "index": 6, "type": "multiple", "stem": "严重应激高代谢反应与单纯性饥饿代谢适应相比，以下叙述正确的有？", "options": {"A": "应激时静息能量消耗升高，饥饿时降低", "B": "应激时尿氮损失增加，饥饿时尿氮损失减少", "C": "应激时主要能源为脂肪+氨基酸，饥饿时主要为脂肪", "D": "应激时酮体产生增加，饥饿时酮体产生减少", "E": "应激时糖异生增加，饥饿时糖异生也增加"}, "answer": ["A", "B", "C"], "explanation": "D错误：应激时酮体产生+，而饥饿时酮体产生++++（饥饿时酮体产生更多）。E错误：糖异生应激时+++，饥饿时+（应激时更明显）。A、B、C均正确。", "module": "临床营养", "is_single": false}, {"id": 3957, "index": 7, "type": "single", "stem": "糖尿病的诊断是空腹血糖水平大于等于", "options": {"A": "7.0mmol/L", "B": "8.0mmol/L", "C": "9.0mmol/L", "D": "10.0mmol/L"}, "answer": "A", "explanation": "《中国2型糖尿病防治指南（2020版）。》", "module": "临床营养", "is_single": true}, {"id": 4118, "index": 8, "type": "single", "stem": "消化性溃疡合并急性胃穿孔患者应", "options": {"A": "禁食", "B": "经口清流饮食", "C": "经口半流质饮食", "D": "经口普通流质饮食"}, "answer": "A", "explanation": "消化性溃疡合并急性胃穿孔患者为防止激发感染,选择禁食。", "module": "临床营养", "is_single": true}, {"id": 4050, "index": 9, "type": "single", "stem": "下列关于肾上腺皮质功能代谢膳食的说法，错误的是", "options": {"A": "为不平衡膳食", "B": "适用于胆固醇增多症患者", "C": "多选用含钾丰富的食物", "D": "试验期内停用中药和饮茶"}, "answer": "A", "explanation": "肾上腺皮质功能代谢膳食为平衡膳食。", "module": "临床营养", "is_single": true}, {"id": 4119, "index": 10, "type": "single", "stem": "【技师不做】憩室病患者应选择的食物", "options": {"A": "低硬度的膳食", "B": "低脂膳食", "C": "高纤维膳食", "D": "以上均正确"}, "answer": "D", "explanation": "本题主要考查憩室病的饮食治疗,憩室病的经典膳食治疗是使用低硬度的食物,同时,高膳食纤维有利于粪便松软、增加粪便的产生,使排便更通畅,从而减轻结肠内压力;使胃肠道动力学异常和内脏感觉异常。用高脂膳食会加重结肠平滑肌收缩而诱发憩室病临床症状,因此应食用低脂膳食。", "module": "临床营养", "is_single": true}, {"id": 4018, "index": 11, "type": "single", "stem": "软食适用于", "options": {"A": "腹部手术患者", "B": "痢疾患者", "C": "消化不良患者", "D": "喉部手术患者"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P182。软食易咀嚼、易消化,可减少胃肠负担,适用于消化不良的患者。", "module": "临床营养", "is_single": true}, {"id": 4074, "index": 12, "type": "single", "stem": "以下膳食能量高低顺序正确的是", "options": {"A": "普通膳食>软食>半流质膳食>流质膳食", "B": "普通膳食>半流质膳食>软食>流质膳食", "C": "流质膳食>软食>半流质膳食>普通膳食", "D": "流质膳食>半流质膳食>软食>普通膳食"}, "answer": "A", "explanation": "普通膳食能量接近正常膳食,软食能量略低于普通膳食,总能量为1800~2400kcal/d,半流质膳食总能量1500~1800kcal/d,流质膳食总能量在800~1600kcal/d,故此正确答案选A。", "module": "临床营养", "is_single": true}, {"id": 3995, "index": 13, "type": "single", "stem": "为预防肿瘤,应鼓励人们①少吃动物性食物②增加植物性食物摄取③限盐④限制饮酒⑤多吃蔬菜", "options": {"A": "①②③④", "B": "①②③⑤", "C": "①②④⑤", "D": "①②③④⑤"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P223。十条防癌建议：在正常体重范围内尽可能的瘦、从事积极的身体活动作为日常生活中的一部分、限制高能量密度的食物、以植物来源的食物为主，每日至少吃5份（至少400g）不同种类的非淀粉蔬菜和水果、限制红肉摄入，避免加工的肉类、限制含酒精饮料、限制盐的摄入量、不推荐使用膳食补充剂预防癌症、母亲对婴幼儿最好进行6个月的完全母乳喂养、癌症病人接受治疗的同时，生活及饮食应该遵守癌症预防的建议。", "module": "临床营养", "is_single": true}, {"id": 4006, "index": 14, "type": "single", "stem": "为促进尿酸的排出,痛风患者应每天保证摄入充足的", "options": {"A": "主食", "B": "畜肉", "C": "水产品", "D": "水"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P217。高尿酸血症和痛风病人应多饮水以利于尿酸的排出，这是饮食治疗中较为重要的环节。", "module": "临床营养", "is_single": true}, {"id": 3969, "index": 15, "type": "single", "stem": "抑制肿瘤作用机制不涉及抗氧化的是", "options": {"A": "维生素C", "B": "维生素D", "C": "β-胡萝卜素", "D": "维生素E"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P79，低维生素D与高血压、部分肿瘤、糖尿病、心脑血管疾病、脂肪肝、低水平的炎性反应、自身免疫性疾病等密切相关。P76，β-胡萝卜素具有抗氧化作用和抑制肿瘤生长。 P80，维生素E具有抗氧化作用。 P94，维生素C具有很强的抗氧化作用。 只有维生素D是可以抑制肿瘤作用机制但是没有涉及抗氧化作用的。", "module": "临床营养", "is_single": true}, {"id": 4127, "index": 16, "type": "single", "stem": "【技师不做】肠易激综合征的病理生理基础是", "options": {"A": "胃肠道动力学异常", "B": "幽门螺旋杆菌感染", "C": "超敏反应", "D": "病毒感染"}, "answer": "A", "explanation": "本题主要考查肠易激综合征的病理变化,肠易激综合征的病理生理基础主要是", "module": "临床营养", "is_single": true}, {"id": 4128, "index": 17, "type": "single", "stem": "【技师不做】慢性食管炎膳食可选择的食物为", "options": {"A": "巧克力", "B": "脱脂牛奶", "C": "全脂牛奶", "D": "咖啡"}, "answer": "B", "explanation": "慢性食管炎选择脱脂牛奶,可以减少刺激。", "module": "临床营养", "is_single": true}, {"id": 4015, "index": 18, "type": "single", "stem": "李某,某公司经理,体型肥胖,初诊痛风患者,如果为其选择优质蛋白质,适宜的食物为", "options": {"A": "动物内脏", "B": "蛋类", "C": "肉类", "D": "禽类"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P218。痛风病人应限制蛋白质的摄入量从而控制嘌呤的摄取，可按每公斤体重0.8～1.0计算，宜选择牛奶、鸡蛋及植物蛋白质为好。", "module": "临床营养", "is_single": true}, {"id": 4035, "index": 19, "type": "single", "stem": "下列不属于半流质膳食的是", "options": {"A": "面条", "B": "稀饭", "C": "蛋花汤", "D": "水饺"}, "answer": "D", "explanation": const userAnswers = {};

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const isSingle = q.is_single;
    const optionsHtml = Object.entries(q.options).map(([key, val]) =>
      `<div class="option ${isSingle?'option-single':'option-multi'}" data-q="${i}" data-key="${key}" onclick="selectOption(${i},'${key}',${isSingle})"><span class="option-key">${key}.</span><span>${val}</span></div>`
    ).join('');

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `qcard-${i}`;
    card.innerHTML = `
      <div class="q-header">
        <span class="q-number">#${i+1} <span style="font-weight:400;color:#999;font-size:13px">/ ${QUESTIONS.length}</span></span>
        <span><span class="q-type">${isSingle?'单选题':'多选题'}</span><span class="q-module">${q.module}</span></span>
      </div>
      <div class="q-stem">${q.stem}</div>
      <div class="options">${optionsHtml}</div>
      <div class="exp-toggle"><button id="expBtn-${i}" onclick="toggleExp(${i})" style="background:none;border:1px solid #d0d0d0;border-radius:6px;padding:4px 14px;font-size:13px;cursor:pointer;color:#667eea">📖 查看解析</button></div>
      <div class="explanation-box" id="exp-${i}">
        <div class="exp-label">📖 解析</div>
        <div>${q.explanation.replace('\n','<br>')}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function selectOption(qIdx, key, isSingle) {
  const card = document.getElementById(`qcard-${qIdx}`);
  const opts = card.querySelectorAll('.option');
  if (isSingle) {
    opts.forEach(o => o.classList.remove('selected'));
    opts.forEach(o => {
      if (o.dataset.key === key) o.classList.add('selected');
    });
    userAnswers[qIdx] = [key];
  } else {
    const el = card.querySelector(`.option[data-key="${key}"]`);
    el.classList.toggle('selected');
    const selected = [...card.querySelectorAll('.option.selected')].map(o => o.dataset.key);
    userAnswers[qIdx] = selected.length > 0 ? selected : null;
  }
}

function toggleExp(qIdx) {
  const box = document.getElementById(`exp-${qIdx}`);
  const btn = document.getElementById(`expBtn-${qIdx}`);
  if (box.classList.contains('show')) {
    box.classList.remove('show');
    btn.innerHTML = '📖 查看解析';
  } else {
    box.classList.add('show');
    btn.innerHTML = '📎 收起解析';
  }
}

function submitQuiz() {
  let correct = 0, wrong = 0;
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    const opts = card.querySelectorAll('.option');
    const exp = document.getElementById(`exp-${i}`);
    const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
    const userAns = userAnswers[i] || [];
    const isCorrect = userAns.length > 0 && JSON.stringify(userAns.slice().sort()) === JSON.stringify(correctAnswer);

    opts.forEach(o => o.classList.add('disabled'));
    if (isCorrect) {
      card.classList.add('correct');
      correct++;
    } else {
      card.classList.add('wrong');
      wrong++;
    }
    // Highlight correct/incorrect options
    opts.forEach(o => {
      const k = o.dataset.key;
      const isUser = userAns.includes(k);
      const isRight = correctAnswer.includes(k);
      if (isUser && isRight) o.classList.add('correct-answer');
      else if (isUser && !isRight) o.classList.add('wrong-answer');
      else if (!isUser && isRight) o.classList.add('correct-answer');
    });
    exp.classList.add('show');
  });

  const total = QUESTIONS.length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreBadge').innerHTML = `${correct}/${total} (${pct}%)`;
  document.getElementById('scoreBadge').style.color = pct >= 70 ? '#52c41a' : pct >= 50 ? '#faad14' : '#ff4d4f';

  // Update summary
  document.getElementById('summaryTotal').textContent = total;
  document.getElementById('summaryCorrect').textContent = correct;
  document.getElementById('summaryWrong').textContent = wrong;
  document.getElementById('summaryRate').textContent = pct + '%';
  document.getElementById('summaryBar').classList.add('show');

  // Scroll to top
  window.scrollTo({top: 0, behavior: 'smooth'});

  // Show wrong list with detail
  const wrongIndices = [];
  const wrongDetails = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) {
      wrongIndices.push(i + 1);
      const userAns = userAnswers[i] || [];
      const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
      wrongDetails.push({
        idx: i + 1,
        id: q.id,
        module: q.module,
        stem: q.stem,
        userAnswer: userAns.length ? userAns.join(', ') : '（未作答）',
        correctAnswer: correctAnswer.join(', '),
      });
    }
  });
  const wrongNumsEl = document.getElementById('wrongNums');
  const detailText = document.getElementById('wrongDetailText');
  if (wrongIndices.length > 0) {
    wrongNumsEl.innerHTML = wrongIndices.map(n => `<span>#${n}</span>`).join('');
    // Build detail text for copying
    let text = '===== RD 错题报告 =====\n';
    text += '共 ' + wrongIndices.length + ' 题\n\n';
    wrongDetails.forEach((w, i) => {
      text += '--- 第' + w.idx + '题 ---\n';
      text += '题号: ' + w.idx + '  (数据库ID: ' + w.id + ')\n';
      text += '模块: ' + w.module + '\n';
      text += '题干: ' + w.stem + '\n';
      text += '你的答案: ' + w.userAnswer + '\n';
      text += '正确答案: ' + w.correctAnswer + '\n';
      text += '——————————————\n';
    });
    text += '\n请帮我分析这些错题的错因和薄弱点。';
    detailText.value = text;
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = '';
  } else {
    wrongNumsEl.innerHTML = '<span style="color:#52c41a;font-weight:600;">🎉 全部正确！</span>';
    detailText.value = '🎉 全部正确，太棒了！';
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = 'none';
  }
}

function resetQuiz() {
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    card.className = 'question-card';
    card.querySelectorAll('.option').forEach(o => {
      o.classList.remove('selected', 'correct-answer', 'wrong-answer', 'disabled');
    });
    document.getElementById(`exp-${i}`).classList.remove('show');
  });
  document.getElementById('scoreBadge').innerHTML = '待提交';
  document.getElementById('scoreBadge').style.color = '#667eea';
  document.getElementById('wrongList').classList.remove('show');
  document.getElementById('copyWrongBtn').style.display = 'none';
}

function copyWrongDetail() {
  const ta = document.getElementById('wrongDetailText');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try {
    navigator.clipboard.writeText(ta.value).then(() => {
      alert('✅ 已复制错题详情，请发给教练分析！');
    }).catch(() => {
      document.execCommand('copy');
      alert('✅ 已复制，请发给教练分析！');
    });
  } catch(e) {
    document.execCommand('copy');
    alert('✅ 已复制，请发给教练分析！');
  }
}

function copyWrongAnswers() {
  const wrongIndices = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) wrongIndices.push(i + 1);
  });
  if (wrongIndices.length === 0) {
    alert('🎉 全部正确，没有错题！');
    return;
  }
  const text = wrongIndices.join(', ');
  navigator.clipboard.writeText(text).then(() => {
    alert(`✅ 已复制错题号：${text}`);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert(`✅ 已复制错题号：${text}`);
  });
}

try {
  renderQuestions();
  document.getElementById('jsFallback').style.display = 'none';
} catch(e) {
  document.getElementById('jsFallback').innerHTML =
    '<div style="font-size:48px;margin-bottom:16px;">❌</div>' +
    '<div style="font-size:16px;color:#ff4d4f;">题目加载失败</div>' +
    '<div style="font-size:13px;margin-top:8px;color:#999;">错误: ' + e.message + '</div>' +
    '<div style="font-size:13px;margin-top:4px;color:#999;">请截屏此错误信息发给教练修复</div>';
  console.error('RD题卡渲染错误:', e);
}
</script>
<script>
(function() {
  const RD_CARD_KEY = "2026-08-03-RD每日题卡_20260803_Part1_上午50题";
  const RD_CARD_FILE = "RD每日题卡_20260803_Part1_上午50题.html";
  const RD_DATE = "2026-08-03";
  const RD_STORAGE_KEY = "rd-progress:" + RD_CARD_KEY;
  const RD_HISTORY_KEY = RD_STORAGE_KEY + ":attempted";
  function localHost() {
    const h = location.hostname;
    return location.protocol === "http:" && (h === "localhost" || h === "127.0.0.1" || /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(h));
  }
  function questionId(card, idx) {
    let index = card && card.id.indexOf('qcard-') === 0 ? Number(card.id.slice(6)) : idx;
    try { if (QUESTIONS[index]) return String(QUESTIONS[index].id); } catch (e) {}
    return String(index + 1);
  }
  function remember(card, idx) {
    const qid = questionId(card, idx);
    let history = {};
    try { history = JSON.parse(localStorage.getItem(RD_HISTORY_KEY) || '{}'); } catch (e) {}
    history[qid] = true;
    try { localStorage.setItem(RD_HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
  }
  function snapshot() {
    const attempted = {};
    let history = {};
    try { history = JSON.parse(localStorage.getItem(RD_HISTORY_KEY) || '{}'); } catch (e) {}
    Object.keys(history).forEach(qid => attempted[qid] = []);
    document.querySelectorAll('[id^="qcard-"], .q').forEach((card, idx) => {
      const selected = [...card.querySelectorAll('.option.selected, input:checked')].map(el => el.dataset?.key || el.value).filter(Boolean);
      const questionId = questionIdForCard(card, idx);
      if (selected.length) attempted[questionId] = [...new Set(selected)].sort();
    });
    return {card_key: RD_CARD_KEY, card_filename: RD_CARD_FILE, date: RD_DATE, attempted: attempted, updated_at: new Date().toISOString()};
  }
  function questionIdForCard(card, idx) { return questionId(card, idx); }
  function paint(data) {
    let el = document.getElementById('rdAutoProgress');
    if (!el) { el = document.createElement('div'); el.id = 'rdAutoProgress'; el.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:9999;background:#fff;padding:8px 12px;border-radius:8px;box-shadow:0 2px 10px #0002;font-size:13px;color:#555'; document.body.appendChild(el); }
    el.textContent = '已自动记录：' + Object.keys(data.attempted || {}).length + '题';
  }
  function apply(data) {
    const attempted = data && data.attempted || {};
    Object.entries(attempted).forEach(([qid, values]) => {
      let index = -1;
      try { index = QUESTIONS.findIndex(q => String(q.id) === String(qid)); } catch (e) {}
      const card = index >= 0 ? (document.getElementById('qcard-' + index) || document.getElementById('c' + (index + 1))) : null;
      if (!card) return;
      (values || []).forEach(key => {
        const option = card.querySelector('.option[data-key="' + key + '"], input[value="' + key + '"]');
        if (option && option.classList && option.classList.contains('option')) option.click();
        else if (option) option.checked = true;
      });
    });
    paint(data || {attempted: {}});
  }
  async function restore() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(RD_STORAGE_KEY) || 'null'); } catch (e) {}
    if (localHost()) {
      try {
        const r = await fetch(location.origin + '/api/progress?date=' + encodeURIComponent(RD_DATE) + '&card_key=' + encodeURIComponent(RD_CARD_KEY));
        if (r.ok) data = await r.json();
      } catch (e) {}
    }
    if (data) apply(data);
  }
  function save() {
    const data = snapshot();
    try { localStorage.setItem(RD_STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    paint(data);
    if (localHost()) {
      try { navigator.sendBeacon(location.origin + '/api/progress', new Blob([JSON.stringify(data)], {type:'application/json'})); } catch (e) {}
    }
  }
  function init() {
    document.addEventListener('click', e => {
      const target = e.target.closest('.option, .op, input');
      if (!target) return;
      const card = target.closest('[id^="qcard-"], .q');
      if (card) { const cards = [...document.querySelectorAll('[id^="qcard-"], .q')]; remember(card, cards.indexOf(card)); }
      setTimeout(save, 0);
    });
    document.addEventListener('change', e => {
      const card = e.target.closest('[id^="qcard-"], .q');
      if (card) { const cards = [...document.querySelectorAll('[id^="qcard-"], .q')]; remember(card, cards.indexOf(card)); }
      save();
    });
    window.addEventListener('beforeunload', save);
    restore().finally(() => setTimeout(save, 300));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script></body>
</html>
