* { margin: 0; padding: 0; box-sizing: border-box; }

.explanation-box { margin-top: 14px; padding: 14px 18px; background: #fafafa; border-radius: 8px; border-left: 4px solid #667eea; display: none; font-size: 14px; line-height: 1.7; color: #555; }
.explanation-box.show { display: block; }
.explanation-box .exp-label { font-weight: 700; color: #667eea; margin-bottom: 6px; }

.stat-item { font-size: 13px; color: #666; }

.summary-bar { background: #fff; border-radius: 12px; padding: 20px 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.summary-grid { display: flex; gap: 24px; flex-wrap: wrap; }

.summary-item .num { font-size: 28px; font-weight: 700; }
.summary-item .label { font-size: 13px; color: #999; margin-top: 2px; }
.btn-copy-wrong { background: #ff4d4f; color: #fff; }

.wrong-list { margin-top: 14px; padding: 14px 18px; background: #fff2f0; border: 1px solid #ffccc7; border-radius: 8px; display: none; }
.wrong-list.show { display: block; }
.wrong-list .wl-title { font-weight: 600; color: #ff4d4f; margin-bottom: 6px; font-size: 15px; }

	.wrong-list .wl-nums span { display: inline-block; padding: 2px 10px; margin: 3px 4px; background: #fff1f0; border: 1px solid #ffa39e; border-radius: 4px; font-size: 13px; font-weight: 600; color: #cf1322; }
	.copy-area { margin-top: 14px; }

	.copy-area .copy-btn { margin-top:6px; padding:6px 20px; background:#667eea; color:#fff; border:none; border-radius:6px; font-size:13px; cursor:pointer; }

@keyframes fadeIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }

<script>
const QUESTIONS = [{"id": 630, "index": 1, "type": "multiple", "stem": "在人群中，不同的（ ）都会使其对营养素的需求存在差异。", "options": {"A": "性别", "B": "年龄", "C": "体型", "D": "活动状态", "E": "生活状态"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "性别、年龄、体型、活动状态和生活状态这些因素，都会在能量消耗、身体机能、代谢特点等 方面产生影响，进而导致对营养素需求有差异。答案：ABCDE", "module": "食品卫生", "is_single": false}, {"id": 2390, "index": 2, "type": "multiple", "stem": "下列食物中属于豆类及制品的有（ ）。", "options": {"A": "大豆", "B": "豆浆", "C": "豆腐", "D": "千张", "E": "腐竹"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "大豆是豆类，豆浆、豆腐、千张、腐竹都是以大豆等豆类为原料加工制成的制品，都属于豆类 及制品。答案：ABCDE", "module": "DRIs", "is_single": false}, {"id": 210, "index": 3, "type": "multiple", "stem": "下面三餐分配合理的有（ ）。", "options": {"A": "早、中、晚三餐能量分别占全天能量的1/3、1/3、1/3", "B": "早、中、晚三餐能量分别占全天能量的1/5、2/5、2/5", "C": "中餐占全天总能量的40%，早晚餐各占30%", "D": "中餐占全天总能量的30%～40%，早餐占全天总能量的25%～30%，晚餐各占30%～40%", "E": "以上均不合理"}, "answer": ["A", "B", "C"], "explanation": "正确答案：A、B、C。选项解析：A.早、中、晚三餐能量分别占全天能量的1/3、1/3、1/3；B.早、中、晚三餐能量分别占全天能量的1/5、2/5、2/5；C.中餐占全天总能量的40%，早晚餐各占30%；D.中餐占全天总能量的30%～40%，早餐占全天总能量的25%～30%，晚餐各占30%～40%；E.以上均不合理。建议查阅教材相应章节巩固知识。", "module": "食品卫生", "is_single": false}, {"id": 1281, "index": 4, "type": "multiple", "stem": "鸡蛋蛋白质中，可弥补谷类与豆类食物蛋白质不足的氨基酸是（ ）。", "options": {"A": "赖氨酸", "B": "蛋氨酸", "C": "色氨酸", "D": "苏氨酸", "E": "苯丙氨酸"}, "answer": ["A", "B"], "explanation": "这道题考查的是食物蛋白质的营养价值及互补作用。谷类蛋白质中赖氨酸含量较低，蛋氨酸相 对较高；豆类蛋白质中蛋氨酸含量较低，赖氨酸相对较高。而鸡蛋蛋白质中的赖氨酸和蛋氨酸含量均较高 ，当与谷类和豆类食物混合食用时，可以弥补它们各自蛋白质中赖氨酸或蛋氨酸的不足，从而提高蛋白质的 营养价值，这种作用称为蛋白质互补作用。所以，鸡蛋蛋白质中能弥补谷类与豆类食物蛋白质不足的氨基酸 是赖氨酸和蛋氨酸，即选项 A 和选项 B。答案：AB", "module": "人群营养", "is_single": false}, {"id": 708, "index": 5, "type": "multiple", "stem": "一般来说，动物性食物主要提供（ ）。", "options": {"A": "碳水化合物", "B": "脂肪", "C": "蛋白质", "D": "矿物质", "E": "维生素A和B族维生素"}, "answer": ["B", "C", "D", "E"], "explanation": "正确答案：B、C、D、E。选项解析：A.碳水化合物；B.脂肪；C.蛋白质；D.矿物质；E.维生素A和B族维生素。建议查阅教材相应章节巩固知识。", "module": "食品卫生", "is_single": false}, {"id": 1321, "index": 6, "type": "multiple", "stem": "良质咸肉的特点是（ ）。", "options": {"A": "外表干燥", "B": "切面平整", "C": "质地稍软", "D": "肌肉呈咖啡色", "E": "脂肪呈黄色"}, "answer": ["A", "B"], "explanation": "良质咸肉外表应干燥，切面平整，质地紧密坚实，肌肉呈红色或暗红色，脂肪白色或微黄色。 C选项质地稍软不符合坚实特点，D选项肌肉咖啡色不对，应为红或暗红色。答案：AB 。", "module": "食品卫生", "is_single": false}, {"id": 1695, "index": 7, "type": "multiple", "stem": "在营养宣教中，可运用的语言表达技巧有（ ）。", "options": {"A": "现身说法", "B": "美化法", "C": "假借法", "D": "丑化法", "E": "隐喻法"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "答案:ABCDE解析:营养宣教中，可运用的语言表达技巧有现身说法、美化法、假借法、丑化法、 隐喻法等，只要运用恰当，均能增强宣教效果。", "module": "食物营养", "is_single": false}, {"id": 2699, "index": 8, "type": "multiple", "stem": "膳食蛋白质中非必需氨基酸（ ）具有节约蛋氨酸的作用。", "options": {"A": "半胱氨酸", "B": "酪氨酸", "C": "精氨酸", "D": "丝氨酸"}, "answer": ["A", "B"], "explanation": "正确答案：A、B。选项解析：A.半胱氨酸；B.酪氨酸；C.精氨酸；D.丝氨酸。建议查阅教材相应章节巩固知识。", "module": "食物营养", "is_single": false}, {"id": 2021, "index": 9, "type": "multiple", "stem": "下列（ ）属于膳食调查的常用方法。", "options": {"A": "称重法", "B": "机体营养状况检查", "C": "24h回顾法", "D": "记账法", "E": "化学分析法"}, "answer": ["A", "C", "D", "E"], "explanation": "答案：ACDE膳食调查的常用方法有称重法、记账法、 24h 回顾法、化学分析法等，机体营养状 况检查不属于膳食调查的常用方法。", "module": "DRIs", "is_single": false}, {"id": 207, "index": 10, "type": "multiple", "stem": "西方国家酒店餐厅形式包括哪几种（ ）", "options": {"A": "酒店餐厅", "B": "酒店咖啡厅", "C": "宴会厅", "D": "客房用餐服务", "E": "快餐店"}, "answer": ["A", "B", "C", "D"], "explanation": "西方国家酒店餐厅形式多样，酒店餐厅是常见主体形式；酒店咖啡厅提供休闲餐饮服务；宴会 厅用于举办大型活动、宴会等餐饮场合；客房用餐服务也是酒店餐饮服务的一种特殊形式。而快餐店一般不 属于酒店内部特有的餐厅形式。 答案：ABCD", "module": "食品卫生", "is_single": false}, {"id": 3742, "index": 11, "type": "single", "stem": "维生素C含量最少的是", "options": {"A": "柑、橘、橙、柚", "B": "枣", "C": "辣椒、韭菜", "D": "苹果、梨"}, "answer": "D", "explanation": "苹果和梨中维生素C的含量很少。", "module": "基础营养", "is_single": true}, {"id": 4149, "index": 12, "type": "single", "stem": "会出现神经损伤症状食物中毒的是", "options": {"A": "霉变甘蔗", "B": "四季豆", "C": "亚硝酸钠", "D": "葡萄球菌肠毒素"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P391。病人可死于呼吸衰竭，幸存者则留下严重的神经系统后遗症，导致终生残疾。", "module": "食品卫生", "is_single": true}, {"id": 4219, "index": 13, "type": "single", "stem": "HACCP中应用控制措施时确定的能确保消除或降低危害的技术指标是", "options": {"A": "危害分析", "B": "关键控制点", "C": "关键限值", "D": "监控程序"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P438。危害分析关键控制点(hazard analysis and critical control point,HACCP)是一种食品安全保证体系,其基本含义是,为保障食品安全,对食品生产加工过程中造成食品污染发生或发展的各种危害因素进行系统和全面的分析,确定能有效预防、减轻或消除危害的加工环节(即“关键控制点”)进而在关键控制点对危害因素进行控制,同时监测控制效果,发生偏差时予以纠正,并随时对控制方法进行矫正和补充。关键限值是指应用控制措施时确定的能确保消除或降低危害的技术指标，即区分可接受水平和不可接受水平的标准值。", "module": "食品卫生", "is_single": true}, {"id": 3957, "index": 14, "type": "single", "stem": "糖尿病的诊断是空腹血糖水平大于等于", "options": {"A": "7.0mmol/L", "B": "8.0mmol/L", "C": "9.0mmol/L", "D": "10.0mmol/L"}, "answer": "A", "explanation": "《中国2型糖尿病防治指南（2020版）。》", "module": "临床营养", "is_single": true}, {"id": 4098, "index": 15, "type": "single", "stem": "【技师不做】反流性食管炎的患者可能缺乏的营养素是", "options": {"A": "蛋白质", "B": "维生素", "C": "饱和脂肪酸", "D": "不饱和脂肪酸"}, "answer": "B", "explanation": "《中国营养科学全书》第2版P1578。反流性食管炎的患者很少发生营养不良,但微量元素和维生素可能不足。", "module": "临床营养", "is_single": true}, {"id": 3950, "index": 16, "type": "single", "stem": "低嘌呤膳食中忌食用的是", "options": {"A": "蔬菜", "B": "水果", "C": "脑", "D": "牛奶"}, "answer": "C", "explanation": "《营养与食品卫生学》第8版P234，低嘌呤膳食忌用的食物：脑、肝、肾等动物内脏，凤尾鱼、沙丁鱼、肉汁、鸡汁等嘌呤含量高的食物。选项C-脑属于低嘌呤膳食忌用的食物。", "module": "临床营养", "is_single": true}, {"id": 5946, "index": 17, "type": "single", "stem": "下列哪种物质仅由肝合成", "options": {"A": "脂肪酸", "B": "糖原", "C": "胆固醇", "D": "尿素"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P183。只有哺乳动物的肝存在精氨酸酶，精氨酸酶能够催化精氨酸水解生成尿素及鸟氨酸。故选D。", "module": "氨基酸代谢", "is_single": true}, {"id": 5404, "index": 18, "type": "single", "stem": "平均动脉压在下列哪个范围内,脑血流可保持恒定", "options": {"A": "50~180mmHg(6.7~24.0Kpa)", "B": "80~120mmHg(10.7~16.0Kpa)", "C": "40~200rnmHg(5.35~26.7Kpa）", "D": "60~140mmHg(8.0~18.7Kpa)"}, "answer": "D", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 5331, "index": 19, "type": "single", "stem": "肾上腺素不具备下列哪种作用", "options": {"A": "使心肌收缩力加强", "B": "使心率加快", "C": "使内脏皮肤血管收缩", "D": "使组织液生成减少"}, "answer": "D", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 5383, "index": 20, "type": "single", "stem": "浦肯野细胞动作电位0期去极化", "options": {"A": "因Na+内流而产生", "B": "因Ca2+内流而产生", "C": "因Cl-内流而产", "D": "因K+内流而产生"}, "answer": "A", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 4390, "index": 21, "type": "single", "stem": "母乳喂养的优点中，除外", "options": {"A": "营养成分最适合婴儿的需要，消化吸收利用率高", "B": "含有大量免疫物质，有助于增强婴儿抗感染的能力", "C": "容易发生过敏", "D": "经济、方便、卫生"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P142。婴儿肠道功能的发育尚不完善，牛乳蛋白被肠黏膜吸收后可作为过敏原而引起超敏反应。估计约有2%的婴儿对牛乳蛋白过敏，表现为湿疹、支气管哮喘及胃肠道症状，如呕吐、腹泻等。而母乳喂养儿极少发生过敏。", "module": "人群营养", "is_single": true}, {"id": 4503, "index": 22, "type": "single", "stem": "关于航海因素对营养代谢的影响，错误的是", "options": {"A": "在舰船航行早期可出现能量负平衡", "B": "在航海条件下蛋白质需要量增加", "C": "长期航行，会导致维生素C、维生素B2和维生素D不足", "D": "长期在水下核潜艇中作业，会导致尿钙升高"}, "answer": "D", "explanation": "《中国营养科学全书》第2版P1210。核潜艇长期在水下航行时，环境中二氧化碳浓度升高以及无阳光照射等导致维生素D合成减少，尿钙很快下降。", "module": "人群营养", "is_single": true}, {"id": 4491, "index": 23, "type": "single", "stem": "铅矿工人应多补充", "options": {"A": "蛋白质", "B": "脂肪", "C": "碳水化合物", "D": "维生素C"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P157。铅矿工人应多补充维生素C，不仅可防止铅引起的维生素C不足，而且可以体内铅的排泄。", "module": "人群营养", "is_single": true}, {"id": 3808, "index": 24, "type": "single", "stem": "蔬菜水果加工过程中损失的营养素主要是", "options": {"A": "蛋白质", "B": "脂肪", "C": "淀粉", "D": "维生素C"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P121。常见的蔬菜制品有酱腌菜，在加工过程中可造成营养素的损失，尤其维生素C、叶酸的损失较大，但对矿物质及部分植物化学物的影响不大。", "module": "食物营养", "is_single": true}, {"id": 3816, "index": 25, "type": "single", "stem": "在制作面食时B族维生素损失最多的烹调方法是", "options": {"A": "焖", "B": "煮", "C": "烙", "D": "炸"}, "answer": "D", "explanation": "营养与食品卫生学》第9版P130。在制作面食时，一般用蒸、烤、烙的方法，B族维生素损失较少，但用高温油炸时损失较大。如油条制作时因加碱及高温油炸会使维生素B1全部损失，维生素B2和烟酸仅保留一半。", "module": "食物营养", "is_single": true}, {"id": 4596, "index": 26, "type": "single", "stem": "《中国居民膳食指南（2022）》一般人群膳食指南的适用人群是", "options": {"A": "2岁以上健康人群", "B": "6岁以上健康人群", "C": "14岁以上健康人群", "D": "18岁以上健康人群"}, "answer": const userAnswers = {};

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const isSingle = q.is_single;
    const optionsHtml = Object.entries(q.options).map(([key, val]) =>
      `<div class="option ${isSingle?'option-single':'option-multi'}" data-q="${i}" data-key="${key}" onclick="selectOption(${i},'${key}',${isSingle})"><span class="option-key">${key}.</span><span>${val}</span></div>`
    ).join('');

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `qcard-${i}`;
    card.innerHTML = `
      <div class="q-header">
        <span class="q-number">#${i+1} <span style="font-weight:400;color:#999;font-size:13px">/ ${QUESTIONS.length}</span></span>
        <span><span class="q-type">${isSingle?'单选题':'多选题'}</span><span class="q-module">${q.module}</span></span>
      </div>
      <div class="q-stem">${q.stem}</div>
      <div class="options">${optionsHtml}</div>
      <div class="exp-toggle"><button id="expBtn-${i}" onclick="toggleExp(${i})" style="background:none;border:1px solid #d0d0d0;border-radius:6px;padding:4px 14px;font-size:13px;cursor:pointer;color:#667eea">📖 查看解析</button></div>
      <div class="explanation-box" id="exp-${i}">
        <div class="exp-label">📖 解析</div>
        <div>${q.explanation.replace('\n','<br>')}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function selectOption(qIdx, key, isSingle) {
  const card = document.getElementById(`qcard-${qIdx}`);
  const opts = card.querySelectorAll('.option');
  if (isSingle) {
    opts.forEach(o => o.classList.remove('selected'));
    opts.forEach(o => {
      if (o.dataset.key === key) o.classList.add('selected');
    });
    userAnswers[qIdx] = [key];
  } else {
    const el = card.querySelector(`.option[data-key="${key}"]`);
    el.classList.toggle('selected');
    const selected = [...card.querySelectorAll('.option.selected')].map(o => o.dataset.key);
    userAnswers[qIdx] = selected.length > 0 ? selected : null;
  }
}

function toggleExp(qIdx) {
  const box = document.getElementById(`exp-${qIdx}`);
  const btn = document.getElementById(`expBtn-${qIdx}`);
  if (box.classList.contains('show')) {
    box.classList.remove('show');
    btn.innerHTML = '📖 查看解析';
  } else {
    box.classList.add('show');
    btn.innerHTML = '📎 收起解析';
  }
}

function submitQuiz() {
  let correct = 0, wrong = 0;
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    const opts = card.querySelectorAll('.option');
    const exp = document.getElementById(`exp-${i}`);
    const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
    const userAns = userAnswers[i] || [];
    const isCorrect = userAns.length > 0 && JSON.stringify(userAns.slice().sort()) === JSON.stringify(correctAnswer);

    opts.forEach(o => o.classList.add('disabled'));
    if (isCorrect) {
      card.classList.add('correct');
      correct++;
    } else {
      card.classList.add('wrong');
      wrong++;
    }
    // Highlight correct/incorrect options
    opts.forEach(o => {
      const k = o.dataset.key;
      const isUser = userAns.includes(k);
      const isRight = correctAnswer.includes(k);
      if (isUser && isRight) o.classList.add('correct-answer');
      else if (isUser && !isRight) o.classList.add('wrong-answer');
      else if (!isUser && isRight) o.classList.add('correct-answer');
    });
    exp.classList.add('show');
  });

  const total = QUESTIONS.length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreBadge').innerHTML = `${correct}/${total} (${pct}%)`;
  document.getElementById('scoreBadge').style.color = pct >= 70 ? '#52c41a' : pct >= 50 ? '#faad14' : '#ff4d4f';

  // Update summary
  document.getElementById('summaryTotal').textContent = total;
  document.getElementById('summaryCorrect').textContent = correct;
  document.getElementById('summaryWrong').textContent = wrong;
  document.getElementById('summaryRate').textContent = pct + '%';
  document.getElementById('summaryBar').classList.add('show');

  // Scroll to top
  window.scrollTo({top: 0, behavior: 'smooth'});

  // Show wrong list with detail
  const wrongIndices = [];
  const wrongDetails = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) {
      wrongIndices.push(i + 1);
      const userAns = userAnswers[i] || [];
      const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
      wrongDetails.push({
        idx: i + 1,
        id: q.id,
        module: q.module,
        stem: q.stem,
        userAnswer: userAns.length ? userAns.join(', ') : '（未作答）',
        correctAnswer: correctAnswer.join(', '),
      });
    }
  });
  const wrongNumsEl = document.getElementById('wrongNums');
  const detailText = document.getElementById('wrongDetailText');
  if (wrongIndices.length > 0) {
    wrongNumsEl.innerHTML = wrongIndices.map(n => `<span>#${n}</span>`).join('');
    // Build detail text for copying
    let text = '===== RD 错题报告 =====\n';
    text += '共 ' + wrongIndices.length + ' 题\n\n';
    wrongDetails.forEach((w, i) => {
      text += '--- 第' + w.idx + '题 ---\n';
      text += '题号: ' + w.idx + '  (数据库ID: ' + w.id + ')\n';
      text += '模块: ' + w.module + '\n';
      text += '题干: ' + w.stem + '\n';
      text += '你的答案: ' + w.userAnswer + '\n';
      text += '正确答案: ' + w.correctAnswer + '\n';
      text += '——————————————\n';
    });
    text += '\n请帮我分析这些错题的错因和薄弱点。';
    detailText.value = text;
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = '';
  } else {
    wrongNumsEl.innerHTML = '<span style="color:#52c41a;font-weight:600;">🎉 全部正确！</span>';
    detailText.value = '🎉 全部正确，太棒了！';
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = 'none';
  }
}

function resetQuiz() {
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    card.className = 'question-card';
    card.querySelectorAll('.option').forEach(o => {
      o.classList.remove('selected', 'correct-answer', 'wrong-answer', 'disabled');
    });
    document.getElementById(`exp-${i}`).classList.remove('show');
  });
  document.getElementById('scoreBadge').innerHTML = '待提交';
  document.getElementById('scoreBadge').style.color = '#667eea';
  document.getElementById('wrongList').classList.remove('show');
  document.getElementById('copyWrongBtn').style.display = 'none';
}

function copyWrongDetail() {
  const ta = document.getElementById('wrongDetailText');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try {
    navigator.clipboard.writeText(ta.value).then(() => {
      alert('✅ 已复制错题详情，请发给教练分析！');
    }).catch(() => {
      document.execCommand('copy');
      alert('✅ 已复制，请发给教练分析！');
    });
  } catch(e) {
    document.execCommand('copy');
    alert('✅ 已复制，请发给教练分析！');
  }
}

function copyWrongAnswers() {
  const wrongIndices = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) wrongIndices.push(i + 1);
  });
  if (wrongIndices.length === 0) {
    alert('🎉 全部正确，没有错题！');
    return;
  }
  const text = wrongIndices.join(', ');
  navigator.clipboard.writeText(text).then(() => {
    alert(`✅ 已复制错题号：${text}`);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert(`✅ 已复制错题号：${text}`);
  });
}

try {
  renderQuestions();
  document.getElementById('jsFallback').style.display = 'none';
} catch(e) {
  document.getElementById('jsFallback').innerHTML =
    '<div style="font-size:48px;margin-bottom:16px;">❌</div>' +
    '<div style="font-size:16px;color:#ff4d4f;">题目加载失败</div>' +
    '<div style="font-size:13px;margin-top:8px;color:#999;">错误: ' + e.message + '</div>' +
    '<div style="font-size:13px;margin-top:4px;color:#999;">请截屏此错误信息发给教练修复</div>';
  console.error('RD题卡渲染错误:', e);
}
</script>
