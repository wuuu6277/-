<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; padding: 20px; }

<script>
const QUESTIONS = [{"id": 3761, "index": 1, "type": "single", "stem": "下列关于叶酸的叙述,错误的是", "options": {"A": "血清叶酸含量可反映近期膳食叶酸摄入情况", "B": "孕早期叶酸缺乏可引起胎儿神经管畸形", "C": "叶酸缺乏会导致高同型半胱氨酸血症", "D": "叶酸缺乏表现为小细胞性贫血"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P90。叶酸缺乏表现为巨幼细胞贫血。", "module": "基础营养", "is_single": true}, {"id": 3682, "index": 2, "type": "single", "stem": "对体液免疫和细胞免疫都起重要作用的维生素是", "options": {"A": "维生素A", "B": "维生素B2", "C": "维生素B12", "D": "维生素C"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P76。维生素A对体液免疫和细胞免疫都起重要作用，能提高抗感染和抗肿瘤能力。", "module": "基础营养", "is_single": true}, {"id": 3729, "index": 3, "type": "single", "stem": "不能用于抗坏血酸营养状况评价的是", "options": {"A": "血浆维生素C浓度", "B": "白细胞维生素C浓度", "C": "尿负荷试验", "D": "血浆同型半胱氨酸含量"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P95。抗坏血酸营养状况评价的方法:尿负荷试验和血浆维生素C含量。", "module": "基础营养", "is_single": true}, {"id": 5997, "index": 4, "type": "single", "stem": "关于多巴胺的描述中,下列哪项是错误的", "options": {"A": "由酪氨酸代谢生成", "B": "帕金森病人,多巴胺生成减少", "C": "是儿茶酚胺类激素", "D": "本身不是神经递质"}, "answer": "D", "explanation": "暂无解析", "module": "氨基酸代谢", "is_single": true}, {"id": 6039, "index": 5, "type": "single", "stem": "去甲肾上腺素合成的原料是", "options": {"A": "甘氨酸", "B": "色氨酸", "C": "酪氨酸", "D": "谷氨酸"}, "answer": "C", "explanation": "《生物化学与分子生物学》第9版P192。酪氨酸转变为儿茶酚胺（多巴胺、去甲肾上腺素和肾上腺素的统称）和黑色素。选C。", "module": "氨基酸代谢", "is_single": true}, {"id": 6049, "index": 6, "type": "single", "stem": "PAPS的前体氨基酸是", "options": {"A": "Trp", "B": "Ala", "C": "Tyr", "D": "Cys"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P191。半胱氨酸是体内硫酸根的主要来源。体内的硫酸根，一部分以无机盐的形式随尿排出，另一部分由ATP或化成活性硫酸根，即3‘-磷酸腺苷-5’磷酸硫酸PAPS。因此其前体氨基酸为半胱氨酸Cys。Trp 色氨酸； Ala 丙氨酸； Tyr 酪氨酸选D。", "module": "氨基酸代谢", "is_single": true}, {"id": 4184, "index": 7, "type": "single", "stem": "下列关于有害金属对食品污染的叙述,错误的是", "options": {"A": "有害金属可来源于自然环境和人为污染", "B": "毒性作用与机体酶活性有关", "C": "可引起慢性中毒及远期效应", "D": "金属元素的存在形式对毒性无影响"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P272。金属元素的存在形式对毒性强弱也有影响,因此选择D。", "module": "食品卫生", "is_single": true}, {"id": 4188, "index": 8, "type": "single", "stem": "误食大量亚硝酸钠可引起", "options": {"A": "营养不良", "B": "肠源性青紫症", "C": "腹泻", "D": "白细胞增高"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P399。肠源性青紫症是亚硝酸盐中毒的典型症状。", "module": "食品卫生", "is_single": true}, {"id": 4153, "index": 9, "type": "single", "stem": "下列关于葡萄球菌表述正确的是", "options": {"A": "革兰氏阴性菌", "B": "最适宜生长温度为20℃", "C": "只产生单一肠毒素", "D": "其引起的食物中毒潜伏期短"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P382、P383。葡萄球菌为革兰氏阳性兼性厌氧菌，生长繁殖的最适pH为7.4,最适温度为30～37℃。有50%上的菌株可产生肠毒素，并且一个菌株能产生两种以上的肠毒素。发病急骤，潜伏期短，一般为2～5小时，极少超过6小时。", "module": "食品卫生", "is_single": true}, {"id": 4135, "index": 10, "type": "single", "stem": "从临床表现上来看,感染型与毒素型食物中毒最大的区别在于", "options": {"A": "有无恶心、呕吐", "B": "有无腹痛、腹泻", "C": "有无体温升高", "D": "病死率不同"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P372。感染型食物中毒的临床表现多有发热症状。", "module": "食品卫生", "is_single": true}, {"id": 4191, "index": 11, "type": "single", "stem": "低温冷藏食品的主要卫生问题是", "options": {"A": "蛋白质腐败", "B": "糖酵解", "C": "脂肪酸败", "D": "霉变"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P263、P327。低温可以降低或停止微生物的增殖速度,食品中酶活力或一切化学反应也同时降低,但解脂酶需在-20℃才能基本停止活动,所以低温条件下食品的主要变化是脂肪酸败。", "module": "食品卫生", "is_single": true}, {"id": 4247, "index": 12, "type": "single", "stem": "可能产生有害污染物的保藏方式是", "options": {"A": "辐照保藏法", "B": "微波杀菌法", "C": "高温灭菌法", "D": "熏制法"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P131 P330。熏制法可能带来致癌物污染的问题。", "module": "食品卫生", "is_single": true}, {"id": 4133, "index": 13, "type": "single", "stem": "下列属于食物中毒范畴的是", "options": {"A": "暴饮暴食引起的肠炎", "B": "食用被旋毛虫污染的食物", "C": "食用被轮状病毒污染的食物", "D": "食用含氰苷类物质的食物"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P273、P323、P371、P396。近年来病毒污染食品事件也日益受到人们的关注，如轮状病毒、诺如病毒和甲型肝炎病毒等。 旋毛虫幼虫主要寄生在动物的膈肌、舌肌、心肌、胸大肌和肋间肌等，以膈肌最为常见，形成包囊。 食物中毒是指摄人含有生物性、化学性有毒有害物质的食品或把有毒有害物质当作食品摄人后所出现的非传染性的急性、亚急性疾病。 含氰苷类食物中毒是指因食用苦杏仁、桃仁、李子仁、枇杷仁、樱桃仁、木薯等含氰苷类食物引起的中毒。", "module": "食品卫生", "is_single": true}, {"id": 3970, "index": 14, "type": "single", "stem": "低脂膳食要求每日膳食中饱和脂肪酸占总能量的", "options": {"A": "<10%", "B": "<15%", "C": "<18%", "D": "≤15%"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P185，低脂膳食一般可分为：轻度限制、中度限制和严格限制。其中饱和脂肪酸占总能量&lt; 10%。", "module": "临床营养", "is_single": true}, {"id": 4125, "index": 15, "type": "single", "stem": "【技师不做】慢性阻塞性肺疾病患者膳食原则是", "options": {"A": "加强营养治疗、排除引起超敏反应的食品", "B": "高能量、高蛋白、足量矿物质", "C": "高能量、高碳水化合物,给予开胃食品", "D": "高能量、低碳水化合物、高蛋白、高脂肪"}, "answer": "D", "explanation": "暂无解析", "module": "临床营养", "is_single": true}, {"id": 4051, "index": 16, "type": "single", "stem": "可以减轻或消除胆囊炎症状的膳食是", "options": {"A": "低脂膳食", "B": "高纤维膳食", "C": "低苯丙氨酸膳食", "D": "低嘌呤膳食"}, "answer": "A", "explanation": "这是几种治疗膳食。可以减轻或消除胆囊炎症状的膳食是低脂膳食;可以控制苯丙酮尿症病情的膳食是低苯丙氨酸膳食;可以减轻或消除便秘症状的膳食是高纤维膳食;可以减轻体重、预防肥胖的膳食是低热能膳食;可以减轻或消除痛风症状的膳食是低嘌呤膳食。", "module": "临床营养", "is_single": true}, {"id": 3947, "index": 17, "type": "single", "stem": "属于糖尿病患者典型症状的是", "options": {"A": "体重增加", "B": "多尿", "C": "少尿", "D": "饮食减少"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P203。大多数糖尿病病人的典型症状临床表现为：“三多一少”，即多饮、多食、多尿、消瘦等。 多尿符合糖尿病病人的典型症状临床表现。", "module": "临床营养", "is_single": true}, {"id": 3945, "index": 18, "type": "single", "stem": "糖尿病营养治疗的首要原则是", "options": {"A": "合理控制能量", "B": "限制脂肪摄入", "C": "摄入足够的膳食纤维", "D": "限制饮酒"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P206。合理控制能量摄入是糖尿病营养治疗的首要原则。", "module": "临床营养", "is_single": true}, {"id": 3948, "index": 19, "type": "single", "stem": "为高血压患者制定膳食计划,不需要限制摄入量的是", "options": {"A": "脂肪", "B": "能量", "C": "胆固醇", "D": "钙"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P215。高血压的营养防治：应改变生活方式，如减重、低盐低饱和脂肪酸低胆固醇饮食、有氧运动、足够的膳食镁钾钙的摄入，戒烟戒酒等。", "module": "临床营养", "is_single": true}, {"id": 4100, "index": 20, "type": "single", "stem": "促进Ca吸收的因素不包括", "options": {"A": "维生素D", "B": "生理需求增多", "C": "肠内容物pH", "D": "肠内容物中的磷酸盐"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P55。肠内容物的磷酸盐过多,会形成不溶解的磷酸钙,使钙不能被吸收。", "module": "临床营养", "is_single": true}, {"id": 5297, "index": 21, "type": "single", "stem": "关于静脉回心血量,错误的是", "options": {"A": "体循环平均充盈压升高,静脉回心血最减少", "B": "右心衰竭时,静脉回心血量显著减少", "C": "静脉内的瓣膜使血液只能向心脏方向流动", "D": "直立时静脉回心血量较平卧时低"}, "answer": "A", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 5374, "index": 22, "type": "single", "stem": "颈动脉窦和主动脉弓压力感受器的传入冲动增加时,引起的变化是", "options": {"A": "心迷走神经的紧张性降低", "B": "心交感神经的紧张性增加", "C": "交感缩血管神经的紧张性降低", "D": "血容量增加,细胞外液量增加"}, "answer": "C", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 5276, "index": 23, "type": "single", "stem": "【技师不做】心室扩大早期,泵血功能减退时,宜选用的评定指标是", "options": {"A": "每搏输出量", "B": "每分输出量", "C": "射血分数", "D": "心指数"}, "answer": "C", "explanation": "《生理学》第9版P88。在心室功能减退、心室异常扩大的患者，其搏出量可能与正常人无明显差异，但心室舒张末期容积增大，因此射血分数明显降低，因此，与搏出量相比，射血分数能更准确的反映心脏的泵血功能，对早期发现心脏泵血功能异常具有重要意义。", "module": "血液循环", "is_single": true}, {"id": 5295, "index": 24, "type": "single", "stem": "【技师不做】心室肌有效不应期的长短主要取决于", "options": {"A": "动作电位0期去极化的速度", "B": "动作电位1期的长短", "C": "动作电位2期的长短", "D": "动作电位3期的长短"}, "answer": "C", "explanation": "《生理学》第9版P100。在2期早期，膜电位保持于零电位上下，2期中的钙离子、钠离子内流和钾离子外流的轻微变化都会影响平台期的长短，同时影响到动作电位时程的长短。", "module": "血液循环", "is_single": true}, {"id": 5399, "index": 25, "type": "single", "stem": "下列哪种情况下可发生冠脉舒张", "options": {"A": "颈动脉窦内压力感受器受刺激时", "B": "动脉血pH增高时", "C": "动脉血CO2分压降低时", "D": "动脉血氧分压降低时"}, "answer": "D", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 5241, "index": 26, "type": "single", "stem": "【技师不做】在心肌的前负荷和收缩能力不变的情况下,增加后负荷可使", "options": {"A": "等容收缩期延长", "B": "射血期延长", "C": "等容舒张期延长", "D": "心室充盈期延长"}, "answer": "A", "explanation": "《生理学》第9版P93。在心肌初长度、收缩能力和心率都不变的情况下，如果大动脉血压增高，等容收缩期室内压的峰值将增高，结果使等容收缩期延长而射血期缩短，因为新动脉血压是心室收缩时遇到的后负荷，所以增加后负荷可使等容收缩期延长。", "module": "血液循环", "is_single": true}, {"id": 5406, "index": 27, "type": "single", "stem": "对冠脉血流量调节的叙述错误的是", "options": {"A": "对其调节最重要的是心肌本身代谢水平", "B": "心肌提高从单位血液中摄取氧的潜力小", "C": "在代谢产物中腺苷作用最重要", "D": "交感神经兴奋只能使冠脉收缩"}, "answer": "D", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 4416, "index": 28, "type": "single", "stem": "铅作业人员在少量接触铅时，应选择", "options": {"A": "富含钠的食物", "B": "富含钾的食物", "C": "富含钙的食物", "D": "富含磷、硫的食物"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P156。铅作业人员的膳食原则：在接触少量铅时，食物选择以富含磷和硫的肉类和谷类等食物为主，使沉积于骨骼中的铅转入血液，形成可溶性磷酸氢铅，经尿排出。", "module": "人群营养", "is_single": true}, {"id": 4476, "index": 29, "type": "single", "stem": "对于举重、投掷运动员比赛期间，含氮物质代谢增强，所以食物应提高供给量的是", "options": {"A": "蛋白质", "B": "脂肪", "C": "碳水化合物", "D": "维生素"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P150。短速度力量型运动项目的运动如短跑、跳高、举重、投掷、摔跤以及武术等项目要求较大的力量和较好的神经-肌肉系统的协调性，并且要在短时间内产生爆发力。这类运动强度较大，氧债大，以无氧供能为主。每日蛋白质推荐摄入量可达到2.0g/(kg⋅bw)，其中优质蛋白应占1/3，同时要适当增加支链氨基酸、肌酸以及谷氨酰胺等的摄入。", "module": "人群营养", "is_single": true}, {"id": 4409, "index": 30, "type": "single", "stem": "初乳营养成分极高，下列说法错误的是", "options": {"A": "含有丰富的营养素和抗病物质，应全部喂给孩子", "B": "含有许多免疫活性物质", "C": "含有许多脂肪和乳糖", "D": "含有较多的维生素A"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P136。初乳含有较多的维生素A、锌、铜，而脂肪和乳糖含量较成熟乳少，适合新生儿的营养需要和消化能力。", "module": "人群营养", "is_single": true}, {"id": 4446, "index": 31, "type": "single", "stem": "学龄前儿童体重、身高平均每年增长分别为", "options": {"A": "2~3kg；4~7cm", "B": "5kg；7cm", "C": "2kg；5~7cm", "D": "2~5kg；2~8cm"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P143。学龄前儿童体重年增长约2kg，身高年增长约5~7cm。", "module": "人群营养", "is_single": true}, {"id": 4378, "index": 32, "type": "single", "stem": "母乳中含有的活性免疫物质包括①免疫球蛋白②溶菌酶③淋巴细胞④乳铁蛋白⑤双歧杆菌因子", "options": {"A": "①③④⑤", "B": "①②④⑤", "C": "①②③⑤", "D": "①②③④⑤"}, "answer": "D", "explanation": "《营养与食品卫生学》第8版P183。母乳中的免疫物质有：各种免疫球蛋白，包括IgA、IgG、IgM、IgD，其中IgA占总量的90%，多为分泌型IgA，具有抗肠道微生物和异物的作用；乳铁蛋白是一种能与三价铁离子结合的乳清蛋白，通过与在繁殖中需要游离铁离子的病原微生物竞争铁，从而抑制这些病原微生物的代谢和繁殖；溶菌酶是一种由上皮细胞、中性粒细胞和单核巨噬细胞产生的低分子单链蛋白，其在母乳中的含量比牛乳中高300倍以上，可通过水解细胞壁中的乙酰氨基多糖而使易感菌溶解，发挥杀菌抗炎作用；双歧杆菌因子是一种含氮多糖，能促进双歧杆菌生长，降低肠道pH，抑制腐败菌生长。母乳中的多种免疫物质在婴儿体内构成了有效的防御系统，保护婴儿免受感染。", "module": "人群营养", "is_single": true}, {"id": 4470, "index": 33, "type": "single", "stem": "关于高温环境中人群的营养。高温环境下，人员蛋白质供给量应占总能量的", "options": {"A": "8%～10%", "B": "10%～15%", "C": "16%～20%", "D": "21%～25%"}, "answer": "B", "explanation": "&lt;&lt;营养与食品卫生学&gt;&gt;第9版P153。当环境温度超过25℃时，环境温度每升高1℃，能量摄入应比一般人群增加0.5%，碳水化合物供能占总能量的55%~65%，脂肪占总能量的20%~30%，蛋白质推荐摄入量为72~79g/d，适量多吃鱼虾、蛋、奶、大豆和瘦肉等优质蛋白质食物。建议每日奶类摄入不低于300g，每日摄入相当于50g大豆的豆制品。", "module": "人群营养", "is_single": true}, {"id": 4395, "index": 34, "type": "single", "stem": "关于运动员的饮食，下列错误的是", "options": {"A": "饮食中应供给足够的能量", "B": "有运动员所需要的各种营养素", "C": "供给的饮食要能量高、体积大", "D": "饮食要易于消化吸收"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P156。运动员的饮食应选择浓缩、体积小易消化的食物。", "module": "人群营养", "is_single": true}, {"id": 3842, "index": 35, "type": "single", "stem": "谷类中含有的主要矿物质是", "options": {"A": "钙", "B": "铁", "C": "锌", "D": "硒"}, "answer": "A", "explanation": "谷类中含有的矿物质主要是磷、钙。", "module": "食物营养", "is_single": true}, {"id": 3820, "index": 36, "type": "single", "stem": "烹调蔬菜的合理方法是", "options": {"A": "先切后洗", "B": "长时间浸泡水中,以清除农药", "C": "急火快炒", "D": "水煮"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P130。使用合理加工烹调方法，即先洗后切，急火快炒，现做现吃是降低蔬菜中维生素损失的有效措施。", "module": "食物营养", "is_single": true}, {"id": 3828, "index": 37, "type": "single", "stem": "牛乳中的蛋白质主要是", "options": {"A": "乳清蛋白", "B": "酪蛋白", "C": "胶原蛋白", "D": "黏蛋白"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P123。牛乳中的蛋白质含量约为2.8%-3.3%，主要由酪蛋白（79.6%）、乳清蛋白（11.5%）和乳球蛋白（3.3%）组成。", "module": "食物营养", "is_single": true}, {"id": 3819, "index": 38, "type": "single", "stem": "蔬菜的春化作用是", "options": {"A": "蔬菜打破休眠而发生发芽或抽薹变化", "B": "重新分布蔬菜体内的养分,提高其营养价值", "C": "在酶的参与下,在有氧存在下加速蔬菜中的有机物分解", "D": "在蔬菜采摘后进一步成熟的过程"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P130。 蔬菜的春化作用即蔬菜打破休眠而发生发芽或抽薹变化，如马铃薯发芽、洋葱大蒜的抽薹等，这会大量消耗蔬菜体内的养分，使其营养价值降低。", "module": "食物营养", "is_single": true}, {"id": 3826, "index": 39, "type": "single", "stem": "干大豆中含量髙达35%~40%的营养素是", "options": {"A": "蛋白质", "B": "脂肪", "C": "淀粉", "D": "膳食纤维"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P118。豆的蛋白质含量高达35%-40%。", "module": "食物营养", "is_single": true}, {"id": 3875, "index": 40, "type": "single", "stem": "通过加热处理,可破坏大豆中最广泛存在的抗营养因素是", "options": {"A": "淀粉酶抑制剂", "B": "脂肪氧化酶抑制剂", "C": "胰蛋白酶抑制剂", "D": "胃蛋白酶抑制剂"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P119。考查食物营养学知识,高温加热处理可破坏胰蛋白酶抑制剂。", "module": "食物营养", "is_single": true}, {"id": 3795, "index": 41, "type": "single", "stem": "蔬菜水果中含量丰富的成分是", "options": {"A": "蛋白质、脂肪、碳水化合物和有机酸", "B": "蛋白质、矿物质、膳食纤维和有机酸", "C": "蛋白质、维生素、矿物质和有机酸", "D": "维生素、矿物质、膳食纤维和有机酸"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P119 120。蔬菜和水果种类繁多，富含人体所需的维生素、矿物质，含水分和酶类较多，含有一定量的碳水化合物，膳食纤维丰富，蛋白质、脂肪含量较少。由于蔬菜、水果中含有多种有机酸、芳香物质和色素等成分，使水果具有良好的感官性质，对增进食欲、促进消化、赋予食物多样化具有重要意义。", "module": "食物营养", "is_single": true}, {"id": 4561, "index": 42, "type": "single", "stem": "在下列膳食模式中，热量摄入比较高，心脑血管疾病发病较高的是", "options": {"A": "经济发达国家膳食模式", "B": "日本膳食模式", "C": "东方膳食模式", "D": "地中海膳食模式"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P164。考查每种膳食模式各自的特点，认真掌握每种膳食模式的特点以及对人体健康的影响。", "module": "公共营养", "is_single": true}, {"id": 4627, "index": 43, "type": "single", "stem": "我国新食品原料包括在我国无传统食用习惯的①动物、植物和微生物②从动物、植物、微生物中分离的成分③原有结构发生改变的食品成分④食品添加剂新品种⑤转基因食品", "options": {"A": "①②④", "B": "①②⑤", "C": "①③④", "D": "①②③"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P175-176。新食品原料是指在我国无传统食用习惯的以下物品：动物、植物和微生物，从动物、植物和微生物中分离的成分，原有结构发生改变的食物成分，其他新研制的食品原料。新食品原料不包括转基因食品、保健食品、食品添加剂新品种，上述物品的管理依照国家有关法律法规执行。", "module": "公共营养", "is_single": true}, {"id": 4531, "index": 44, "type": "single", "stem": "营养调查内容除外", "options": {"A": "能量摄入情况调查", "B": "社会经济指导", "C": "血清总蛋白测定", "D": "尿负荷实验"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P166。主要考核营养调查内容，包括膳食调查、人体生化水平的生化检验、营养相关疾病临床体征及症状检查、人体测量资料分析。", "module": "公共营养", "is_single": true}, {"id": 4526, "index": 45, "type": "single", "stem": "能够反映过去较长时间内膳食摄入水平的测量方法是", "options": {"A": "称重法", "B": "记账法", "C": "食物频率问卷调查", "D": "24小时膳食回顾法"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P167。考查对膳食暴露的测量方法掌握情况，食物频率法的主要优点是能迅速得到平时食物摄入种类和摄入量，从而反映长期营养素摄取模式。", "module": "公共营养", "is_single": true}, {"id": 4556, "index": 46, "type": "single", "stem": "下列不属于UL制定依据的是", "options": {"A": "危险性评估", "B": "无毒副作用水平（NOAEL）", "C": "最低毒副作用水平（LOAEL）", "D": "最大无作用剂量"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P163。营养素摄入过量也可能产生不良作用，对健康造成危害。UL是平均每日摄入营养素的最高限量。营养素UL是根据人体在不同暴露情况下发生变化的特征或危害的评估，即危险性评估制定的。当资料允许时UL根据NOAEL制定，当资料无法认定NOAEL时，则根据LOAEL制定，而儿童、青少年的UL还可根据UF数据库制定。", "module": "公共营养", "is_single": true}, {"id": 4589, "index": 47, "type": "single", "stem": "向粮食制品中强化必需氨基酸的目的是", "options": {"A": "弥补某些食品天然营养成分的缺陷", "B": "补充食品加工损失的营养素", "C": "使某些食品达到特定目的的营养需要", "D": "使食品具有某种色泽和特殊口味"}, "answer": "A", "explanation": "食品强化在国外通常有4种目的：弥补某些食品天然营养成分的缺陷，如向粮食制品中强化必需氨基酸；补充食品加工损失的营养素，如向精白米面中添加B族维生素；使某些食品达到特定目的的营养需要，如开发母乳化奶粉、宇航食品和患者用药膳；特殊人群预防需要，如寒带人群补充维生素C等。", "module": "公共营养", "is_single": true}, {"id": 4624, "index": 48, "type": "single", "stem": "下列属于营养教育远期效果的是", "options": {"A": "营养健康状况的变化", "B": "知识和态度的变化", "C": "信息和服务的变化", "D": "行为的变化"}, "answer": "A", "explanation": "考查营养教育的近期、中期和远期效果，选项A属于远期效果。", "module": "公共营养", "is_single": true}, {"id": 5528, "index": 49, "type": "single", "stem": "关于消化道平滑肌慢波的叙述,错误的是", "options": {"A": "在胃肠不收缩的情况下,也可记录到慢波电位", "B": "慢波的波幅和频率与平滑肌组织的种类无关", "C": "慢波起源于纵行肌和环肌之间的Cajal间质细胞", "D": "慢波的产生是肌源性的"}, "answer": "B", "explanation": "《生理学》第9版P178。消化道不同部位平滑肌的慢波频率不同，人的慢波频率在胃约每分钟3次，在十二指肠约每分钟12次，回肠末端为8~9次。故B选项中“慢波的频率与平滑肌组织的种类无关”错误。", "module": "消化系统", "is_single": true}, {"id": 5582, "index": 50, "type": "single", "stem": "胃大部切除的患者出现贫血,红细胞体积变小,其主要原因是", "options": {"A": "胃酸减少", "B": "胃蛋白酶减少", "C": "内因子减少", "D": "HCO3-减少"}, "answer": "A", "explanation": "《生理学》第9版P184。红细胞体积变小引起的贫血一般是缺铁性血，盐酸有利于小肠对铁和钙的吸收。", "module": "消化系统", "is_single": true}, {"id": 5534, "index": 51, "type": "single", "stem": "关于胃酸分泌的描述,错误的是", "options": {"A": "壁细胞分泌", "B": "需要消耗能量", "C": "质子泵在H+分泌中起关键作用", "D": "壁细胞分泌HCO3—;增多时,血浆pH将下降"}, "answer": "D", "explanation": "《生理学》第9版P185。胃酸大量分泌的同时也有大量HCO3—进入血液，使得血液暂时碱化，pH上升，故选D。", "module": "消化系统", "is_single": true}, {"id": 5557, "index": 52, "type": "single", "stem": "引起胆囊收缩的一个重要体液因素是", "options": {"A": "促胃液素", "B": "促胰液素", "C": "缩胆囊素", "D": "胆盐"}, "answer": "C", "explanation": "《生理学》第9版P194。缩胆囊素的主要作用之一是促进胆囊强烈收缩，排出胆汁。故选C。", "module": "消化系统", "is_single": true}, {"id": 5613, "index": 53, "type": "single", "stem": "消化道内,与蛋白质消化有关的酶有①胰淀粉酶②胰蛋白酶③糜蛋白酶④羧基肽酶", "options": {"A": "②③④", "B": "①③④", "C": "①②④", "D": "①②③④"}, "answer": "A", "explanation": "《生理学》第9版P193。胰蛋白酶和糜蛋白酶都能分解蛋白质为䏡和胨，当两者一同 作用于蛋白质时，则可将蛋白质消化为小分子多肽和游离氨基酸。羧基肽酶可作用于多肽末端的肽键，释出具有自由羧基的氨基酸。胰淀粉酶是胰腺分泌的消化淀粉的酶。", "module": "消化系统", "is_single": true}, {"id": 5597, "index": 54, "type": "single", "stem": "下列关于胃酸生理作用的叙述,错误的是", "options": {"A": "盐酸进入小肠后,可促进胰液、肠液、胆汁的分泌", "B": "可使食物中的蛋白质变性而易于分解", "C": "可杀死随食物进入胃内的细菌", "D": "可促进维生素B12的吸收"}, "answer": "D", "explanation": "《生理学》第9版P185。胃酸有多种生理作用：①激活胃蛋白酶原，并为胃蛋白酶提供适宜的酸性环境；②使食物中的蛋白质变性，有利于蛋白质的水解；③杀灭随食物进入胃内的细菌，对维持胃及小肠内的无菌状态具有重要意义；④盐酸随食糜进入小肠后，可促进促胰液素和缩胆囊素的分泌，进而引起胰液、胆汁和小肠液的分泌；⑤盐酸造成的酸性环境有利于小肠对铁和钙的吸收。由于盐酸属于强酸，对胃和十二指肠黏膜具有侵蚀作用，如果盐酸分泌过多，将损伤胃和十二指肠黏膜，诱发或加重溃疡病。若胃酸分泌过少，则可引起腹胀、腹泻等消化不良症状。故选D。", "module": "消化系统", "is_single": true}, {"id": 5550, "index": 55, "type": "single", "stem": "胰腺分泌HC03—,错误的是", "options": {"A": "由胰腺内小导管上皮细胞分泌", "B": "为胰酶提供适宜的作用环境", "C": "防止盐酸对十二指肠黏膜的侵蚀", "D": "缩胆囊素可引起HC03—大量分泌"}, "answer": "D", "explanation": "《生理学》第9版P194。缩胆囊素能够促进胰液中各种酶的分泌，还有较少的碳酸氢盐，D错误，故选D。", "module": "消化系统", "is_single": true}, {"id": 6141, "index": 56, "type": "single", "stem": "2分子丙氨酸异生为葡萄糖需消耗儿个高能磷酸键", "options": {"A": "3", "B": "4", "C": "5", "D": "6"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P113。 丙氨酸等生糖氨基酸转化为丙酮酸后，参与糖异生。", "module": "糖代谢", "is_single": true}, {"id": 6162, "index": 57, "type": "single", "stem": "丙酮酸不参与下列哪种代谢过程", "options": {"A": "转变为丙氨酸", "B": "经异构酶催化生成丙酮", "C": "异生成葡萄糖", "D": "进入线粒体氧化供能"}, "answer": "B", "explanation": "《生物化学与分子生物学》第9版P92、P97、P113。 A、C、D均有丙酮酸参与。", "module": "糖代谢", "is_single": true}, {"id": 6401, "index": 58, "type": "single", "stem": "乙酰CoA羧化酶的产物是", "options": {"A": "△2烯脂酰CoA", "B": "β-羟脂酰CoA", "C": "β-酮脂酰CoA", "D": "丙二酸单酰CoA"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P153。 脂肪酸的合成时，软脂酸合成第一步，乙酰CoA羧化酶催化，乙酰CoA转化为丙二酸单酰CoA。", "module": "脂质代谢", "is_single": true}, {"id": 6374, "index": 59, "type": "single", "stem": "同时可参与甘油三酯和磷脂合成的物质是", "options": {"A": "3-磷酸甘油", "B": "乙酰乙酸", "C": "甲羟戊酸", "D": "溶血磷脂"}, "answer": "A", "explanation": "《生物化学与分子生物学》第9版P158。 葡萄糖转化为3-磷酸甘油进入代谢流程。", "module": "脂质代谢", "is_single": true}, {"id": 6430, "index": 60, "type": "single", "stem": "下列关于镰状细胞贫血症的原因,错误的是", "options": {"A": "正常的血红蛋白分子中β亚基的第6位氨基酸是谷氨酸", "B": "在镰状细胞贫血病人的血红蛋白中,谷氨酸变异成细氨酸,即酸性氨基酸被中性氨基酸替代", "C": "突变导致α亚基的表面产生了一个疏水的“黏性位”点", "D": "黏性位点使脱氧HbS之间发生不正常的聚集,形成纤维样沉淀"}, "answer": "C", "explanation": "《生物化学与分子生物学》第9版P27。 正常人血红蛋白B亚基的第6位氨基酸是谷氨酸而镰状细胞贫血病人的血红蛋白中谷氨酸变成了缬氨酸，即酸性氨基酸被中性氨基酸替代，仅此一个氨基酸之差，原是水溶性的血红蛋白就聚集成丝相互黏着导致红细胞变形成为镰刀状而极易破碎产生贫血。这种蛋白质分子发生变异所导致的疾病被称之为其病因为基因突变所致。", "module": "蛋白质的结构与功能", "is_single": true}, {"id": 6422, "index": 61, "type": "single", "stem": "以下关于蛋白质等电点的描述正确的是", "options": {"A": "随环境pH而改变", "B": "蛋白质不带极性", "C": "蛋白质解离成正、负离子的趋势相等", "D": "蛋白质基本不带电荷"}, "answer": "C", "explanation": "《生物化学与分子生物学》第9版P30。 当蛋白质溶液处于某一pH时蛋白质解离成正、负离子的趋势相等即成为兼性离子净电荷为零此时溶液的pH称为蛋白质的等电点（protein isoelectric point，pI）。", "module": "蛋白质的结构与功能", "is_single": true}, {"id": 5468, "index": 62, "type": "single", "stem": "下列关于肺牵张反射的叙述,错误的是", "options": {"A": "感受器存在于支气管和细支气管的平滑肌层", "B": "正常人平静呼吸时,对呼吸节律起重要调节作用", "C": "传入途径是迷走神经", "D": "可促进吸气及时转入呼气"}, "answer": "B", "explanation": "《生理学》第9版P174。在成年人，潮气量要超过1500ml时才能引起肺扩张反射，因此在平静呼吸时，肺扩张反射一般不参与呼吸运动的调节，故选B，其余均正确。", "module": "呼吸", "is_single": true}, {"id": 5434, "index": 63, "type": "single", "stem": "波尔效应是下列哪种因素对氧解离曲线的影响", "options": {"A": "温度", "B": "pH和PCO2", "C": "2,3-DPG", "D": "CO"}, "answer": "B", "explanation": "《生理学》第9版P165。血液PH和PCO2对Hb与O2的亲和力的这种影响称为波尔效应。故选B。", "module": "呼吸", "is_single": true}, {"id": 5511, "index": 64, "type": "single", "stem": "中枢化学感受器的特点是", "options": {"A": "对血O2含量变化敏感", "B": "对血液CO2浓度变化敏感", "C": "对血液中H+浓度变化敏感", "D": "对低O2时维持呼吸十分重要"}, "answer": "B", "explanation": "《生理学》第9版P172。血液中的CO2浓度能迅速通过血－脑屏障，使化学感受器周围细胞外液中的H+浓度升高，从而刺激中枢化学感受器，引起呼吸中枢兴奋。血液中的H+不易透过血－脑屏障，故而中枢化学感受器主要感受血中CO2浓度，选B。", "module": "呼吸", "is_single": true}, {"id": 5441, "index": 65, "type": "single", "stem": "解离曲线是表示下列哪种关系的曲线", "options": {"A": "血红蛋白含量与血氧含量", "B": "血红蛋白氧饱和度与血氧分压", "C": "血红蛋白氧饱和度与血红蛋白氧含量", "D": "血红蛋白浓度与血红蛋白氧容量"}, "answer": "B", "explanation": "《生理学》第9版P164。氧解离曲线是表示血液中血红蛋白氧饱和度与血氧分压关系的曲线，也称为氧合血红蛋白解离曲线，故选B。", "module": "呼吸", "is_single": true}, {"id": 5506, "index": 66, "type": "single", "stem": "下列肺容积在严重哮喘患者中降低最为显著的是", "options": {"A": "肺活量", "B": "用力肺活量", "C": "用力呼气量", "D": "深吸气量"}, "answer": "C", "explanation": "《生理学》第9版P156。在哮喘等阻塞性肺疾病患者，FEV1的降低比FVC更明显，故选C。", "module": "呼吸", "is_single": true}, {"id": 5494, "index": 67, "type": "single", "stem": "非弹性阻力包括①气道阻力②静态阻力③惯性阻力④黏滞阻力", "options": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "②③④"}, "answer": "C", "explanation": "《生理学》第9版P151。非弹性阻力包括：气道阻力、惯性阻力、组织的黏滞阻力，故选①③④。", "module": "呼吸", "is_single": true}, {"id": 5514, "index": 68, "type": "single", "stem": "尽力吸气后再尽力最快呼气,在一定时间内所能呼出的气量是", "options": {"A": "肺总量", "B": "肺扩散容量", "C": "肺活量", "D": "用力呼气量"}, "answer": "D", "explanation": "《生理学》第9版P156。用力呼气量是指一次最大吸气后尽力尽快呼气，在一定时间内所能呼出的气体量，选D。", "module": "呼吸", "is_single": true}, {"id": 6692, "index": 69, "type": "single", "stem": "三羧酸循环的关键酶是", "options": {"A": "磷酸化酶", "B": "HMG-CoA还原酶", "C": "丙酮酸激酶", "D": "柠檬酸合酶"}, "answer": "D", "explanation": "暂无解析", "module": "酶与酶促反应", "is_single": true}, {"id": 6636, "index": 70, "type": "single", "stem": "对可逆性抑制剂的描述正确的是", "options": {"A": "使酶变性失活的抑制剂", "B": "抑制剂与酶共价结合", "C": "抑制剂与酶是非共价键结合", "D": "可逆性抑制剂即指竞争性抑制"}, "answer": "C", "explanation": "暂无解析", "module": "酶与酶促反应", "is_single": true}, {"id": 6610, "index": 71, "type": "single", "stem": "酶的竞争性抑制的动力学特点是", "options": {"A": "Vmax不变,Km增大", "B": "Vmax减小,Km不变", "C": "Vmax不变,Km减小", "D": "Vmax和Km都不变"}, "answer": "A", "explanation": "暂无解析", "module": "酶与酶促反应", "is_single": true}, {"id": 5195, "index": 72, "type": "single", "stem": "某大学生进行课外科研训练,计划采用等张的磷酸缓冲液(PBS液)进行肺泡灌洗,因为所准备的PBS液不够,可用下列哪种溶液代替", "options": {"A": "0.9%NaCl", "B": "0.9%葡萄糖", "C": "0.9%尿素", "D": "5%NaCl"}, "answer": "A", "explanation": "《生理学》第9版P60。0.9%NaCl溶液既是等渗溶液，也是等张溶液。", "module": "血液", "is_single": true}, {"id": 5222, "index": 73, "type": "single", "stem": "血清与血浆的区别在 const userAnswers = {};

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const isSingle = q.is_single;
    const optionsHtml = Object.entries(q.options).map(([key, val]) =>
      `<div class="option ${isSingle?'option-single':'option-multi'}" data-q="${i}" data-key="${key}" onclick="selectOption(${i},'${key}',${isSingle})"><span class="option-key">${key}.</span><span>${val}</span></div>`
    ).join('');

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `qcard-${i}`;
    card.innerHTML = `
      <div class="q-header">
        <span class="q-number">#${i+1} <span style="font-weight:400;color:#999;font-size:13px">/ ${QUESTIONS.length}</span></span>
        <span><span class="q-type">${isSingle?'单选题':'多选题'}</span><span class="q-module">${q.module}</span></span>
      </div>
      <div class="q-stem">${q.stem}</div>
      <div class="options">${optionsHtml}</div>
      <div class="exp-toggle"><button id="expBtn-${i}" onclick="toggleExp(${i})" style="background:none;border:1px solid #d0d0d0;border-radius:6px;padding:4px 14px;font-size:13px;cursor:pointer;color:#667eea">📖 查看解析</button></div>
      <div class="explanation-box" id="exp-${i}">
        <div class="exp-label">📖 解析</div>
        <div>${q.explanation.replace('\n','<br>')}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function selectOption(qIdx, key, isSingle) {
  const card = document.getElementById(`qcard-${qIdx}`);
  const opts = card.querySelectorAll('.option');
  if (isSingle) {
    opts.forEach(o => o.classList.remove('selected'));
    opts.forEach(o => {
      if (o.dataset.key === key) o.classList.add('selected');
    });
    userAnswers[qIdx] = [key];
  } else {
    const el = card.querySelector(`.option[data-key="${key}"]`);
    el.classList.toggle('selected');
    const selected = [...card.querySelectorAll('.option.selected')].map(o => o.dataset.key);
    userAnswers[qIdx] = selected.length > 0 ? selected : null;
  }
}

function toggleExp(qIdx) {
  const box = document.getElementById(`exp-${qIdx}`);
  const btn = document.getElementById(`expBtn-${qIdx}`);

    box.classList.remove('show');
    btn.innerHTML = '📖 查看解析';
  } else {
    box.classList.add('show');
    btn.innerHTML = '📎 收起解析';
  }
}

function submitQuiz() {
  let correct = 0, wrong = 0;
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    const opts = card.querySelectorAll('.option');
    const exp = document.getElementById(`exp-${i}`);
    const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
    const userAns = userAnswers[i] || [];
    const isCorrect = userAns.length > 0 && JSON.stringify(userAns.slice().sort()) === JSON.stringify(correctAnswer);

    opts.forEach(o => o.classList.add('disabled'));
    if (isCorrect) {
      card.classList.add('correct');
      correct++;
    } else {
      card.classList.add('wrong');
      wrong++;
    }
    // Highlight correct/incorrect options
    opts.forEach(o => {
      const k = o.dataset.key;
      const isUser = userAns.includes(k);
      const isRight = correctAnswer.includes(k);
      if (isUser && isRight) o.classList.add('correct-answer');
      else if (isUser && !isRight) o.classList.add('wrong-answer');
      else if (!isUser && isRight) o.classList.add('correct-answer');
    });
    exp.classList.add('show');
  });

  const total = QUESTIONS.length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreBadge').innerHTML = `${correct}/${total} (${pct}%)`;
  document.getElementById('scoreBadge').style.color = pct >= 70 ? '#52c41a' : pct >= 50 ? '#faad14' : '#ff4d4f';

  // Update summary
  document.getElementById('summaryTotal').textContent = total;
  document.getElementById('summaryCorrect').textContent = correct;
  document.getElementById('summaryWrong').textContent = wrong;
  document.getElementById('summaryRate').textContent = pct + '%';
  document.getElementById('summaryBar').classList.add('show');

  // Scroll to top
  window.scrollTo({top: 0, behavior: 'smooth'});

  // Show wrong list with detail
  const wrongIndices = [];
  const wrongDetails = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) {
      wrongIndices.push(i + 1);
      const userAns = userAnswers[i] || [];
      const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
      wrongDetails.push({
        idx: i + 1,
        id: q.id,
        module: q.module,
        stem: q.stem,
        userAnswer: userAns.length ? userAns.join(', ') : '（未作答）',
        correctAnswer: correctAnswer.join(', '),
      });
    }
  });
  const wrongNumsEl = document.getElementById('wrongNums');
  const detailText = document.getElementById('wrongDetailText');
  if (wrongIndices.length > 0) {
    wrongNumsEl.innerHTML = wrongIndices.map(n => `<span>#${n}</span>`).join('');
    // Build detail text for copying
    let text = '===== RD 错题报告 =====\n';
    text += '共 ' + wrongIndices.length + ' 题\n\n';
    wrongDetails.forEach((w, i) => {
      text += '--- 第' + w.idx + '题 ---\n';
      text += '题号: ' + w.idx + '  (数据库ID: ' + w.id + ')\n';
      text += '模块: ' + w.module + '\n';
      text += '题干: ' + w.stem + '\n';
      text += '你的答案: ' + w.userAnswer + '\n';
      text += '正确答案: ' + w.correctAnswer + '\n';
      text += '——————————————\n';
    });
    text += '\n请帮我分析这些错题的错因和薄弱点。';
    detailText.value = text;
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = '';
  } else {
    wrongNumsEl.innerHTML = '<span style="color:#52c41a;font-weight:600;">🎉 全部正确！</span>';
    detailText.value = '🎉 全部正确，太棒了！';
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = 'none';
  }
}

function resetQuiz() {
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    card.className = 'question-card';
    card.querySelectorAll('.option').forEach(o => {
      o.classList.remove('selected', 'correct-answer', 'wrong-answer', 'disabled');
    });
    document.getElementById(`exp-${i}`).classList.remove('show');
  });
  document.getElementById('scoreBadge').innerHTML = '待提交';
  document.getElementById('scoreBadge').style.color = '#667eea';
  document.getElementById('wrongList').classList.remove('show');
  document.getElementById('copyWrongBtn').style.display = 'none';
}

function copyWrongDetail() {
  const ta = document.getElementById('wrongDetailText');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try {
    navigator.clipboard.writeText(ta.value).then(() => {
      alert('✅ 已复制错题详情，请发给教练分析！');
    }).catch(() => {
      document.execCommand('copy');
      alert('✅ 已复制，请发给教练分析！');
    });
  } catch(e) {
    document.execCommand('copy');
    alert('✅ 已复制，请发给教练分析！');
  }
}

function copyWrongAnswers() {
  const wrongIndices = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) wrongIndices.push(i + 1);
  });
  if (wrongIndices.length === 0) {
    alert('🎉 全部正确，没有错题！');
    return;
  }
  const text = wrongIndices.join(', ');
  navigator.clipboard.writeText(text).then(() => {
    alert(`✅ 已复制错题号：${text}`);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert(`✅ 已复制错题号：${text}`);
  });
}

try {
  renderQuestions();
  document.getElementById('jsFallback').style.display = 'none';
} catch(e) {
  document.getElementById('jsFallback').innerHTML =
    '<div style="font-size:48px;margin-bottom:16px;">❌</div>' +
    '<div style="font-size:16px;color:#ff4d4f;">题目加载失败</div>' +
    '<div style="font-size:13px;margin-top:8px;color:#999;">错误: ' + e.message + '</div>' +
    '<div style="font-size:13px;margin-top:4px;color:#999;">请截屏此错误信息发给教练修复</div>';
  console.error('RD题卡渲染错误:', e);
}
</script>
