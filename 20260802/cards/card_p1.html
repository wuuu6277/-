<script>
const QUESTIONS = [{"id": 1954, "index": 1, "type": "multiple", "stem": "大学生的饮食问题包括（ ）。", "options": {"A": "经常食用风味小吃", "B": "不吃早餐", "C": "盲目减肥", "D": "过多饮用碳酸型饮料", "E": "很少食用粗粮或薯类"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "正确答案：A、B、C、D、E。选项解析：A.经常食用风味小吃；B.不吃早餐；C.盲目减肥；D.过多饮用碳酸型饮料；E.很少食用粗粮或薯类。建议查阅教材相应章节巩固知识。", "module": "食物营养", "is_single": false}, {"id": 1568, "index": 2, "type": "multiple", "stem": "在人群膳食调查报告中对居民膳食能量摄入状况可从（ ）方面进行描述。", "options": {"A": "不同地区居民能量摄入量与DRIs的比较", "B": "不同地区能量的摄入量及分布", "C": "不同家庭人均年收入水平居民能量的摄入状况", "D": "不同性别年龄居民能量的摄入状况", "E": "三大热能营养素的供热比"}, "answer": ["A", "B", "C", "D"], "explanation": "答案：ABCD居民膳食能量摄入状况可从不同地区居民能量摄入量与 DRIs 的比较、不同地区能 量的摄入量及分布、不同家庭人均年收入水平居民能量的摄入状况、不同性别年龄居民能量的摄入状况等方 面进行描述。三大热能营养素的供热比不属于对居民膳食能量摄入状况的描述范畴。", "module": "人群营养", "is_single": false}, {"id": 2080, "index": 3, "type": "multiple", "stem": "全科医生的“四合一”应诊内容包括（ ）", "options": {"A": "确诊并处理现患问题", "B": "对患者进行家访", "C": "对慢性活动性问题进行处理", "D": "根据需要提供预防性照顾", "E": "改善病人的就医和遵医行为"}, "answer": ["A", "C", "D", "E"], "explanation": "全科医生“四合一”应诊内容包括：确诊并处理现患问题、对慢性活动性问题进行处理、根据 需要提供预防性照顾、改善病人的就医和遵医行为。家访不属于“四合一”应诊内容。答案：ACDE", "module": "人群营养", "is_single": false}, {"id": 2378, "index": 4, "type": "multiple", "stem": "环境中二英的主要来源包括（ ）。", "options": {"A": "除草剂和落叶剂的使用", "B": "医院的废弃物", "C": "环境中光化学反应", "D": "城市垃圾的焚烧", "E": "汽车尾气"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "二噁英主要来源于城市垃圾的焚烧、医院的废弃物、环境中光化学反应、除草剂和落叶剂的使 用以及汽车尾气等。这些来源都可能导致二噁英的产生和释放到环境中。所以，正确答案是ABCDE。", "module": "临床营养", "is_single": false}, {"id": 1484, "index": 5, "type": "multiple", "stem": "膳食结构分析和评价时，在进行食物归类计算时，需先进行折算才能相加的食物类别有（ ）。", "options": {"A": "谷类及其制品", "B": "豆类及其制品", "C": "蔬菜水果类", "D": "鱼虾类", "E": "奶类及其制品"}, "answer": ["B", "E"], "explanation": "在食物归类计算时，由于豆类及其制品、奶类及其制品中不同食物营养成分差异较大，不能直 接相加，需先进行折算。谷类及其制品、蔬菜水果类、鱼虾类通常可直接相加。答案：BE", "module": "人群营养", "is_single": false}, {"id": 1338, "index": 6, "type": "multiple", "stem": "在挑选面粉时，下列为良质面粉表现的是（ ）。", "options": {"A": "味道淡而微甜", "B": "咀嚼时有沙声", "C": "置于手中紧捏后放开不成团", "D": "呈白色或微黄色", "E": "微有异味"}, "answer": ["A", "C", "D"], "explanation": "良质面粉气味正常无异味，味道淡而微甜，外观呈白色或微黄色，松散不黏手，捏后不成团 ，咀嚼无沙声。B选项咀嚼有沙声说明可能有杂质，E选项微有异味不是良质表现。A、C、D都符合良质面粉特 征。答案：ACD", "module": "DRIs", "is_single": false}, {"id": 3651, "index": 7, "type": "single", "stem": "体内铁主要存在于", "options": {"A": "骨骼", "B": "甲状腺", "C": "肌肉和骨", "D": "血红蛋白"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P62。体内65%~75%的铁分布于血红蛋白。", "module": "基础营养", "is_single": true}, {"id": 4355, "index": 8, "type": "single", "stem": "人体生长发育的第二高峰期是", "options": {"A": "婴儿期", "B": "幼儿期", "C": "学龄前儿童期", "D": "青少年期"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P143。青春期是人体身高和体重的第二次突增期，女生开始于10-12岁，男生开始于12-15岁。青少年期是指12~18岁，包括青春发育期及少年期，相当于初中和高中阶段。青少年的生理特点之一是身高和体重的第二次突增期。", "module": "人群营养", "is_single": true}, {"id": 4364, "index": 9, "type": "single", "stem": "某老年人，77岁，患高血压、高血脂，经常性便秘，日常膳食喜肉类食品，该老年人应该多进食的食物是", "options": {"A": "痩肉", "B": "牛奶", "C": "鸡蛋", "D": "蔬菜、水果"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P43。膳食纤维有促进排便的作用，蔬菜、水果可以增加粪便体积，防止便秘。", "module": "人群营养", "is_single": true}, {"id": 5319, "index": 10, "type": "single", "stem": "下列哪一种药物能阻断心迷走神经的作用", "options": {"A": "普蔡洛尔", "B": "阿托品", "C": "酚妥拉明", "D": "肾上腺素"}, "answer": "B", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 4309, "index": 11, "type": "single", "stem": "参与钾代谢过程的放射性物质是", "options": {"A": "131碘", "B": "90锶", "C": "137铯", "D": "226镭"}, "answer": "C", "explanation": "《营养与食品卫生学》第8版P358。137铯化学性质与钾相似，易被机体充分吸收并可参与钾的代谢过程。", "module": "食品卫生", "is_single": true}, {"id": 4048, "index": 12, "type": "single", "stem": "下列关于普通膳食的说法,不正确的是", "options": {"A": "属于平衡膳食", "B": "能量和营养素可以充分表达", "C": "与正常健康人平时所用的膳食相同", "D": "优质蛋白质占蛋白质总量的1/2"}, "answer": "D", "explanation": "优质蛋白质应占蛋白质总量的1/3,故D选项描述不正确。", "module": "临床营养", "is_single": true}, {"id": 3931, "index": 13, "type": "single", "stem": "男性,45岁,患高血压病2年,身高176cm,体重101kg,血压167/99mmHg,使用降压药效果较差;日常食量大,经常在外吃饭。对该患者的营养治疗不正确的是", "options": {"A": "低嘌呤饮食", "B": "限制总能量,降低体重", "C": "多食蔬菜、水果", "D": "限制摄入食盐在2~3g/d为宜"}, "answer": "A", "explanation": "该男性身高176cm，体重101kg，日常食量大，由此得出BMI为32.61，属于肥胖，所以应该限制总能量，降低体重；由于患者患有高血压所以应该限制食盐的摄入；多吃蔬菜、水果来增加膳食纤维和水，从而增加饱腹感减少其他高能量食物的摄入。而低嘌呤饮食适用于痛风患者，不适用高血压患者。", "module": "临床营养", "is_single": true}, {"id": 3798, "index": 14, "type": "single", "stem": "坚果的营养特点为", "options": {"A": "蛋白质含量约12%~25%,属于优质蛋白质", "B": "油脂含量较高,以不饱和脂肪酸为主", "C": "碳水化合物的含量都很低", "D": "含有大量的维生素C和硒等具有抗氧化作用的营养成分"}, "answer": "B", "explanation": "《营养与食品卫生学》第8版P157。坚果中油脂含量可高达44%-70%，以不饱和脂肪酸为主。", "module": "食物营养", "is_single": true}, {"id": 4622, "index": 15, "type": "single", "stem": "我国判断肥胖的标准是BMI值大于或等于", "options": {"A": "18.5", "B": "24", "C": "25", "D": "28"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P197、P206。2003年“中国肥胖问题工作组”根据我国20多个地区流行病学数据与BMI的关系分析，提出我国成人BMI标准：BMI&lt;18.5为消瘦，18.5~23.9为正常，24~27.9为超重，≥28为肥胖。", "module": "公共营养", "is_single": true}, {"id": 4614, "index": 16, "type": "single", "stem": "属于东方膳食结构特点的是", "options": {"A": "食用海产品较多", "B": "谷类食物消费量很小", "C": "食用畜肉较多", "D": "膳食纤维充足"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P27、P165、P239。东方膳食结构以植物性食物为主、动物性食物为辅，大多数发展中国家如印度、巴基斯坦、孟加拉国和非洲一些国家都属于此类型。该膳食结构的特点是谷物食物消费量大，动物性食物消费量小，植物性食物提供的能量占总能量近90%，动物性蛋白质一般少于蛋白质总量的10~20%，平均每天能量摄入为2000~2400千卡，蛋白质仅50克左右，脂肪仅30~40克，膳食纤维充足，来自动物性食物的营养素如铁、钙、维生素A的摄入量常会出现不足。这种膳食容易出现蛋白质、能量营养不良，以致体质较弱，健康状况不良，劳动能力降低，但心血管疾病、二型糖尿病、肿瘤等慢性病的发病率较低。", "module": "公共营养", "is_single": true}, {"id": 6388, "index": 17, "type": "single", "stem": "病人,女性,45岁,有出血和全血细胞减少症病史。现出现腿部疼痛就诊,其疼痛程度近年逐渐加重。断层扫描检查发现股骨头糜烂和变薄。骨髓活检确诊为Gaucher氏症。推测该病人细胞溶酶体内将出现何种物质蓄积", "options": {"A": "黏多糖", "B": "神经节苷脂", "C": "神经酰胺", "D": "脑苷脂"}, "answer": "D", "explanation": "Gaucher氏症是脑苷脂糖苷酶的缺陷所致，该酶的缺乏引起底物脑苷脂堆积。", "module": "脂质代谢", "is_single": true}, {"id": 6403, "index": 18, "type": "single", "stem": "下列氨基酸为酸性氨基酸的是", "options": {"A": "Val", "B": "Ser", "C": "Lys", "D": "Asp"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P10。“氨基酸分类”的表格中，酸性氨基酸有天冬氨酸（Asp）和谷氨酸（Glu）。 20种氨基酸根据其侧链的结构和理化性质可分成5类： ①非极性脂肪族氨基酸（Gly Ala Val Leu Ile Pro Met）； const userAnswers = {};

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const isSingle = q.is_single;
    const optionsHtml = Object.entries(q.options).map(([key, val]) =>
      `<div class="option ${isSingle?'option-single':'option-multi'}" data-q="${i}" data-key="${key}" onclick="selectOption(${i},'${key}',${isSingle})"><span class="option-key">${key}.</span><span>${val}</span></div>`
    ).join('');

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `qcard-${i}`;
    card.innerHTML = `
      <div class="q-header">
        <span class="q-number">#${i+1} <span style="font-weight:400;color:#999;font-size:13px">/ ${QUESTIONS.length}</span></span>
        <span><span class="q-type">${isSingle?'单选题':'多选题'}</span><span class="q-module">${q.module}</span></span>
      </div>
      <div class="q-stem">${q.stem}</div>
      <div class="options">${optionsHtml}</div>
      <div class="exp-toggle"><button id="expBtn-${i}" onclick="toggleExp(${i})" style="background:none;border:1px solid #d0d0d0;border-radius:6px;padding:4px 14px;font-size:13px;cursor:pointer;color:#667eea">📖 查看解析</button></div>
      <div class="explanation-box" id="exp-${i}">
        <div class="exp-label">📖 解析</div>
        <div>${q.explanation.replace('\n','<br>')}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function selectOption(qIdx, key, isSingle) {
  const card = document.getElementById(`qcard-${qIdx}`);
  const opts = card.querySelectorAll('.option');
  if (isSingle) {
    opts.forEach(o => o.classList.remove('selected'));
    opts.forEach(o => {
      if (o.dataset.key === key) o.classList.add('selected');
    });
    userAnswers[qIdx] = [key];
  } else {
    const el = card.querySelector(`.option[data-key="${key}"]`);
    el.classList.toggle('selected');
    const selected = [...card.querySelectorAll('.option.selected')].map(o => o.dataset.key);
    userAnswers[qIdx] = selected.length > 0 ? selected : null;
  }
}

function toggleExp(qIdx) {
  const box = document.getElementById(`exp-${qIdx}`);
  const btn = document.getElementById(`expBtn-${qIdx}`);
  if (box.classList.contains('show')) {
    box.classList.remove('show');
    btn.innerHTML = '📖 查看解析';
  } else {
    box.classList.add('show');
    btn.innerHTML = '📎 收起解析';
  }
}

function submitQuiz() {
  let correct = 0, wrong = 0;
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    const opts = card.querySelectorAll('.option');
    const exp = document.getElementById(`exp-${i}`);
    const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
    const userAns = userAnswers[i] || [];
    const isCorrect = userAns.length > 0 && JSON.stringify(userAns.slice().sort()) === JSON.stringify(correctAnswer);

    opts.forEach(o => o.classList.add('disabled'));
    if (isCorrect) {
      card.classList.add('correct');
      correct++;
    } else {
      card.classList.add('wrong');
      wrong++;
    }
    // Highlight correct/incorrect options
    opts.forEach(o => {
      const k = o.dataset.key;
      const isUser = userAns.includes(k);
      const isRight = correctAnswer.includes(k);
      if (isUser && isRight) o.classList.add('correct-answer');
      else if (isUser && !isRight) o.classList.add('wrong-answer');
      else if (!isUser && isRight) o.classList.add('correct-answer');
    });
    exp.classList.add('show');
  });

  const total = QUESTIONS.length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreBadge').innerHTML = `${correct}/${total} (${pct}%)`;
  document.getElementById('scoreBadge').style.color = pct >= 70 ? '#52c41a' : pct >= 50 ? '#faad14' : '#ff4d4f';

  // Update summary
  document.getElementById('summaryTotal').textContent = total;
  document.getElementById('summaryCorrect').textContent = correct;
  document.getElementById('summaryWrong').textContent = wrong;
  document.getElementById('summaryRate').textContent = pct + '%';
  document.getElementById('summaryBar').classList.add('show');

  // Scroll to top
  window.scrollTo({top: 0, behavior: 'smooth'});

  // Show wrong list with detail
  const wrongIndices = [];
  const wrongDetails = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) {
      wrongIndices.push(i + 1);
      const userAns = userAnswers[i] || [];
      const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
      wrongDetails.push({
        idx: i + 1,
        id: q.id,
        module: q.module,
        stem: q.stem,
        userAnswer: userAns.length ? userAns.join(', ') : '（未作答）',
        correctAnswer: correctAnswer.join(', '),
      });
    }
  });
  const wrongNumsEl = document.getElementById('wrongNums');
  const detailText = document.getElementById('wrongDetailText');
  if (wrongIndices.length > 0) {
    wrongNumsEl.innerHTML = wrongIndices.map(n => `<span>#${n}</span>`).join('');
    // Build detail text for copying
    let text = '===== RD 错题报告 =====\n';
    text += '共 ' + wrongIndices.length + ' 题\n\n';
    wrongDetails.forEach((w, i) => {
      text += '--- 第' + w.idx + '题 ---\n';
      text += '题号: ' + w.idx + '  (数据库ID: ' + w.id + ')\n';
      text += '模块: ' + w.module + '\n';
      text += '题干: ' + w.stem + '\n';
      text += '你的答案: ' + w.userAnswer + '\n';
      text += '正确答案: ' + w.correctAnswer + '\n';
      text += '——————————————\n';
    });
    text += '\n请帮我分析这些错题的错因和薄弱点。';
    detailText.value = text;
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = '';
  } else {
    wrongNumsEl.innerHTML = '<span style="color:#52c41a;font-weight:600;">🎉 全部正确！</span>';
    detailText.value = '🎉 全部正确，太棒了！';
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = 'none';
  }
}

function resetQuiz() {
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    card.className = 'question-card';
    card.querySelectorAll('.option').forEach(o => {
      o.classList.remove('selected', 'correct-answer', 'wrong-answer', 'disabled');
    });
    document.getElementById(`exp-${i}`).classList.remove('show');
  });
  document.getElementById('scoreBadge').innerHTML = '待提交';
  document.getElementById('scoreBadge').style.color = '#667eea';
  document.getElementById('wrongList').classList.remove('show');
  document.getElementById('copyWrongBtn').style.display = 'none';
}

function copyWrongDetail() {
  const ta = document.getElementById('wrongDetailText');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try {
    navigator.clipboard.writeText(ta.value).then(() => {
      alert('✅ 已复制错题详情，请发给教练分析！');
    }).catch(() => {
      document.execCommand('copy');
      alert('✅ 已复制，请发给教练分析！');
    });
  } catch(e) {
    document.execCommand('copy');
    alert('✅ 已复制，请发给教练分析！');
  }
}

function copyWrongAnswers() {
  const wrongIndices = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) wrongIndices.push(i + 1);
  });
  if (wrongIndices.length === 0) {
    alert('🎉 全部正确，没有错题！');
    return;
  }
  const text = wrongIndices.join(', ');
  navigator.clipboard.writeText(text).then(() => {
    alert(`✅ 已复制错题号：${text}`);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert(`✅ 已复制错题号：${text}`);
  });
}

  document.getElementById('jsFallback').style.display = 'none';
} catch(e) {
  document.getElementById('jsFallback').innerHTML =
    '<div style="font-size:48px;margin-bottom:16px;">❌</div>' +
    '<div style="font-size:16px;color:#ff4d4f;">题目加载失败</div>' +
    '<div style="font-size:13px;margin-top:8px;color:#999;">错误: ' + e.message + '</div>' +
    '<div style="font-size:13px;margin-top:4px;color:#999;">请截屏此错误信息发给教练修复</div>';
  console.error('RD题卡渲染错误:', e);
}
</script>
<script>
(function() {
  const RD_CARD_KEY = "2026-08-02-RD每日题卡_20260802_Part1_上午50题";
  const RD_CARD_FILE = "RD每日题卡_20260802_Part1_上午50题.html";
  const RD_DATE = "2026-08-02";
  const RD_STORAGE_KEY = "rd-progress:" + RD_CARD_KEY;
  function localHost() {
    const h = location.hostname;
    return location.protocol === "http:" && (h === "localhost" || h === "127.0.0.1" || /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(h));
  }
  function snapshot() {
    const attempted = {};
    document.querySelectorAll('[id^="qcard-"], .q').forEach((card, idx) => {
      const selected = [...card.querySelectorAll('.option.selected, input:checked')].map(el => el.dataset?.key || el.value).filter(Boolean);
      if (!selected.length) return;
      const questionIndex = card.id.indexOf('qcard-') === 0 ? Number(card.id.slice(6)) : idx;
      let q = null;
      try { q = QUESTIONS[questionIndex] || null; } catch (e) { q = null; }
      const questionId = q ? String(q.id) : String(questionIndex + 1);
      attempted[questionId] = [...new Set(selected)].sort();
    });
    return {card_key: RD_CARD_KEY, card_filename: RD_CARD_FILE, date: RD_DATE, attempted: attempted, updated_at: new Date().toISOString()};
  }
  function paint(data) {
    let el = document.getElementById('rdAutoProgress');
    if (!el) { el = document.createElement('div'); el.id = 'rdAutoProgress'; el.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:9999;background:#fff;padding:8px 12px;border-radius:8px;box-shadow:0 2px 10px #0002;font-size:13px;color:#555'; document.body.appendChild(el); }
    el.textContent = '已自动记录：' + Object.keys(data.attempted || {}).length + '题';
  }
  function apply(data) {
    const attempted = data && data.attempted || {};
    Object.entries(attempted).forEach(([qid, values]) => {
      let index = -1;
      try { index = QUESTIONS.findIndex(q => String(q.id) === String(qid)); } catch (e) {}
      const card = index >= 0 ? (document.getElementById('qcard-' + index) || document.getElementById('c' + (index + 1))) : null;
      if (!card) return;
      (values || []).forEach(key => {
        const option = card.querySelector('.option[data-key="' + key + '"], input[value="' + key + '"]');
        if (option && option.classList && option.classList.contains('option')) option.click();
        else if (option) option.checked = true;
      });
    });
    paint(data || {attempted: {}});
  }
  async function restore() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(RD_STORAGE_KEY) || 'null'); } catch (e) {}
    if (localHost()) {
      try {
        const r = await fetch(location.origin + '/api/progress?date=' + encodeURIComponent(RD_DATE) + '&card_key=' + encodeURIComponent(RD_CARD_KEY));
        if (r.ok) data = await r.json();
      } catch (e) {}
    }
    if (data) apply(data);
  }
  function save() {
    const data = snapshot();
    try { localStorage.setItem(RD_STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    paint(data);
    if (localHost()) {
      try { navigator.sendBeacon(location.origin + '/api/progress', new Blob([JSON.stringify(data)], {type:'application/json'})); } catch (e) {}
    }
  }
  function init() {
    document.addEventListener('click', e => { if (e.target.closest('.option, .op, input')) setTimeout(save, 0); });
    document.addEventListener('change', save);
    window.addEventListener('beforeunload', save);
    restore().finally(() => setTimeout(save, 300));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script></body>
