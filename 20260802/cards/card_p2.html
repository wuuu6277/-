<script>
const QUESTIONS = [{"id": 1877, "index": 1, "type": "multiple", "stem": "下列关于儿童膳食中碘RNI的叙述，正确的是（ ）。", "options": {"A": "11～13岁儿童的碘元素的RNI为150μg/日", "B": "7～10岁儿童的碘元素的RNI为60μg/日", "C": "11～13岁儿童的碘元素的RNI为120μg/日", "D": "7～10岁儿童的碘元素的RNI为90μg/日", "E": "14～18岁儿童的碘元素的RNI为150μg/日"}, "answer": ["C", "D", "E"], "explanation": "不同年龄段儿童碘的RNI不同，7～10岁儿童碘RNI为90μg/日，11～13岁儿童碘RNI为120μg/日 ，14～18岁儿童碘RNI为150μg/日。需对各年龄段标准准确记忆。答案：该题正确答案为：A（11～13岁儿童 的碘元素的RNI为150μg/日表述错误，应为120μg/日）；B（7～10岁儿童的碘元素的RNI为60μg/日表述错 误，应为90μg/日）；C（11～13岁儿童的碘元素的RNI为120μg/日，正确）；D（7～10岁儿童的碘元素的 RNI为90μg/日，正确）；E（14～18岁儿童的碘元素的RNI为150μg/日，正确）。所以答案为CDE 。", "module": "食品卫生", "is_single": false}, {"id": 1630, "index": 2, "type": "multiple", "stem": "以下属于退行性疾的是（ ）", "options": {"A": "乙型肝炎", "B": "糖尿病", "C": "骨性关节炎", "D": "流感", "E": "大肠癌"}, "answer": ["B", "C", "E"], "explanation": "正确答案：B、C、E。选项解析：A.乙型肝炎；B.糖尿病；C.骨性关节炎；D.流感；E.大肠癌。建议查阅教材相应章节巩固知识。", "module": "人群营养", "is_single": false}, {"id": 209, "index": 3, "type": "multiple", "stem": "从家庭因素看餐饮市场可分为（ ）", "options": {"A": "大家庭市场", "B": "儿童市场", "C": "单亲家庭市场", "D": "丁克家庭市场", "E": "老年人市场"}, "answer": ["A", "C", "D"], "explanation": "题目强调从家庭因素分类，儿童和老年人并非以家庭类型来划分，大家庭、单亲家庭、丁克家 庭属于不同家庭类型。答案：ACD", "module": "食品卫生", "is_single": false}, {"id": 2387, "index": 4, "type": "multiple", "stem": "以提供能量为主的食物为纯能量食物，包括（ ）。", "options": {"A": "动植物油", "B": "淀粉", "C": "食用糖", "D": "高度酒", "E": "大豆制品"}, "answer": ["A", "B", "C", "D"], "explanation": "纯能量食物主要提供能量，动植物油富含脂肪，淀粉可转化为能量，食用糖直接供能，高度酒 含酒精能供能；而大豆制品除提供能量外，还富含蛋白质等其他多种营养成分，不属于纯能量食物。答案 ：ABCD", "module": "DRIs", "is_single": false}, {"id": 2085, "index": 5, "type": "multiple", "stem": "学龄前儿童补充膳食铁，应该多食用高铁含量的食物如（ ）。", "options": {"A": "牛奶", "B": "大豆", "C": "动物肝脏", "D": "血制品", "E": "瘦肉"}, "answer": ["C", "D", "E"], "explanation": "动物肝脏、血制品、瘦肉均是铁的良好来源，且含量较高。牛奶铁含量低，大豆铁含量不如动 物肝脏、血制品及瘦肉高。答案：CDE", "module": "人群营养", "is_single": false}, {"id": 2158, "index": 6, "type": "multiple", "stem": "学龄前儿童要避免进食（ ）。", "options": {"A": "油多食品", "B": "刺激性食品", "C": "高糖食品和饮料", "D": "水果冻", "E": "膨化食品"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "答案:ABCDE解析:学龄前儿童胃肠功能较弱，油多食品、刺激性食品、高糖食品和饮料、水果冻 、膨化食品等不利于消化，且可能对身体发育产生不良影响，所以都应避免进食。", "module": "人群营养", "is_single": false}, {"id": 2682, "index": 7, "type": "multiple", "stem": "常用物理保藏方法包括（ ）。", "options": {"A": "冷却保藏", "B": "辐照保藏", "C": "冻结保藏", "D": "高压保藏", "E": "液熏法"}, "answer": ["A", "B", "C", "D"], "explanation": "物理保藏方法是通过控制环境温度、压力、辐射等物理因素来实现食品保藏。冷却保藏、冻结 保藏是通过改变温度；辐照保藏利用射线；高压保藏通过改变压力，都属于物理保藏。而液熏法属于化学保 藏方法。答案：ABCD", "module": "食物营养", "is_single": false}, {"id": 1952, "index": 8, "type": "multiple", "stem": "下列指标不属于比的是（ ）。", "options": {"A": "某班女生人数占全班的56.9%", "B": "某地性别比例是105%", "C": "某小区高血压的患病率是10%", "D": "某地2005年贫血发病率为8%", "E": "某班性别比例是105：100"}, "answer": ["A", "C", "D"], "explanation": "比是两个数的相对关系。 选项A、C、D中，某班女生人数占全班的比例、小区高血压患病率、 某地贫血发病率，这些是反映部分在总体中所占的比重，属于构成比。 选项B“某地性别比例是105%”和选 项E“某班性别比例是105：100”，是两个同类指标的比，属于比的范畴。答案：ACD", "module": "食物营养", "is_single": false}, {"id": 3072, "index": 9, "type": "multiple", "stem": "以下哪些因素常与儿童生长发育有关（ ）。", "options": {"A": "消化不良", "B": "进食无规律", "C": "服用药物", "D": "膳食", "E": "运动强度"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "儿童生长发育受多种因素影响，膳食提供生长所需营养，运动强度合理与否影响身体机能和发 育，消化不良影响营养吸收，进食无规律也会干扰营养摄取，而服用某些药物可能影响激素水平等进而影响 发育。答案：ABCDE", "module": "人群营养", "is_single": false}, {"id": 703, "index": 10, "type": "multiple", "stem": "原料价格的控制主要包括（ ）", "options": {"A": "规定采购价格，减少中间环节", "B": "规定购货渠道和供应单位", "C": "控制大宗和贵重原料的购货权", "D": "提高购货量和改变购货规格", "E": "根据市场行情适时采购"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "原料价格控制有多方面手段。规定采购价格、减少中间环节可降低成本；规定购货渠道和供应 单位能稳定价格；控制大宗和贵重原料购货权避免价格失控；提高购货量获优惠、改变购货规格影响价格 ；根据市场行情适时采购抓住低价时机。这些都属于原料价格控制方式。答案：ABCDE", "module": "食品卫生", "is_single": false}, {"id": 3677, "index": 11, "type": "single", "stem": "以下关于维生素D的说法,错误的是", "options": {"A": "25-(OH)D3是维生素D在血液的主要存在形式", "B": "通过检测血浆中25-(OH)D3水平可以评价维生素D营养状况", "C": "血清钙磷乘积也被用于鉴定维生素D的营养水平", "D": "25-(OH)D3半衰期是1个月"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P79。25-(OH)-D3是维生素D在血液中的主要存在形式，主要依赖于皮肤产生和膳食摄入，其半衰期是3周，可特异性地反映出人体几周到几个月内维生素D的储存情况；此外，在血液中25-(OH)-D3受机体调节影响较小，因而作为首选评价机体维生素D状况的指标。", "module": "基础营养", "is_single": true}, {"id": 5896, "index": 12, "type": "single", "stem": "氨由肌组织通过血液向肝进行转运的过程是", "options": {"A": "鸟氨酸循环", "B": "丙氨酸-葡萄糖循环", "C": "γ-谷氨酰基循环", "D": "甲硫氨酸循环"}, "answer": "B", "explanation": "《生物化学与分子生物学》第10版P180。氨通过丙氨酸-葡萄糖循环从骨骼肌运往肝。故选B。", "module": "氨基酸代谢", "is_single": true}, {"id": 4424, "index": 13, "type": "single", "stem": "职业接触有毒有害物质种类繁多，不包括", "options": {"A": "四氯化碳", "B": "煤尘", "C": "塑料", "D": "苯胺"}, "answer": "C", "explanation": "本题主要考查职业接触物质。塑料不属于职业接触有害物质。", "module": "人群营养", "is_single": true}, {"id": 4480, "index": 14, "type": "single", "stem": "放射损伤脂肪的供给量不宜过高，但应增加", "options": {"A": "饱和脂肪酸", "B": "必需脂肪酸", "C": "猪油", "D": "羊油"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P158。能量、蛋白质和必需氨基酸摄入不足增加机体对辐射的敏感性，从而加重组织损伤和延缓机体恢复。一般建议蛋白质供能占总能量的12%~18%，以补充优质蛋白质为主；碳水化合物占60%~65%；注意适量增加必需脂肪酸和ω-3多不饱和脂肪酸的摄入，控制血脂水平，不建议增加脂肪占总能量的比例。", "module": "人群营养", "is_single": true}, {"id": 4421, "index": 15, "type": "single", "stem": "为满足自身及胎儿生长发育的需要，孕妇整个孕期共需蛋白质约为", "options": {"A": "0g", "B": "15g", "C": "20g", "D": "900g"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P134。孕期孕妇对蛋白质的需要量增加，以满足母体、胎盘和胎儿生长的需要。孕妇蛋白质推荐摄入量为：妊振早期不增加，妊娠中期和妊娠晚期分别增加15g/d和30g/d。", "module": "人群营养", "is_single": true}, {"id": 5383, "index": 16, "type": "single", "stem": "浦肯野细胞动作电位0期去极化", "options": {"A": "因Na+内流而产生", "B": "因Ca2+内流而产生", "C": "因Cl-内流而产", "D": "因K+内流而产生"}, "answer": "A", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 5317, "index": 17, "type": "single", "stem": "血液在血管中流动时,血流阻力", "options": {"A": "与血管半径成反比", "B": "与血管半径的平方成反比", "C": "与血管半径的立方成正比", "D": "与血管半径的4次方成反比"}, "answer": "D", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 5285, "index": 18, "type": "single", "stem": "【技师不做】男,24岁。不洁饮食后腹泻2天,心悸1天。心电图示频发提前发生的宽大畸形QRS波群,时限>0.12秒。其最可能发生在心肌细胞的", "options": {"A": "相对不应期", "B": "快速复极初期", "C": "有效不应期", "D": "静息期"}, "answer": "A", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 4182, "index": 19, "type": "single", "stem": "能引起肝肾损伤型毒蕈中毒的是", "options": {"A": "黑伞蕈属", "B": "褐鳞小伞蕈", "C": "鹿花簟", "D": "丝盖伞"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P395。引起此型的主要为毒伞属蕈、褐鳞小伞蕈和秋生盔孢伞蕈。", "module": "食品卫生", "is_single": true}, {"id": 4157, "index": 20, "type": "single", "stem": "下列细菌性食物中毒中可引起肝肾损伤的是", "options": {"A": "沙门氏菌", "B": "大肠埃希菌", "C": "副溶血性弧菌", "D": "椰毒假单胞菌"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P375、P377、P380、P389。沙门氏菌食物中毒有多种临床表现，可分为胃肠炎型、类霍乱型、类伤寒型、类感冒型、败血症型，其中以胃肠炎型最为常见。副溶血性弧菌临床表现：发病急，潜伏期短，上腹部阵发性绞痛，腹泻后出现恶心、呕吐。临床表现因致病性大肠埃希氏菌的类型不同而有所不同，主要有以下三种类型：急性胃肠炎型、急性菌痢型、急性肠炎型。椰毒假单胞菌酵米面亚种食物中毒临床上胃肠道症状和神经症候群的出现较早。继消化道症状后，也可能出现肝大、肝功能异常等中毒性肝炎为主的临床表现，重症者出现肝性昏迷，甚至死亡。对肾脏的损害一般出现得较晚，轻者出现血尿、蛋白尿等，重者出现血中尿素氮含量增加、少尿、无尿等尿毒症症状，严重时可因肾衰竭而死亡。", "module": "食品卫生", "is_single": true}, {"id": 3969, "index": 21, "type": "single", "stem": "抑制肿瘤作用机制不涉及抗氧化的是", "options": {"A": "维生素C", "B": "维生素D", "C": "β-胡萝卜素", "D": "维生素E"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P79，低维生素D与高血压、部分肿瘤、糖尿病、心脑血管疾病、脂肪肝、低水平的炎性反应、自身免疫性疾病等密切相关。P76，β-胡萝卜素具有抗氧化作用和抑制肿瘤生长。 P80，维生素E具有抗氧化作用。 P94，维生素C具有很强的抗氧化作用。 只有维生素D是可以抑制肿瘤作用机制但是没有涉及抗氧化作用的。", "module": "临床营养", "is_single": true}, {"id": 4038, "index": 22, "type": "single", "stem": "营养治疗流程不包括", "options": {"A": "营养风险筛查", "B": "营养状况评估", "C": "营养干预", "D": "疾病治疗评价"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P179。营养治疗流程包括营养风险筛查、确定营养不良风险患者、营养状况评估、营养干预、营养疗效评价。故此答案为D。", "module": "临床营养", "is_single": true}, {"id": 3964, "index": 23, "type": "single", "stem": "《中国居民膳食指南（2022）》建议,成人每日反式脂肪酸摄入量不超过", "options": {"A": "1.0g", "B": "2.0g", "C": "2.5g", "D": "5g"}, "answer": "B", "explanation": "《中国居民膳食指南（2022）P95。推荐反式脂肪酸每天摄入量不超过2g。", "module": "临床营养", "is_single": true}, {"id": 3878, "index": 24, "type": "single", "stem": "豆类与谷类蛋白质有互补作用,是因为豆类含有较多的", "options": {"A": "蛋白质", "B": "必需氨基酸", "C": "赖氨酸", "D": "苏氨酸"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P117。谷类蛋白质的必需氨基酸组成比例不合理，蛋白质营养价值低于动物性食物。为了提高谷类蛋白质营养价值，可以利用蛋白质互补作用，将赖氨酸含量较少的谷类与富含赖氨酸的豆类食品进行混合食用，这种方式可以有效弥补谷类食物中赖氨酸的不足，从而提升其整体的营养价值。此外，还可以采用赖氨酸强化的方法，直接增加谷类食品中赖氨酸的含量，以此提升谷类蛋白质的营养价值。&nbsp;", "module": "食物营养", "is_single": true}, {"id": 3791, "index": 25, "type": "single", "stem": "为准确计算各种食物在烹调后的维生素含量,需要考虑", "options": {"A": "维生素保留因子", "B": "维生素保留因子、蛋白质转化系数", "C": "维生素保留因子、可食部比例", "D": "维生素保留因子、重量变化因子"}, "answer": "D", "explanation": "《营养与食品卫生学》第版P115。通过营养素保留因子和重量变化因子作为参考数值，计算得到各种食物在烹调后的维生素含量也更加准确。", "module": "食物营养", "is_single": true}, {"id": 4516, "index": 26, "type": "single", "stem": "按照中国居民膳食平衡宝塔的要求，动物性食物的摄入量应为", "options": {"A": "25～50g", "B": "50～l00g", "C": "100～150g", "D": "120～200g"}, "answer": "D", "explanation": "《中国居民平衡膳食宝塔（2022）》P3。主要考查膳食宝塔的推荐摄入量，动物性食品在笫3层，每天为120～200g。", "module": "公共营养", "is_single": true}, {"id": 4611, "index": 27, "type": "single", "stem": "营养监测的内容包括①居民营养及相关健康状况的监测②居民饮食行为和生活方式的监测③食物成分和营养数据库变化的监测④食品供应情况及其影响因素的监测⑤居民食物和营养素摄入情况的监测", "options": {"A": "②③④⑤", "B": "①②④⑤", "C": "①②③④", "D": "①②③④⑤"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P170-P171。营养监测的内容包括居民营养及相关健康状况的监测，居民食物、能量和营养素摄入情况的监测，居民营养知识、营养态度、饮食行为和生活方式的监测，营养成分和营养数据库变化的监测，食物供应情况及其影响决定因素的监测，社会经济发展水平的监测。", "module": "公共营养", "is_single": true}, {"id": 4631, "index": 28, "type": "single", "stem": "处于小康水平的居民Engel指数为", "options": {"A": "≥60%", "B": "0%~59%", "C": "40%~49%", "D": "30%~39%"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P172。食物支出占家庭总收入的比重称作Engel指数，Engel指数=用于食品的开支/家庭总收入×100%，它是衡量一个国家或地区居民消费水平的标志，是反映贫困富余的指标。该指数在60%以上者为贫困、50~59%为勉强度日、40~49%为小康水平、30~39%为富裕、30%以下为最富裕。", "module": "公共营养", "is_single": true}, {"id": 6165, "index": 29, "type": "single", "stem": "下列有关糖有氧氧化的叙述中,哪一项是错误的", "options": {"A": "糖有氧氧化的产物是CO2及H2O", "B": "肌中糖有氧氧化可抑制糖酵解", "C": "糖有氧氧化是细胞获取能量的主要方式", "D": "机体所有的细胞都可以利用糖有氧氧化获取能量"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P96。 ABC均正确。D机体并不是所有细胞都具有线粒体，而有氧氧化第二阶段需要在线粒体中进行反应。", "module": "糖代谢", "is_single": true}, {"id": 6383, "index": 30, "type": "single", "stem": "1型糖尿病病人,女性,56岁,在眼科就诊评估其白内障 const userAnswers = {};

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const isSingle = q.is_single;
    const optionsHtml = Object.entries(q.options).map(([key, val]) =>
      `<div class="option ${isSingle?'option-single':'option-multi'}" data-q="${i}" data-key="${key}" onclick="selectOption(${i},'${key}',${isSingle})"><span class="option-key">${key}.</span><span>${val}</span></div>`
    ).join('');

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `qcard-${i}`;
    card.innerHTML = `
      <div class="q-header">
        <span class="q-number">#${i+1} <span style="font-weight:400;color:#999;font-size:13px">/ ${QUESTIONS.length}</span></span>
        <span><span class="q-type">${isSingle?'单选题':'多选题'}</span><span class="q-module">${q.module}</span></span>
      </div>
      <div class="q-stem">${q.stem}</div>
      <div class="options">${optionsHtml}</div>
      <div class="exp-toggle"><button id="expBtn-${i}" onclick="toggleExp(${i})" style="background:none;border:1px solid #d0d0d0;border-radius:6px;padding:4px 14px;font-size:13px;cursor:pointer;color:#667eea">📖 查看解析</button></div>
      <div class="explanation-box" id="exp-${i}">
        <div class="exp-label">📖 解析</div>
        <div>${q.explanation.replace('\n','<br>')}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function selectOption(qIdx, key, isSingle) {
  const card = document.getElementById(`qcard-${qIdx}`);
  const opts = card.querySelectorAll('.option');
  if (isSingle) {
    opts.forEach(o => o.classList.remove('selected'));
    opts.forEach(o => {
      if (o.dataset.key === key) o.classList.add('selected');
    });
    userAnswers[qIdx] = [key];
  } else {
    const el = card.querySelector(`.option[data-key="${key}"]`);
    el.classList.toggle('selected');
    const selected = [...card.querySelectorAll('.option.selected')].map(o => o.dataset.key);
    userAnswers[qIdx] = selected.length > 0 ? selected : null;
  }
}

function toggleExp(qIdx) {
  const box = document.getElementById(`exp-${qIdx}`);
  const btn = document.getElementById(`expBtn-${qIdx}`);
  if (box.classList.contains('show')) {
    box.classList.remove('show');
    btn.innerHTML = '📖 查看解析';
  } else {
    box.classList.add('show');
    btn.innerHTML = '📎 收起解析';
  }
}

function submitQuiz() {
  let correct = 0, wrong = 0;
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    const opts = card.querySelectorAll('.option');
    const exp = document.getElementById(`exp-${i}`);
    const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
    const userAns = userAnswers[i] || [];
    const isCorrect = userAns.length > 0 && JSON.stringify(userAns.slice().sort()) === JSON.stringify(correctAnswer);

    opts.forEach(o => o.classList.add('disabled'));
    if (isCorrect) {
      card.classList.add('correct');
      correct++;
    } else {
      card.classList.add('wrong');
      wrong++;
    }
    // Highlight correct/incorrect options
    opts.forEach(o => {
      const k = o.dataset.key;
      const isUser = userAns.includes(k);
      const isRight = correctAnswer.includes(k);
      if (isUser && isRight) o.classList.add('correct-answer');
      else if (isUser && !isRight) o.classList.add('wrong-answer');
      else if (!isUser && isRight) o.classList.add('correct-answer');
    });
    exp.classList.add('show');
  });

  const total = QUESTIONS.length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreBadge').innerHTML = `${correct}/${total} (${pct}%)`;
  document.getElementById('scoreBadge').style.color = pct >= 70 ? '#52c41a' : pct >= 50 ? '#faad14' : '#ff4d4f';

  // Update summary
  document.getElementById('summaryTotal').textContent = total;
  document.getElementById('summaryCorrect').textContent = correct;
  document.getElementById('summaryWrong').textContent = wrong;
  document.getElementById('summaryRate').textContent = pct + '%';
  document.getElementById('summaryBar').classList.add('show');

  // Scroll to top
  window.scrollTo({top: 0, behavior: 'smooth'});

  const wrongIndices = [];

      wrongDetails.push({
        idx: i + 1,
        id: q.id,
        module: q.module,
        stem: q.stem,
        userAnswer: userAns.length ? userAns.join(', ') : '（未作答）',
        correctAnswer: correctAnswer.join(', '),
      });
    }
  });
  const wrongNumsEl = document.getElementById('wrongNums');
  const detailText = document.getElementById('wrongDetailText');
  if (wrongIndices.length > 0) {
    wrongNumsEl.innerHTML = wrongIndices.map(n => `<span>#${n}</span>`).join('');
    // Build detail text for copying
    let text = '===== RD 错题报告 =====\n';
    text += '共 ' + wrongIndices.length + ' 题\n\n';
    wrongDetails.forEach((w, i) => {
      text += '--- 第' + w.idx + '题 ---\n';
      text += '题号: ' + w.idx + '  (数据库ID: ' + w.id + ')\n';
      text += '模块: ' + w.module + '\n';
      text += '题干: ' + w.stem + '\n';
      text += '你的答案: ' + w.userAnswer + '\n';
      text += '正确答案: ' + w.correctAnswer + '\n';
      text += '——————————————\n';
    });
    text += '\n请帮我分析这些错题的错因和薄弱点。';
    detailText.value = text;
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = '';
  } else {
    wrongNumsEl.innerHTML = '<span style="color:#52c41a;font-weight:600;">🎉 全部正确！</span>';
    detailText.value = '🎉 全部正确，太棒了！';
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = 'none';
  }
}

function resetQuiz() {
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    card.className = 'question-card';
    card.querySelectorAll('.option').forEach(o => {
      o.classList.remove('selected', 'correct-answer', 'wrong-answer', 'disabled');
    });
    document.getElementById(`exp-${i}`).classList.remove('show');
  });
  document.getElementById('scoreBadge').innerHTML = '待提交';
  document.getElementById('scoreBadge').style.color = '#667eea';
  document.getElementById('wrongList').classList.remove('show');
  document.getElementById('copyWrongBtn').style.display = 'none';
}

function copyWrongDetail() {
  const ta = document.getElementById('wrongDetailText');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try {
    navigator.clipboard.writeText(ta.value).then(() => {
      alert('✅ 已复制错题详情，请发给教练分析！');
    }).catch(() => {
      document.execCommand('copy');
      alert('✅ 已复制，请发给教练分析！');
    });
  } catch(e) {
    document.execCommand('copy');
    alert('✅ 已复制，请发给教练分析！');
  }
}

function copyWrongAnswers() {
  const wrongIndices = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) wrongIndices.push(i + 1);
  });
  if (wrongIndices.length === 0) {
    alert('🎉 全部正确，没有错题！');
    return;
  }
  const text = wrongIndices.join(', ');
  navigator.clipboard.writeText(text).then(() => {
    alert(`✅ 已复制错题号：${text}`);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert(`✅ 已复制错题号：${text}`);
  });
}

try {
  renderQuestions();
  document.getElementById('jsFallback').style.display = 'none';
} catch(e) {
  document.getElementById('jsFallback').innerHTML =
    '<div style="font-size:48px;margin-bottom:16px;">❌</div>' +
    '<div style="font-size:16px;color:#ff4d4f;">题目加载失败</div>' +
    '<div style="font-size:13px;margin-top:8px;color:#999;">错误: ' + e.message + '</div>' +
    '<div style="font-size:13px;margin-top:4px;color:#999;">请截屏此错误信息发给教练修复</div>';
  console.error('RD题卡渲染错误:', e);
}
</script>
<script>
(function() {
  const RD_CARD_KEY = "2026-08-02-RD每日题卡_20260802_Part2_晚上50题";
  const RD_CARD_FILE = "RD每日题卡_20260802_Part2_晚上50题.html";
  const RD_DATE = "2026-08-02";
  const RD_STORAGE_KEY = "rd-progress:" + RD_CARD_KEY;
  function localHost() {
    const h = location.hostname;
    return location.protocol === "http:" && (h === "localhost" || h === "127.0.0.1" || /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(h));
  }
  function snapshot() {
    const attempted = {};
    document.querySelectorAll('[id^="qcard-"], .q').forEach((card, idx) => {
      const selected = [...card.querySelectorAll('.option.selected, input:checked')].map(el => el.dataset?.key || el.value).filter(Boolean);
      if (!selected.length) return;
      const questionIndex = card.id.indexOf('qcard-') === 0 ? Number(card.id.slice(6)) : idx;
      let q = null;
      try { q = QUESTIONS[questionIndex] || null; } catch (e) { q = null; }
      const questionId = q ? String(q.id) : String(questionIndex + 1);
      attempted[questionId] = [...new Set(selected)].sort();
    });
    return {card_key: RD_CARD_KEY, card_filename: RD_CARD_FILE, date: RD_DATE, attempted: attempted, updated_at: new Date().toISOString()};
  }
  function paint(data) {
    let el = document.getElementById('rdAutoProgress');
    if (!el) { el = document.createElement('div'); el.id = 'rdAutoProgress'; el.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:9999;background:#fff;padding:8px 12px;border-radius:8px;box-shadow:0 2px 10px #0002;font-size:13px;color:#555'; document.body.appendChild(el); }
    el.textContent = '已自动记录：' + Object.keys(data.attempted || {}).length + '题';
  }
  function apply(data) {
    const attempted = data && data.attempted || {};
    Object.entries(attempted).forEach(([qid, values]) => {
      let index = -1;
      try { index = QUESTIONS.findIndex(q => String(q.id) === String(qid)); } catch (e) {}
      const card = index >= 0 ? (document.getElementById('qcard-' + index) || document.getElementById('c' + (index + 1))) : null;
      if (!card) return;
      (values || []).forEach(key => {
        const option = card.querySelector('.option[data-key="' + key + '"], input[value="' + key + '"]');
        if (option && option.classList && option.classList.contains('option')) option.click();
        else if (option) option.checked = true;
      });
    });
    paint(data || {attempted: {}});
  }
  async function restore() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(RD_STORAGE_KEY) || 'null'); } catch (e) {}
    if (localHost()) {
      try {
        const r = await fetch(location.origin + '/api/progress?date=' + encodeURIComponent(RD_DATE) + '&card_key=' + encodeURIComponent(RD_CARD_KEY));
        if (r.ok) data = await r.json();
      } catch (e) {}
    }
    if (data) apply(data);
  }
  function save() {
    const data = snapshot();
    try { localStorage.setItem(RD_STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    paint(data);
    if (localHost()) {
      try { navigator.sendBeacon(location.origin + '/api/progress', new Blob([JSON.stringify(data)], {type:'application/json'})); } catch (e) {}
    }
  }
  function init() {
    document.addEventListener('click', e => { if (e.target.closest('.option, .op, input')) setTimeout(save, 0); });
    document.addEventListener('change', save);
    window.addEventListener('beforeunload', save);
    restore().finally(() => setTimeout(save, 300));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script></body>
