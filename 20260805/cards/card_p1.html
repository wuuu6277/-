<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; padding: 20px; }
.container { max-width: 860px; margin: 0 auto; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border-radius: 16px; padding: 28px 32px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }

.controls button { padding: 10px 28px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 600; transition: all 0.2s; }

.question-card.wrong { border-left-color: #ff4d4f; background: #fff2f0; }
.q-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 8px; }

.options { display: flex; flex-direction: column; gap: 8px; }

.option:hover { border-color: #667eea; background: #f8f9ff; }
.option.selected { border-color: #667eea; background: #f0f2ff; }

.option.wrong-answer { border-color: #ff4d4f; background: #fff2f0; }
.option-key { font-weight: 700; color: #667eea; min-width: 24px; }
.option.disabled { pointer-events: none; opacity: 0.85; }
.explanation-box { margin-top: 14px; padding: 14px 18px; background: #fafafa; border-radius: 8px; border-left: 4px solid #667eea; display: none; font-size: 14px; line-height: 1.7; color: #555; }
.explanation-box.show { display: block; }
.explanation-box .exp-label { font-weight: 700; color: #667eea; margin-bottom: 6px; }
.footer { text-align: center; color: #999; font-size: 12px; padding: 20px 0; }
.status-bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.stat-item { font-size: 13px; color: #666; }
.stat-item strong { color: #333; }
.summary-bar { background: #fff; border-radius: 12px; padding: 20px 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.summary-grid { display: flex; gap: 24px; flex-wrap: wrap; }
.summary-item { text-align: center; }
.summary-item .num { font-size: 28px; font-weight: 700; }
.summary-item .label { font-size: 13px; color: #999; margin-top: 2px; }
.btn-copy-wrong { background: #ff4d4f; color: #fff; }
.btn-copy-wrong:hover { background: #e04343; transform: translateY(-1px); }
.wrong-list { margin-top: 14px; padding: 14px 18px; background: #fff2f0; border: 1px solid #ffccc7; border-radius: 8px; display: none; }
.wrong-list.show { display: block; }
.wrong-list .wl-title { font-weight: 600; color: #ff4d4f; margin-bottom: 6px; font-size: 15px; }
.wrong-list .wl-nums { font-size: 14px; line-height: 1.8; color: #333; }
	.wrong-list .wl-nums span { display: inline-block; padding: 2px 10px; margin: 3px 4px; background: #fff1f0; border: 1px solid #ffa39e; border-radius: 4px; font-size: 13px; font-weight: 600; color: #cf1322; }
	.copy-area { margin-top: 14px; }
	.copy-area textarea { width:100%; height:140px; font-size:13px; font-family:"Courier New",monospace; padding:10px; border:1px solid #d9d9d9; border-radius:6px; background:#fafafa; resize:vertical; box-sizing:border-box; }
	.copy-area .copy-btn { margin-top:6px; padding:6px 20px; background:#667eea; color:#fff; border:none; border-radius:6px; font-size:13px; cursor:pointer; }
	.copy-area .copy-btn:hover { background:#5a6fd6; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
.question-card { animation: fadeIn 0.3s ease; }
</style>

<script>
const QUESTIONS = [{"id": 2076, "index": 1, "type": "multiple", "stem": "我国居民的传统膳食结构特点是（ ）。", "options": {"A": "以植物性食物为主", "B": "谷类、薯类和蔬菜的摄入量较低", "C": "肉类的摄入量较高", "D": "豆类制品摄入总量不高且随地区而不同", "E": "奶类摄入量在大多数地区都不高"}, "answer": ["A", "D", "E"], "explanation": "正确答案：A、D、E。选项解析：A.以植物性食物为主；B.谷类、薯类和蔬菜的摄入量较低；C.肉类的摄入量较高；D.豆类制品摄入总量不高且随地区而不同；E.奶类摄入量在大多数地区都不高。建议查阅教材相应章节巩固知识。", "module": "人群营养", "is_single": false}, {"id": 1395, "index": 2, "type": "multiple", "stem": "科普文章的准确性包括（ ）。", "options": {"A": "事实要准", "B": "概念要准", "C": "数据要准", "D": "字数要准", "E": "语言要准"}, "answer": ["A", "B", "C", "E"], "explanation": "科普文章需准确传递知识信息，事实、概念、数据、语言准确都至关重要，而字数并非衡量科 普文章准确性的关键因素。答案：ABCE", "module": "人群营养", "is_single": false}, {"id": 1636, "index": 3, "type": "multiple", "stem": "常见慢性病的中间危险因素是（ ）", "options": {"A": "肥胖", "B": "性别", "C": "高血压", "D": "高血糖", "E": "高血脂"}, "answer": ["A", "C", "D", "E"], "explanation": "正确答案：A、C、D、E。选项解析：A.肥胖；B.性别；C.高血压；D.高血糖；E.高血脂。建议查阅教材相应章节巩固知识。", "module": "人群营养", "is_single": false}, {"id": 2834, "index": 4, "type": "multiple", "stem": "面粉的同类食物为（ ）。", "options": {"A": "小米", "B": "鱼", "C": "干粉丝", "D": "豆腐丝", "E": "豆腐"}, "answer": ["A", "C"], "explanation": "答案：AC面粉属于谷类制品，同类食物主要包括其他谷物及其制品。小米是谷物，干粉丝多由 谷物加工而成，所以面粉的同类食物为小米和干粉丝。鱼属于肉类，豆腐丝和豆腐属于豆制品类，均不属于 面粉同类。", "module": "人群营养", "is_single": false}, {"id": 1618, "index": 5, "type": "multiple", "stem": "营养咨询和营养教育的共同点是（ ）。", "options": {"A": "营养信息交流", "B": "知识提高", "C": "态度改变", "D": "行为改变", "E": "沟通技巧"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "正确答案：A、B、C、D、E。选项解析：A.营养信息交流；B.知识提高；C.态度改变；D.行为改变；E.沟通技巧。建议查阅教材相应章节巩固知识。", "module": "人群营养", "is_single": false}, {"id": 2835, "index": 6, "type": "multiple", "stem": "下面说法正确的有（ ）。", "options": {"A": "铬是葡萄糖耐量因子的重要组成成分", "B": "硒是谷胱甘肽转移酶的组成成分", "C": "人乳中钙、磷比例约为1∶1.5", "D": "锌参与蛋白质合成", "E": "缺硒是发生克山病的重要原因之一"}, "answer": ["A", "C", "D", "E"], "explanation": "正确答案：A、C、D、E。选项解析：A.铬是葡萄糖耐量因子的重要组成成分；B.硒是谷胱甘肽转移酶的组成成分；C.人乳中钙、磷比例约为1∶1.5；D.锌参与蛋白质合成；E.缺硒是发生克山病的重要原因之一。建议查阅教材相应章节巩固知识。", "module": "人群营养", "is_single": false}, {"id": 4470, "index": 7, "type": "single", "stem": "关于高温环境中人群的营养。高温环境下，人员蛋白质供给量应占总能量的", "options": {"A": "8%～10%", "B": "10%～15%", "C": "16%～20%", "D": "21%～25%"}, "answer": "B", "explanation": "&lt;&lt;营养与食品卫生学&gt;&gt;第9版P153。当环境温度超过25℃时，环境温度每升高1℃，能量摄入应比一般人群增加0.5%，碳水化合物供能占总能量的55%~65%，脂肪占总能量的20%~30%，蛋白质推荐摄入量为72~79g/d，适量多吃鱼虾、蛋、奶、大豆和瘦肉等优质蛋白质食物。建议每日奶类摄入不低于300g，每日摄入相当于50g大豆的豆制品。", "module": "人群营养", "is_single": true}, {"id": 4502, "index": 8, "type": "single", "stem": "航天作业对人体的影响不包括", "options": {"A": "肌肉萎缩", "B": "肾结石", "C": "体重增加", "D": "航天贫血"}, "answer": "C", "explanation": "《中国营养科学全书》等2版P1200。无论是几天的短期航天还是几个月直至一年以上的长期航天，绝大多数航天员都出现体重减轻的现象。", "module": "人群营养", "is_single": true}, {"id": 4407, "index": 9, "type": "single", "stem": "下列不符合运动员膳食指南的是", "options": {"A": "提高脂肪摄入", "B": "多吃水果、蔬菜", "C": "每天喝牛奶或酸奶", "D": "重视补液和补糖"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P151。脂肪的比例一般应占总能量的25%～30%。", "module": "人群营养", "is_single": true}, {"id": 4329, "index": 10, "type": "single", "stem": "妊娠期妇女血容量发生变化，容易出现", "options": {"A": "生理性贫血", "B": "缺铁性贫血", "C": "巨幼红细胞性贫血", "D": "混合型贫血"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P132。与非妊娠妇女相比，血浆容积增加约为45%~50%, 红细胞数量增加约为15%~20%, 使血液相对稀释，容易导致生理性贫血。", "module": "人群营养", "is_single": true}, {"id": 4430, "index": 11, "type": "single", "stem": "职业接触铅的人群蛋白质的供给量占总能量的", "options": {"A": "5%～10%", "B": "14%～15%", "C": "20%～25%", "D": "25%～30%"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P157。职业接触铅的人员应保证足够的优质蛋白质的摄入，蛋白质供能占总能量的15%左右。", "module": "人群营养", "is_single": true}, {"id": 4458, "index": 12, "type": "single", "stem": "下列不符合高温环境人员的膳食需要的是", "options": {"A": "满足产能营养素的需要", "B": "补充水分", "C": "补充矿物质", "D": "降低能量摄入"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P153。环境温度超过30℃时，机体的能量消耗增加的趋势明显，机体大量排汗散热，水和矿物质丢失十分严重。由于高温环境中能量消耗增加，能量代谢相关的维生素B1、维生素B2和烟酸等需要相应增加。同时，由于水溶性维生素随汗液流失增加，可造成这些维生素过多的损失。", "module": "人群营养", "is_single": true}, {"id": 4431, "index": 13, "type": "single", "stem": "妇女在妊娠期间的膳食原则，错误的是", "options": {"A": "补充叶酸，常吃含铁丰富的食物，选用碘盐", "B": "增加脂肪的摄入量", "C": "适量身体活动", "D": "维持妊娠期适宜增重"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P134。妊娠期妇女血脂较平时升高，所以脂肪摄入总量不宜过多。中国营养学会推荐妊娠期膳食脂肪的供能比为20%～30%。", "module": "人群营养", "is_single": true}, {"id": 4402, "index": 14, "type": "single", "stem": "下列符合婴儿生长发育特点的是", "options": {"A": "从出生至1周岁为新生儿期", "B": "婴儿短期内营养不良会影响其身长", "C": "婴儿出生时平均身长为50cm", "D": "1周岁时体重可达出生时的1.5倍"}, "answer": "C", "explanation": "《中国营养科学全书》P1079。新生儿为出生后到满28天的婴儿，故A错误；身长为长期营养不良的判断指标，故B错误；足月新生儿平均身长为50cm，故C正确；1周岁时体重可达出生时的3倍，故D错误。", "module": "人群营养", "is_single": true}, {"id": 4454, "index": 15, "type": "single", "stem": "某老年人全日应摄入总能量1800kcal，则其每日可食用脂肪不宜超过", "options": {"A": "60g", "B": "80g", "C": "70g", "D": "50g"}, "answer": "A", "explanation": "《中国营养科学全书》第2版P1177。老年人膳食中总脂肪量不宜过高，由脂肪提供的能量应占总能量的30%以下（20%～30%）。", "module": "人群营养", "is_single": true}, {"id": 4401, "index": 16, "type": "single", "stem": "乳母营养需要的特点是", "options": {"A": "要保证乳汁的正常分泌并维持乳汁质量的恒定", "B": "要保证乳汁的最大分泌", "C": "要保证乳汁本身的能量", "D": "要保证乳汁中蛋白质的含量恒定"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P142。良好的乳母营养需要是为保证乳汁正常分泌及维持乳汁质量相对恒定。", "module": "人群营养", "is_single": true}, {"id": 4391, "index": 17, "type": "single", "stem": "下列不属于老年人体成分改变的是", "options": {"A": "体内脂肪组织逐渐减少", "B": "脂肪在体内储存部位的分布呈现一种向心性分布的趋势", "C": "细胞数量减少，肌肉组织的重量减而出现肌肉萎缩", "D": "体水分减少，主要为细胞内液减少"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P145。随着年龄的增长，人体瘦组织逐渐减少，老年人脂肪组织相对增加。", "module": "人群营养", "is_single": true}, {"id": 4447, "index": 18, "type": "single", "stem": "老年人饮食安排不合理的是", "options": {"A": "多食用家鸡，少食用肉鸡", "B": "粮食可多吃", "C": "多食用海鱼", "D": "每日或隔日食用一个鸡蛋"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P146。禽类中肉鸡脂肪多，不如家鸡。禽肉蛋白质含量较多而脂肪较少，且细嫩易于消化，比畜肉更适合老年人食用。粮食不可多食用，以防止能量超过所需。海鱼中有EPA和DHA，对防治高脂血症和动脉粥样硬化有一定作用。蛋类含有多种营养素，为优质蛋白，但蛋黄内胆固醇含量高，因此，老年人以每日或隔日食用一个鸡蛋为宜。", "module": "人群营养", "is_single": true}, {"id": 4494, "index": 19, "type": "single", "stem": "下列有关航天员的营养需要，说法错误的是", "options": {"A": "应该供给航天员高蛋白质膳食", "B": "膳食脂肪推荐供能以占总能量的30%为宜", "C": "碳水化合物摄入措应占总能量的50%左右，并应该由复杂碳水化合物的食物提供", "D": "为了增强骨矿物质的保留应对食物进行维生素D强化"}, "answer": "A", "explanation": "《中国营养科学全书》第2版P1202。高蛋白质摄入会增加钙的丢失，故不提倡给航天员高蛋白膳食；因为航天飞行时机体红细胞生成作用下降，血清铁蛋白浓度升高，故应禁止补铁。", "module": "人群营养", "is_single": true}, {"id": 4377, "index": 20, "type": "single", "stem": "对于婴幼儿的营养需要叙述正确的包括①婴幼儿时期要维持能量摄入与消耗的正平衡②婴儿对脂肪和必需氨基酸的需要量高于成人③母乳喂养的婴儿在1岁后体内储存的锌逐渐消耗④蔗糖是1岁以内婴儿的主要能量来源⑤能量摄入长期不足，可使生长迟缓或停滞", "options": {"A": "①②③", "B": "①②④", "C": "①②⑤", "D": "②④⑤"}, "answer": "C", "explanation": "《营养与食品卫生学》第8版P179。①正确。婴幼儿的营养需要婴幼儿的能量需要除了包括基础代谢、活动、食物的特殊动力作用和排泄耗能外，还包括快速生长发育所需的能量储存，维持能量摄入与消耗的正平衡是婴幼儿健康成长的基础。②正确。 由于生长发育的需要，婴儿对必需氨基酸的平均需要量按每公斤体重计算高于成人，婴儿对脂肪的需要量按每公斤体重计算高于成人。③错误。母乳喂养的婴儿在4~5个月后体内储存的锌逐渐消耗，也需要从膳食中补充。④错误。 1岁以内的婴儿，尤其0~6月龄的婴儿，乳糖是其主要的能量来源，适合婴儿的胃肠道的消化吸收能力。⑤正确。能量摄入长期不足，可使生长迟缓或停滞；而能量摄入过多可导致肥胖。", "module": "人群营养", "is_single": true}, {"id": 4424, "index": 21, "type": "single", "stem": "职业接触有毒有害物质种类繁多，不包括", "options": {"A": "四氯化碳", "B": "煤尘", "C": "塑料", "D": "苯胺"}, "answer": "C", "explanation": "本题主要考查职业接触物质。塑料不属于职业接触有害物质。", "module": "人群营养", "is_single": true}, {"id": 4408, "index": 22, "type": "single", "stem": "低温环境中产能营养素利用的特点包括①碳水化合物优先利用为主②蛋白质优先利用为主③脂肪优先利用为主④机体组织摄取与利用脂肪速率增加⑤碳水化合物和脂肪利用均增加", "options": {"A": "②③④", "B": "③④⑤", "C": "①④⑤", "D": "①③④"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P154。低温环境下，碳水化合物和脂肪的利用均增加，但以碳水化合物优先利用产热为主。", "module": "人群营养", "is_single": true}, {"id": 4426, "index": 23, "type": "single", "stem": "妊娠期妇女吸收没有增多的营养素是", "options": {"A": "蛋白质", "B": "维生素B12", "C": "铁", "D": "钙"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P133，《中国营养科学全书》第2版P1043孕期胃肠道活动减弱，消化液分泌减少，胃排空及食物在肠道中停留的时间延长，使营养素在肠道的吸收增加。第8版教材P171“妊娠期妇女食物在胃肠中停留时间延长，可以使维生素B2、铁、钙、叶酸的吸收增多。”孕期钙、铁吸收率增加；维生素B12依赖内因子在回肠末端吸收，停留时间延长促进其吸收；孕期蛋白质需求增加，吸收不受影响。", "module": "人群营养", "is_single": true}, {"id": 4365, "index": 24, "type": "single", "stem": "妊娠期应补充一定量的动物肝、血、痩肉等食物，必要时可在医生指导下加服铁剂，其原因包括①母体血浆容积减少②母体常有生理性贫血③母体需储备铁④胎儿需储备铁⑤预防神经管畸形", "options": {"A": "②③④", "B": "③④⑤", "C": "②③⑤", "D": "②④⑤"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P134。妊娠期对铁的需要量显著增加： ①由于妊娠期母体生理性贫血，需额外补充铁 ②母体还要储存相当数量的铁，以补偿分娩时由于失血造成铁的损失 ③胎儿肝脏内也需要储存一部分铁，以供出生后6个月之内婴儿对铁的需要。", "module": "人群营养", "is_single": true}, {"id": 4459, "index": 25, "type": "single", "stem": "以下碳水化合物防辐射效果较好的是", "options": {"A": "葡萄糖和果糖", "B": "蔗糖", "C": "直链淀粉", "D": "支链淀粉"}, "answer": "A", "explanation": "《中国营养科学全书》第2版P1220。果糖和葡萄糖对辐射防护作用较好，果糖又比葡萄糖更佳。", "module": "人群营养", "is_single": true}, {"id": 4372, "index": 26, "type": "single", "stem": "孕妇易出现生理性贫血，主要因为", "options": {"A": "血液被稀释", "B": "红细胞数量减少", "C": "缺铁", "D": "营养不良"}, "answer": "A", "explanation": "从孕妇的生理变化看，由于血容量扩大，血浆容积增长较快，容积增加约为45%～50%；红细胞数量增加较慢，增加约为15%～20%，使血液相对稀释，而容易导致生理性贫血。", "module": "人群营养", "is_single": true}, {"id": 4345, "index": 27, "type": "single", "stem": "妊娠期间严重缺乏可导致孕妇营养不良性水肿的是", "options": {"A": "钙", "B": "碘", "C": "维生素B1", "D": "维生素C"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P135。妊娠期营养对母体和胎儿的影响 营养不良性水肿：妊娠期蛋白质严重摄入不足可致营养不良性水肿。蛋白质缺乏轻者仅出现下肢水肿，严重者可出现全身水肿。此外，维生素B1严重缺乏者亦可引起水肿。", "module": "人群营养", "is_single": true}, {"id": 4433, "index": 28, "type": "single", "stem": "《中国居民膳食指南（2022）》建议孕晚期每日膳食应增加蛋白质摄入量为", "options": {"A": "0g", "B": "15g", "C": "20g", "D": "30g"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P134。孕期孕妇对蛋白质的需要量增加，以满足母体、胎盘和胎儿生长的需要。孕妇蛋白质推荐摄入量为：妊振早期不增加，妊娠中期和妊娠晚期分别增加15g/d和30g/d。", "module": "人群营养", "is_single": true}, {"id": 4436, "index": 29, "type": "single", "stem": "产褥期膳食在富含优质蛋白质的基础上，还要适最补充", "options": {"A": "碳水化合物和维生素", "B": "脂肪和铁", "C": "脂肪和维生素", "D": "维生素和铁"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P137、P138。产褥期指分挽后到除乳房外全身器官恢复正常的这段时间，这一时期饮食应该是平衡膳食，还应该适当补充维生素和铁。", "module": "人群营养", "is_single": true}, {"id": 4496, "index": 30, "type": "single", "stem": "夜间飞行人员尤其应注意补充的维生素是", "options": {"A": "维生素C", "B": "维生素K", "C": "维生素D", "D": "维生素A"}, "answer": "D", "explanation": "《中国营养科学全书》第2版P1209。维生素A缺乏可导致暗适应能力下降，严重的可导致夜盲症。", "module": "人群营养", "is_single": true}, {"id": 6144, "index": 31, "type": "single", "stem": "肝内糖酵解的主要功能是", "options": {"A": "产生乳酸", "B": " ，有利于重吸收Na+。小管液中的K+在远端小管和集合管可被重吸收,也能分泌K+,并受多种因素的调节而改变其重吸收和分泌的量。远端小管和集合管上皮细胞内的K+浓度较高，顶端膜对K+有通透性，K+可顺化学梯度通过肾脏钾通道进入小管液（即K+的分泌）。这是因为基底侧膜中的钠泵在泵出Na+的同时，将K+泵入细胞，形成细胞内高K+的缘故。另一方面，由于远端小管和集合管重吸收Na+,造成小管液呈负电位，也为K+向小管液中扩散提供电位梯度。肾脏对K+的排出量主要取决于远端小管和集合管上皮细胞K+的分泌量。选项D中，分泌K+有利于排K+而非H+。", "module": "尿的生成和排出", "is_single": true}, {"id": 5786, "index": 44, "type": "single", "stem": "醛固酮作用的主要节段", "options": {"A": "血浆清除率为零", "B": "血浆清除率等于GFR", "C": "血浆清除率大于GFR(125ml/min)", "D": "血浆清除率小于GFR"}, "answer": "D", "explanation": "暂无解析", "module": "尿的生成和排出", "is_single": true}, {"id": 5368, "index": 45, "type": "single", "stem": "炎性病灶的水肿是由于", "options": {"A": "血浆胶体渗透压降低", "B": "毛细血管内流体静压升高", "C": "毛细血管壁通透性增高", "D": "淋巴回流受阻"}, "answer": "C", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 5519, "index": 46, "type": "single", "stem": "胃期胃液分泌的调节描述,错误的是", "options": {"A": "扩张刺激胃底胃体,通过迷走-迷走长反射", "B": "扩张刺激胃底胃体,通过壁内神经丛短反射", "C": "蛋白质消化产物引起促胃液素释放", "D": "盐酸进入小肠引起促胃液素释放"}, "answer": "D", "explanation": "《生理学》第9版P187。盐酸进入小肠不属于胃期胃液分泌的部分。故选D。", "module": "消化系统", "is_single": true}, {"id": 5354, "index": 47, "type": "single", "stem": "【技师不做】心肌不产生强直收缩的原因是", "options": {"A": "心脏是功能上的合胞体", "B": "心肌肌浆网不发达,Ca2+储存少", "C": "心肌有自律性,会自动节律性收缩", "D": "心肌的有效不应期长"}, "answer": "D", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 3433, "index": 48, "type": "multiple", "stem": "一位注册营养师为严格素食者提供蛋白质营养咨询。以下哪些食物组合能够有效实现蛋白质互补作用，使混合蛋白质的氨基酸模式趋于全面？（选全部适用的）", "options": {"A": "糙米 + 黑豆", "B": "玉米饼 + 菜豆", "C": "大豆分离蛋白 + 藜麦", "D": "全麦面包 + 花生酱", "E": "全蛋 + 米饭"}, "answer": ["A", "B", "D"], "explanation": "蛋白质互补作用指将两种或以上不完全蛋白质搭配，使其氨基酸互相补充，接近完全蛋白质模式。A√谷物（缺赖氨酸）+豆类（富赖氨酸）是经典互补组合；B√玉米（缺赖氨酸）+大/菜豆（富赖氨酸）同样实现互补；D√全麦（缺赖氨酸）+花生（豆类，富赖氨酸），同时全麦提供花生相对缺乏的蛋氨酸，实现完全互补。**记忆点**：口诀「谷豆搭配，蛋白到位」——谷物与豆类是最佳互补CP。C✗大豆分离蛋白已是完全蛋白质，藜麦也是优质蛋白，两者搭配并非「互补」的必要场景；E✗全蛋已是完全蛋白质，与米饭搭配虽能提供全面氨基酸，但不属于「不完全蛋白质之间的互补作用」范畴——该选项是混淆完全蛋白与互补概念的常见陷阱。", "module": "基础营养", "is_single": false}, {"id": 49, "index": 49, "type": "multiple", "stem": "下列属于植物化学物分类及功能的有？", "options": {"A": "多酚类(如茶多酚、原花青素)具有抗氧化作用", "B": "类胡萝卜素(如番茄红素、叶黄素)具有抗氧化和光保护作用", "C": "植物固醇可降低胆固醇吸收，其作用机制与抑制脂肪酶活性有关", "D": "硫苷类(如十字花科蔬菜中的芥子油苷)具有抗癌潜力", "E": "植物化学物属于必需营养素，缺乏会引致缺乏症"}, "answer": ["A", "B", "D"], "explanation": "**考点定位**：植物化学物的分类及功能。属RD考试基础营养中非营养素生物活性物质的核心考点。\n**解题思路**：逐一判断——A（多酚类抗氧化）正确；B（类胡萝卜素抗氧化/光保护）正确；D（硫苷类抗癌）正确。\n不选C：植物固醇降胆固醇机制是与胆固醇竞争混合胶束（减少吸收），非抑制脂肪酶。不选E：植物化学物不属于必需营养素——缺乏不会致病，但\"非必需而有益\"。\n**易错点**：C选项的\"抑制脂肪酶\"是常见陷阱（那是奥利司他的机制）。植物固醇的机制是\"竞争性抑制吸收\"。\n**记忆点**：植物化学物不是营养素但有益——多酚（抗氧化）、类胡萝卜素（抗氧化/光保护）、植物固醇（竞争降胆固醇）、硫苷类（抗癌）。\n（教材回扣：《营养与食品卫生学》第2章·植物化学物概述）", "module": "基础营养", "is_single": false}, {"id": 5232, "index": 50, "type": "single", "stem": "血浆胶体渗透压主要决定于", "options": {"A": "红细胞数量", "B": "血浆总蛋白含量", "C": "血浆球蛋白含量", "D": "血浆白蛋白含量"}, "answer": "D", "explanation": "《生理学》第9版P59。由蛋白质所形成的渗透压称为胶体渗透压。由于白蛋白的分子量小，其分子数量远多于其他血浆蛋白，故血浆胶体渗透压的75%～80%来自白蛋白。", "module": "血液", "is_single": true}];
const userAnswers = {};

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const isSingle = q.is_single;
    const optionsHtml = Object.entries(q.options).map(([key, val]) =>
      `<div class="option ${isSingle?'option-single':'option-multi'}" data-q="${i}" data-key="${key}" onclick="selectOption(${i},'${key}',${isSingle})"><span class="option-key">${key}.</span><span>${val}</span></div>`
    ).join('');

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `qcard-${i}`;
    card.innerHTML = `
      <div class="q-header">
        <span class="q-number">#${i+1} <span style="font-weight:400;color:#999;font-size:13px">/ ${QUESTIONS.length}</span></span>
        <span><span class="q-type">${isSingle?'单选题':'多选题'}</span><span class="q-module">${q.module}</span></span>
      </div>
      <div class="q-stem">${q.stem}</div>
      <div class="options">${optionsHtml}</div>
      <div class="exp-toggle"><button id="expBtn-${i}" onclick="toggleExp(${i})" style="background:none;border:1px solid #d0d0d0;border-radius:6px;padding:4px 14px;font-size:13px;cursor:pointer;color:#667eea">📖 查看解析</button></div>
      <div class="explanation-box" id="exp-${i}">
        <div class="exp-label">📖 解析</div>
        <div>${q.explanation.replace('\n','<br>')}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function selectOption(qIdx, key, isSingle) {
  const card = document.getElementById(`qcard-${qIdx}`);
  const opts = card.querySelectorAll('.option');
  if (isSingle) {
    opts.forEach(o => o.classList.remove('selected'));
    opts.forEach(o => {
      if (o.dataset.key === key) o.classList.add('selected');
    });
    userAnswers[qIdx] = [key];
  } else {
    const el = card.querySelector(`.option[data-key="${key}"]`);
    el.classList.toggle('selected');
    const selected = [...card.querySelectorAll('.option.selected')].map(o => o.dataset.key);
    userAnswers[qIdx] = selected.length > 0 ? selected : null;
  }
}

function toggleExp(qIdx) {
  const box = document.getElementById(`exp-${qIdx}`);
  const btn = document.getElementById(`expBtn-${qIdx}`);
  if (box.classList.contains('show')) {
    box.classList.remove('show');
    btn.innerHTML = '📖 查看解析';
  } else {
    box.classList.add('show');
    btn.innerHTML = '📎 收起解析';
  }
}

function submitQuiz() {
  let correct = 0, wrong = 0;
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    const opts = card.querySelectorAll('.option');
    const exp = document.getElementById(`exp-${i}`);
    const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
    const userAns = userAnswers[i] || [];
    const isCorrect = userAns.length > 0 && JSON.stringify(userAns.slice().sort()) === JSON.stringify(correctAnswer);

    opts.forEach(o => o.classList.add('disabled'));
    if (isCorrect) {
      card.classList.add('correct');
      correct++;
    } else {
      card.classList.add('wrong');
      wrong++;
    }
    // Highlight correct/incorrect options
    opts.forEach(o => {
      const k = o.dataset.key;
      const isUser = userAns.includes(k);
      const isRight = correctAnswer.includes(k);
      if (isUser && isRight) o.classList.add('correct-answer');
      else if (isUser && !isRight) o.classList.add('wrong-answer');
      else if (!isUser && isRight) o.classList.add('correct-answer');
    });
    exp.classList.add('show');
  });

  const total = QUESTIONS.length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreBadge').innerHTML = `${correct}/${total} (${pct}%)`;
  document.getElementById('scoreBadge').style.color = pct >= 70 ? '#52c41a' : pct >= 50 ? '#faad14' : '#ff4d4f';

  // Update summary
  document.getElementById('summaryTotal').textContent = total;
  document.getElementById('summaryCorrect').textContent = correct;
  document.getElementById('summaryWrong').textContent = wrong;
  document.getElementById('summaryRate').textContent = pct + '%';
  document.getElementById('summaryBar').classList.add('show');

  // Scroll to top
  window.scrollTo({top: 0, behavior: 'smooth'});

  // Show wrong list with detail
  const wrongIndices = [];
  const wrongDetails = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) {
      wrongIndices.push(i + 1);
      const userAns = userAnswers[i] || [];
      const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
      wrongDetails.push({
        idx: i + 1,
        id: q.id,
        module: q.module,
        stem: q.stem,
        userAnswer: userAns.length ? userAns.join(', ') : '（未作答）',
        correctAnswer: correctAnswer.join(', '),
      });
    }
  });
  const wrongNumsEl = document.getElementById('wrongNums');
  const detailText = document.getElementById('wrongDetailText');
  if (wrongIndices.length > 0) {
    wrongNumsEl.innerHTML = wrongIndices.map(n => `<span>#${n}</span>`).join('');
    // Build detail text for copying
    let text = '===== RD 错题报告 =====\n';
    text += '共 ' + wrongIndices.length + ' 题\n\n';
    wrongDetails.forEach((w, i) => {
      text += '--- 第' + w.idx + '题 ---\n';
      text += '题号: ' + w.idx + '  (数据库ID: ' + w.id + ')\n';
      text += '模块: ' + w.module + '\n';
      text += '题干: ' + w.stem + '\n';
      text += '你的答案: ' + w.userAnswer + '\n';
      text += '正确答案: ' + w.correctAnswer + '\n';
      text += '——————————————\n';
    });
    text += '\n请帮我分析这些错题的错因和薄弱点。';
    detailText.value = text;
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = '';
  } else {
    wrongNumsEl.innerHTML = '<span style="color:#52c41a;font-weight:600;">🎉 全部正确！</span>';
    detailText.value = '🎉 全部正确，太棒了！';
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = 'none';
  }
}

function resetQuiz() {
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    card.className = 'question-card';
    card.querySelectorAll('.option').forEach(o => {
      o.classList.remove('selected', 'correct-answer', 'wrong-answer', 'disabled');
    });
    document.getElementById(`exp-${i}`).classList.remove('show');
  });
  document.getElementById('scoreBadge').innerHTML = '待提交';
  document.getElementById('scoreBadge').style.color = '#667eea';
  document.getElementById('wrongList').classList.remove('show');
  document.getElementById('copyWrongBtn').style.display = 'none';
}

function copyWrongDetail() {
  const ta = document.getElementById('wrongDetailText');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try {
    navigator.clipboard.writeText(ta.value).then(() => {
      alert('✅ 已复制错题详情，请发给教练分析！');
    }).catch(() => {
      document.execCommand('copy');
      alert('✅ 已复制，请发给教练分析！');
    });
  } catch(e) {
    document.execCommand('copy');
    alert('✅ 已复制，请发给教练分析！');
  }
}

function copyWrongAnswers() {
  const wrongIndices = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) wrongIndices.push(i + 1);
  });
  if (wrongIndices.length === 0) {
    alert('🎉 全部正确，没有错题！');
    return;
  }
  const text = wrongIndices.join(', ');
  navigator.clipboard.writeText(text).then(() => {
    alert(`✅ 已复制错题号：${text}`);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert(`✅ 已复制错题号：${text}`);
  });
}

try {
  renderQuestions();
  document.getElementById('jsFallback').style.display = 'none';
} catch(e) {
  document.getElementById('jsFallback').innerHTML =
    '<div style="font-size:48px;margin-bottom:16px;">❌</div>' +
    '<div style="font-size:16px;color:#ff4d4f;">题目加载失败</div>' +
    '<div style="font-size:13px;margin-top:8px;color:#999;">错误: ' + e.message + '</div>' +
    '<div style="font-size:13px;margin-top:4px;color:#999;">请截屏此错误信息发给教练修复</div>';
  console.error('RD题卡渲染错误:', e);
}
</script>
<script>
(function() {
  const RD_CARD_KEY = "2026-08-05-RD每日题卡_20260805_Part1_上午50题";
  const RD_CARD_FILE = "RD每日题卡_20260805_Part1_上午50题.html";
  const RD_DATE = "2026-08-05";
  const RD_STORAGE_KEY = "rd-progress:" + RD_CARD_KEY;
  const RD_HISTORY_KEY = RD_STORAGE_KEY + ":attempted";
  function localHost() {
    const h = location.hostname;
    return location.protocol === "http:" && (h === "localhost" || h === "127.0.0.1" || /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(h));
  }
  function questionId(card, idx) {
    let index = card && card.id.indexOf('qcard-') === 0 ? Number(card.id.slice(6)) : idx;
    try { if (QUESTIONS[index]) return String(QUESTIONS[index].id); } catch (e) {}
    return String(index + 1);
  }
  function remember(card, idx) {
    const qid = questionId(card, idx);
    let history = {};
    try { history = JSON.parse(localStorage.getItem(RD_HISTORY_KEY) || '{}'); } catch (e) {}
    history[qid] = true;
    try { localStorage.setItem(RD_HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
  }
  function snapshot() {
    const attempted = {};
    let history = {};
    try { history = JSON.parse(localStorage.getItem(RD_HISTORY_KEY) || '{}'); } catch (e) {}
    Object.keys(history).forEach(qid => attempted[qid] = []);
    document.querySelectorAll('[id^="qcard-"], .q').forEach((card, idx) => {
      const selected = [...card.querySelectorAll('.option.selected, input:checked')].map(el => el.dataset?.key || el.value).filter(Boolean);
      const questionId = questionIdForCard(card, idx);
      if (selected.length) attempted[questionId] = [...new Set(selected)].sort();
    });
    return {card_key: RD_CARD_KEY, card_filename: RD_CARD_FILE, date: RD_DATE, attempted: attempted, updated_at: new Date().toISOString()};
  }
  function questionIdForCard(card, idx) { return questionId(card, idx); }
  function paint(data) {
    let el = document.getElementById('rdAutoProgress');
    if (!el) { el = document.createElement('div'); el.id = 'rdAutoProgress'; el.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:9999;background:#fff;padding:8px 12px;border-radius:8px;box-shadow:0 2px 10px #0002;font-size:13px;color:#555'; document.body.appendChild(el); }
    el.textContent = '已自动记录：' + Object.keys(data.attempted || {}).length + '题';
  }
  function apply(data) {
    const attempted = data && data.attempted || {};
    Object.entries(attempted).forEach(([qid, values]) => {
      let index = -1;
      try { index = QUESTIONS.findIndex(q => String(q.id) === String(qid)); } catch (e) {}
      const card = index >= 0 ? (document.getElementById('qcard-' + index) || document.getElementById('c' + (index + 1))) : null;
      if (!card) return;
      (values || []).forEach(key => {
        const option = card.querySelector('.option[data-key="' + key + '"], input[value="' + key + '"]');
        if (option && option.classList && option.classList.contains('option')) option.click();
        else if (option) option.checked = true;
      });
    });
    paint(data || {attempted: {}});
  }
  async function restore() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(RD_STORAGE_KEY) || 'null'); } catch (e) {}
    if (localHost()) {
      try {
        const r = await fetch(location.origin + '/api/progress?date=' + encodeURIComponent(RD_DATE) + '&card_key=' + encodeURIComponent(RD_CARD_KEY));
        if (r.ok) data = await r.json();
      } catch (e) {}
    }
    if (data) apply(data);
  }
  function save() {
    const data = snapshot();
    try { localStorage.setItem(RD_STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    paint(data);
    if (localHost()) {
      try { navigator.sendBeacon(location.origin + '/api/progress', new Blob([JSON.stringify(data)], {type:'application/json'})); } catch (e) {}
    }
  }
  function init() {
    document.addEventListener('click', e => {
      const target = e.target.closest('.option, .op, input');
      if (!target) return;
      const card = target.closest('[id^="qcard-"], .q');
      if (card) { const cards = [...document.querySelectorAll('[id^="qcard-"], .q')]; remember(card, cards.indexOf(card)); }
      setTimeout(save, 0);
    });
    document.addEventListener('change', e => {
      const card = e.target.closest('[id^="qcard-"], .q');
      if (card) { const cards = [...document.querySelectorAll('[id^="qcard-"], .q')]; remember(card, cards.indexOf(card)); }
      save();
    });
    window.addEventListener('beforeunload', save);
    restore().finally(() => setTimeout(save, 300));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script></body>
</html>
