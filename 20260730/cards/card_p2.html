<script>
const QUESTIONS = [{"id": 2082, "index": 1, "type": "multiple", "stem": "下列关于称重记账法的说法正确的是（ ）。", "options": {"A": "称重记账法适合于个人膳食营养状况调查", "B": "称重记账法必须进行进餐人数的登记", "C": "家庭每种食物实际消耗量=食物结存量+购进食物总量-剩余总量", "D": "要对进餐人的一般情况如性别、劳动强度等进行登记", "E": "调查期间不能忽略调味品消耗量的记录"}, "answer": ["B", "D", "E"], "explanation": "答案：BDE称重记账法不适合个人膳食营养状况调查，A 错误；家庭每种食物实际消耗量=食物 结存量+购进食物总量－废弃食物总量－剩余总量，C 错误。BDE 说法均正确。", "module": "人群营养", "is_single": false}, {"id": 1153, "index": 2, "type": "multiple", "stem": "良质鲜蛋手握蛋摇动或相互碰击发出的声音特点是（ ）。", "options": {"A": "嘎嘎声", "B": "空空声", "C": "碰击声音清脆", "D": "摇动无声", "E": "哑声"}, "answer": ["C", "D"], "explanation": "良质鲜蛋内部紧实，摇动时内容物稳定，不会发出声响，相互碰击声音清脆。所以答案选CD 。 其中摇动无声体现其内部状态良好，内容物无晃动产生声音；碰击声音清脆说明蛋壳等结构正常。", "module": "膳食指南", "is_single": false}, {"id": 2775, "index": 3, "type": "multiple", "stem": "（ ）缺乏可引起巨幼红细胞贫血。", "options": {"A": "烟酸", "B": "维生素B6", "C": "叶酸", "D": "维生素B12", "E": "维生素C"}, "answer": ["C", "D"], "explanation": "叶酸和维生素B12缺乏会影响DNA合成，导致巨幼红细胞贫血。而烟酸、维生素B6、维生素C缺乏 一般不引起巨幼红细胞贫血。答案：CD", "module": "食品卫生", "is_single": false}, {"id": 830, "index": 4, "type": "multiple", "stem": "胃可分为（ ）。", "options": {"A": "贲门部", "B": "胃体", "C": "胃底", "D": "幽门部", "E": "胃大弯"}, "answer": ["A", "B", "C", "D"], "explanation": "胃通常可分为贲门部、胃底、胃体和幽门部四个部分，胃大弯是胃的一个边缘结构，不属于胃 的分区。答案：ABCD", "module": "食品卫生", "is_single": false}, {"id": 2617, "index": 5, "type": "multiple", "stem": "蛋白质按营养价值可分为（ ）。", "options": {"A": "结合蛋白质", "B": "完全蛋白质", "C": "半完全蛋白质", "D": "不完全蛋白质", "E": "单纯蛋白质"}, "answer": ["B", "C", "D"], "explanation": "按营养价值分类，蛋白质分为完全蛋白质、半完全蛋白质和不完全蛋白质。结合蛋白质和单纯 蛋白质是按化学组成分类。答案：BCD", "module": "食品卫生", "is_single": false}, {"id": 1146, "index": 6, "type": "multiple", "stem": "孕期维生素D缺乏可导致母体和新生儿钙代谢紊乱，包括（ ）。", "options": {"A": "新生儿低钙血症", "B": "母体骨质软化症", "C": "婴儿牙釉质发育不良", "D": "新生儿手足搐搦", "E": "上述都不对"}, "answer": ["A", "B", "C", "D"], "explanation": "孕期维生素D缺乏，会影响钙吸收和代谢。对母体可致骨质软化症；对新生儿，钙代谢紊乱可引 发低钙血症、手足搐搦，且会影响牙釉质发育。所以ABCD选项描述的情况都可能因孕期维生素D缺乏导致。答 案：ABCD", "module": "膳食指南", "is_single": false}, {"id": 825, "index": 7, "type": "multiple", "stem": "研究证实低出生体重新生儿与成年后的（ ）发生率有关。", "options": {"A": "骨质疏松证", "B": "肾病", "C": "高血压", "D": "糖耐量异常"}, "answer": ["C", "D"], "explanation": "正确答案：C、D。选项解析：A.骨质疏松证；B.肾病；C.高血压；D.糖耐量异常。建议查阅教材相应章节巩固知识。", "module": "食品卫生", "is_single": false}, {"id": 1550, "index": 8, "type": "multiple", "stem": "问话的方式包括（ ）。", "options": {"A": "试探型问题", "B": "封闭型问题", "C": "倾向型（诱导性、暗示性）问题", "D": "开放型问题", "E": "探索型问题"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "问话方式常见的有封闭型问题，答案有明确限制；开放型问题，答案较宽泛；倾向型问题带有 诱导暗示；试探型问题用于摸索情况；探索型问题旨在深入探究。这些选项均属于问话方式。答案：ABCDE", "module": "人群营养", "is_single": false}, {"id": 489, "index": 9, "type": "multiple", "stem": "下列哪些疾病不得从事接触入口餐饮食品工作：（ ）", "options": {"A": "痢疾", "B": "伤寒", "C": "活动性肺结核", "D": "感冒"}, "answer": ["A", "B", "C"], "explanation": "痢疾、伤寒、活动性肺结核属于消化道或呼吸道传染病，易通过接触入口餐饮食品传播病原体 ，而感冒一般不属于影响从事接触入口餐饮食品工作的疾病。答案：ABC", "module": "食品卫生", "is_single": false}, {"id": 2765, "index": 10, "type": "multiple", "stem": "肉与肉制品的主要卫生问题包括（ ）。", "options": {"A": "人畜共患传染病与寄生虫病", "B": "微生物污染", "C": "亚硝酸盐", "D": "药物残留", "E": "宰前原因不明"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "肉与肉制品的卫生问题包含多方面。人畜共患传染病与寄生虫病会通过肉传播疾病；微生物污 染易导致肉类变质；亚硝酸盐可能因不当添加或环境因素存在，有健康风险；药物残留来自养殖中用药；宰 前原因不明也影响肉品质量。这些都是常见卫生问题。答案：ABCDE", "module": "食品卫生", "is_single": false}, {"id": 5919, "index": 11, "type": "single", "stem": "急性肝炎时血清中哪些酶的活性可见升高", "options": {"A": "LDH1、ALT(GPT)", "B": "LDH5、ALT(GPT)", "C": "LDHl、AST(GOT)", "D": "LDH5、AST(GOT)"}, "answer": "B", "explanation": "暂无解析", "module": "氨基酸代谢", "is_single": true}, {"id": 4155, "index": 12, "type": "single", "stem": "易引起银耳变质中毒的是", "options": {"A": "椰毒假单胞菌", "B": "葡萄球菌", "C": "副溶血性弧菌", "D": "沙门氏菌"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P389。椰毒假单胞菌为革兰氏阴性菌，在自然界分布广泛，产毒的椰毒假单胞菌检出率为1.1%，在玉米、臭米面、银耳中都能检出。", "module": "食品卫生", "is_single": true}, {"id": 4192, "index": 13, "type": "single", "stem": "每一种微生物在食品中生长繁殖都有其最低的水分活度要求,正确的选项", "options": {"A": "细菌=酵母=真菌", "B": "酵母>真菌", "C": "真菌>酵母>细菌", "D": "细菌>真菌>酵母"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P250。细菌生长所需的水分活度&gt; 0.9,酵母为&gt; 0.87,真菌为&gt; 0.8。", "module": "食品卫生", "is_single": true}, {"id": 3781, "index": 14, "type": "single", "stem": "癞皮病的临床表现为", "options": {"A": "易出血", "B": "“3D”症状", "C": "口角炎、舌炎", "D": "血管扩张症状"}, "answer": "B", "explanation": "营养与食品卫生学》第9版P87。缺乏烟酸可发生癞皮病，其主要临床表现为神经营养障碍，即以皮炎（dermatitis）、腹泻（diarrhea）、痴呆（dementia）为特征的所谓“3D”症状。", "module": "基础营养", "is_single": true}, {"id": 4012, "index": 15, "type": "single", "stem": "关于限钠(盐)膳食,说法错误的是", "options": {"A": "适用于肝硬化腹水、高血压、心力衰竭、肾脏疾病患者", "B": "分为低盐膳食、无盐食膳和低钠膳食3类", "C": "低盐膳食中忌用一切咸食,如咸菜、甜面酱以及各种荤素食罐头", "D": "为了控制钠盐的摄入,应提倡钾盐全面替代钠盐"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P184。肾功能不全、排钾障碍者不适宜使用钾盐。", "module": "临床营养", "is_single": true}, {"id": 3980, "index": 16, "type": "single", "stem": "不属于软食的食物选择的是", "options": {"A": "鱼肉", "B": "薯类", "C": "面条", "D": "芹菜"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P182-183。软食的食物选择:主食以发酵类面食为主。米饭、面条应比普食更为软烂,包子、饺子等应选择含粗纤维较少的蔬菜作为馅料。肉类应选择细嫩的瘦肉,多选用禽肉和鱼虾等,也可制作成肉丸、肉末等。多用含膳食纤维少的蔬菜,如南瓜、冬瓜、薯类等,可煮烂制成菜泥。豆制品亦可食用。不宜食用凉拌蔬菜以及含膳食纤维较多的蔬菜如芹菜、豆芽、竹笋等,不宜食用坚果类等。", "module": "临床营养", "is_single": true}, {"id": 4036, "index": 17, "type": "single", "stem": "李某为刚分娩的产妇,体质虚弱,不想吃东西。为了母子健康,产科请营养师进行会诊。该类膳食每日供应的次数为", "options": {"A": "3次", "B": "4次", "C": "5~6次", "D": "6~7次"}, "answer": "C", "explanation": "少量多餐,每天5~6餐,故正确答案为C。", "module": "临床营养", "is_single": true}, {"id": 5364, "index": 18, "type": "single", "stem": "当血液流经下列哪段血管时血压降落最大", "options": {"A": "主动脉和大动脉", "B": "小动脉和微动脉", "C": "微静脉和小静脉", "D": "大静脉和腔静脉"}, "answer": "B", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 5414, "index": 19, "type": "single", "stem": "可直接收缩冠状动脉的物质有①NE②肾上腺素分泌增多③大剂量的抗利尿激素④血管紧张素Ⅱ", "options": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "②③④"}, "answer": "C", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 5237, "index": 20, "type": "single", "stem": "心输出量是指", "options": {"A": "每分钟由左、右心室射出的血量之和", "B": "每分钟由一侧心房射出的血量", "C": "每分钟由一侧心室射出的血量", "D": "一次心跳一侧心室射出的血量"}, "answer": "C", "explanation": "《生理学》第9版P89。一侧心室每分钟射出的血液量，称为每分输出量，也称心输出量或心排出量，故此题选择C。", "module": "血液循环", "is_single": true}, {"id": 4359, "index": 21, "type": "single", "stem": "苯作业人员的膳食中应限制摄入的营养素是", "options": {"A": "优质蛋白质", "B": "脂肪", "C": "碳水化合物", "D": "铁"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P157。苯作业人员膳食营养需要 限制脂肪摄入：因苯具有强的亲脂性，膳食脂肪含量过高可促进苯在体内的吸收和蓄积，增加机体对苯的敏感性。", "module": "人群营养", "is_single": true}, {"id": 4462, "index": 22, "type": "single", "stem": "马拉松长跑运动员的饮食不应", "options": {"A": "提供充足的能量", "B": "碳水化合物占总能量的80%～90%", "C": "及时补液，预防脱水", "D": "注意钙、铁的补充"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P150~151。碳水化合物应占总能量的60%～70%。", "module": "人群营养", "is_single": true}, {"id": 4428, "index": 23, "type": "single", "stem": "关于佝偻病，说法错误的是", "options": {"A": "婴儿出生后到3岁为好发年龄", "B": "在3个月时，易发生颅骨软化", "C": "在6个月时，可发生肋骨串珠和肋骨外翻", "D": "在8个月时，可发生“O”形腿或“X”形腿"}, "answer": "D", "explanation": "《儿科学》内容，3~6个月婴儿可出现颅骨软化（压乒乓球样感觉）；6个月左右因肋骨软骨交界处膨大易形成“肋骨串珠”，严重可出现肋骨外翻；在开始学走时（约1岁后），可发生“O”形腿或“X”形腿。", "module": "人群营养", "is_single": true}, {"id": 3921, "index": 24, "type": "single", "stem": "蔬菜相对其他食物含较多的是", "options": {"A": "钙", "B": "铁", "C": "维生素A", "D": "维生素C"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P57 、P64、P78&nbsp;、P96&nbsp; 。.乳中矿物质含量丰富,富含钙、磷、钾等,是钙的良好来源;铁、磷等矿物质和维生素A、维生素D等多集中在蛋黄内,蛋是维生素A的良好来源;新鲜蔬菜水果是供给维生素C的重要来源;畜禽鱼肉类是膳食铁的良好来源。", "module": "食物营养", "is_single": true}, {"id": 3840, "index": 25, "type": "single", "stem": "以下关于INQ的说法,错误的是", "options": {"A": "INQ是常用的评价食物营养价值的指标", "B": "INQ=1,说明该食物提供营养素和提供能量能力相当", "C": "INQ>1,说明该食物营养素的供给能力高于能量", "D": "INQ<1,其营养价值高"}, "answer": "D", "explanation": "INQ&lt;1说明食物中营养素的供给少于能量的供给,长期服用此食物,可能发生该营养素不足或能量过剩,营养价值低。", "module": "食物营养", "is_single": true}, {"id": 4523, "index": 26, "type": "single", "stem": "当一个人群的某种营养素平均摄入量达到平均需要量（EAR）水平时，人群中有多少个体的需要量可以得到满足", "options": {"A": "0.5", "B": "0.7", "C": "90%", "D": "60%"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P16。当一个人群的某种营养素平均摄入量达到平均需要量水平时，人群中有半数个体的需要量可以得到满足。", "module": "公共营养", "is_single": true}, {"id": 4543, "index": 27, "type": "single", "stem": "食品营养强化中被强化的食品通常称为载体，下列适合做载体的食品是", "options": {"A": "水果", "B": "蔬菜", "C": "肉类", "D": "饮料和乳制品"}, "answer": "D", "explanation": "《中国营养科学全书》第2版上册P619-620。被强化的食品通常称为载体，常用的强化载体包括谷类及其制品、奶制品、饮料、豆制品、调味品和儿童食品。", "module": "公共营养", "is_single": true}, {"id": 4540, "index": 28, "type": "single", "stem": "以下膳食调查方法适用于有详细账目的集体单位", "options": {"A": "称重法", "B": "记账法", "C": "回顾法", "D": "化学分析法"}, "answer": "B", "explanation": "《中国营养科学全书》第2版上册P780。记账法是由调查对象或研究者称量记录一定时期内的食物消耗总量，通过查这些记录并根据同一时期进餐人数，计算每人每日各种食物的平均摄入量，所以，记账法适用于有详细账目的集体单位。", "module": "公共营养", "is_single": true}, {"id": 5516, "index": 29, "type": "single", "stem": "消化道平滑肌的自动节律性和紧张性主要依赖于", "options": {"A": "食物消化产物的刺激作用", "B": "交感神经的支配", "C": "副交感神经的支配", "D": "平滑肌本身的特性"}, "answer": "D", "explanation": "《生理学》第9版P177。消化道平滑肌具有肌组织的共同特性，如兴奋性、传导性和收缩性，这些特性的表现均有其自身的特点。", "module": "消化系统", "is_single": true}, {"id": 5591, "index": 30, "type": "single", "stem": "小肠对糖的选择性吸收,表现在各种单糖吸收速度不同,吸收最快的是", "options": {"A": "核糖", "B": "半乳糖", "C": "果糖", "D": "木糖"}, "answer": "B", "explanation": "《生理学》第9版P204。各种单糖的吸收速率有很大差别，己糖很快，戊糖很慢。在己糖中，又以半乳糖和葡萄糖吸收最快。故选B。", "module": "消化系统", "is_single": true}, {"id": 5625, "index": 31, "type": "single", "stem": "胃酸的生理作用有①激活胃蛋白酶原②使蛋白质变性③杀菌④促进小肠吸收铁和钙", "options": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "①②③④"}, "answer": "D", "explanation": "《生理学》第9版P185。胃酸的生理作用有①②③④外，还有可促进促胰液素和缩胆囊素的分泌，进而引起胰液、胆汁和小肠液的分泌。", "module": "消化系统", "is_single": true}, {"id": 6398, "index": 32, "type": "single", "stem": "仅单纯性甘油三酯水平升高(胆固醇水平正常)的高脂血症类型是", "options": {"A": "Ⅰ型", "B": "Ⅱa型", "C": "Ⅱb型", "D": "Ⅳ型"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P170。 表7-7，Ⅳ型：甘油三酯升高。", "module": "脂质代谢", "is_single": true}, {"id": 6136, "index": 33, "type": "single", "stem": "糖酵解时下列哪一个代谢物提供~P使ADP生成ATP", "options": {"A": "3-磷酸甘油醛", "B": "1,3-二磷酸甘油酸", "C": "葡糖-6-磷酸", "D": "葡糖-1-磷酸"}, "answer": "B", "explanation": "《生物化学与分子生物学》第9版P92。 糖酵解的第7步，由磷酸甘油酸激酶催化，将 const userAnswers = {};

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const isSingle = q.is_single;
    const optionsHtml = Object.entries(q.options).map(([key, val]) =>
      `<div class="option ${isSingle?'option-single':'option-multi'}" data-q="${i}" data-key="${key}" onclick="selectOption(${i},'${key}',${isSingle})"><span class="option-key">${key}.</span><span>${val}</span></div>`
    ).join('');

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `qcard-${i}`;
    card.innerHTML = `
      <div class="q-header">
        <span class="q-number">#${i+1} <span style="font-weight:400;color:#999;font-size:13px">/ ${QUESTIONS.length}</span></span>
        <span><span class="q-type">${isSingle?'单选题':'多选题'}</span><span class="q-module">${q.module}</span></span>
      </div>
      <div class="q-stem">${q.stem}</div>
      <div class="options">${optionsHtml}</div>
      <div class="exp-toggle"><button id="expBtn-${i}" onclick="toggleExp(${i})" style="background:none;border:1px solid #d0d0d0;border-radius:6px;padding:4px 14px;font-size:13px;cursor:pointer;color:#667eea">📖 查看解析</button></div>
      <div class="explanation-box" id="exp-${i}">
        <div class="exp-label">📖 解析</div>
        <div>${q.explanation.replace('\n','<br>')}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function selectOption(qIdx, key, isSingle) {
  const card = document.getElementById(`qcard-${qIdx}`);
  const opts = card.querySelectorAll('.option');
  if (isSingle) {
    opts.forEach(o => o.classList.remove('selected'));
    opts.forEach(o => {
      if (o.dataset.key === key) o.classList.add('selected');
    });
    userAnswers[qIdx] = [key];
  } else {
    const el = card.querySelector(`.option[data-key="${key}"]`);
    el.classList.toggle('selected');
    const selected = [...card.querySelectorAll('.option.selected')].map(o => o.dataset.key);
    userAnswers[qIdx] = selected.length > 0 ? selected : null;
  }
}

function toggleExp(qIdx) {
  const box = document.getElementById(`exp-${qIdx}`);
  const btn = document.getElementById(`expBtn-${qIdx}`);
  if (box.classList.contains('show')) {
    box.classList.remove('show');
    btn.innerHTML = '📖 查看解析';
  } else {
    box.classList.add('show');
    btn.innerHTML = '📎 收起解析';
  }
}

function submitQuiz() {
  let correct = 0, wrong = 0;
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    const opts = card.querySelectorAll('.option');
    const exp = document.getElementById(`exp-${i}`);
    const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
    const userAns = userAnswers[i] || [];
    const isCorrect = userAns.length > 0 && JSON.stringify(userAns.slice().sort()) === JSON.stringify(correctAnswer);

    opts.forEach(o => o.classList.add('disabled'));
    if (isCorrect) {
      card.classList.add('correct');
      correct++;
    } else {
      card.classList.add('wrong');
      wrong++;
    }
    // Highlight correct/incorrect options
    opts.forEach(o => {
      const k = o.dataset.key;
      const isUser = userAns.includes(k);
      const isRight = correctAnswer.includes(k);
      if (isUser && isRight) o.classList.add('correct-answer');
      else if (isUser && !isRight) o.classList.add('wrong-answer');
      else if (!isUser && isRight) o.classList.add('correct-answer');
    });
    exp.classList.add('show');
  });

  const total = QUESTIONS.length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreBadge').innerHTML = `${correct}/${total} (${pct}%)`;
  document.getElementById('scoreBadge').style.color = pct >= 70 ? '#52c41a' : pct >= 50 ? '#faad14' : '#ff4d4f';

  // Update summary
  document.getElementById('summaryTotal').textContent = total;
  document.getElementById('summaryCorrect').textContent = correct;
  document.getElementById('summaryWrong').textContent = wrong;
  document.getElementById('summaryRate').textContent = pct + '%';
  document.getElementById('summaryBar').classList.add('show');

  // Scroll to top
  window.scrollTo({top: 0, behavior: 'smooth'});

  // Show wrong list with detail
  const wrongIndices = [];
  const wrongDetails = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) {
      wrongIndices.push(i + 1);
      const userAns = userAnswers[i] || [];
      const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
      wrongDetails.push({
        idx: i + 1,
        id: q.id,
        module: q.module,
        stem: q.stem,
        userAnswer: userAns.length ? userAns.join(', ') : '（未作答）',
        correctAnswer: correctAnswer.join(', '),
      });
    }
  });
  const wrongNumsEl = document.getElementById('wrongNums');
  const detailText = document.getElementById('wrongDetailText');
  if (wrongIndices.length > 0) {
    wrongNumsEl.innerHTML = wrongIndices.map(n => `<span>#${n}</span>`).join('');
    // Build detail text for copying
    let text = '===== RD 错题报告 =====\n';
    text += '共 ' + wrongIndices.length + ' 题\n\n';
    wrongDetails.forEach((w, i) => {
      text += '--- 第' + w.idx + '题 ---\n';
      text += '题号: ' + w.idx + '  (数据库ID: ' + w.id + ')\n';
      text += '模块: ' + w.module + '\n';
      text += '题干: ' + w.stem + '\n';
      text += '你的答案: ' + w.userAnswer + '\n';
      text += '正确答案: ' + w.correctAnswer + '\n';
      text += '——————————————\n';
    });
    text += '\n请帮我分析这些错题的错因和薄弱点。';
    detailText.value = text;
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = '';
  } else {
    wrongNumsEl.innerHTML = '<span style="color:#52c41a;font-weight:600;">🎉 全部正确！</span>';
    detailText.value = '🎉 全部正确，太棒了！';
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = 'none';
  }
}

function resetQuiz() {
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    card.className = 'question-card';
    card.querySelectorAll('.option').forEach(o => {
      o.classList.remove('selected', 'correct-answer', 'wrong-answer', 'disabled');
    });
    document.getElementById(`exp-${i}`).classList.remove('show');
  });
  document.getElementById('scoreBadge').innerHTML = '待提交';
  document.getElementById('scoreBadge').style.color = '#667eea';
  document.getElementById('wrongList').classList.remove('show');
  document.getElementById('copyWrongBtn').style.display = 'none';
}

function copyWrongDetail() {
  const ta = document.getElementById('wrongDetailText');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try {
    navigator.clipboard.writeText(ta.value).then(() => {
      alert('✅ 已复制错题详情，请发给教练分析！');
    }).catch(() => {
      document.execCommand('copy');
      alert('✅ 已复制，请发给教练分析！');
    });
  } catch(e) {
    document.execCommand('copy');
    alert('✅ 已复制，请发给教练分析！');
  }
}

function copyWrongAnswers() {
  const wrongIndices = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) wrongIndices.push(i + 1);
  });
  if (wrongIndices.length === 0) {
    alert('🎉 全部正确，没有错题！');
    return;
  }
  const text = wrongIndices.join(', ');
  navigator.clipboard.writeText(text).then(() => {
    alert(`✅ 已复制错题号：${text}`);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert(`✅ 已复制错题号：${text}`);
  });
}

try {
  renderQuestions();
  document.getElementById('jsFallback').style.display = 'none';
} catch(e) {
  document.getElementById('jsFallback').innerHTML =
    '<div style="font-size:48px;margin-bottom:16px;">❌</div>' +
    '<div style="font-size:16px;color:#ff4d4f;">题目加载失败</div>' +
    '<div style="font-size:13px;margin-top:8px;color:#999;">错误: ' + e.message + '</div>' +
    '<div style="font-size:13px;margin-top:4px;color:#999;">请截屏此错误信息发给教练修复</div>';
  console.error('RD题卡渲染错误:', e);
}
</script>
<script>
(function() {
  const RD_CARD_KEY = "2026-07-30-RD每日题卡_20260730_Part2_晚上50题";
  const RD_CARD_FILE = "RD每日题卡_20260730_Part2_晚上50题.html";
  const RD_DATE = "2026-07-30";
  const RD_STORAGE_KEY = "rd-progress:" + RD_CARD_KEY;
  const RD_HISTORY_KEY = RD_STORAGE_KEY + ":attempted";
  function localHost() {
    const h = location.hostname;
    return location.protocol === "http:" && (h === "localhost" || h === "127.0.0.1" || /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(h));
  }
  function questionId(card, idx) {
    let index = card && card.id.indexOf('qcard-') === 0 ? Number(card.id.slice(6)) : idx;
    try { if (QUESTIONS[index]) return String(QUESTIONS[index].id); } catch (e) {}
    return String(index + 1);
  }
  function remember(card, idx) {
    const qid = questionId(card, idx);
    let history = {};
    try { history = JSON.parse(localStorage.getItem(RD_HISTORY_KEY) || '{}'); } catch (e) {}
    history[qid] = true;
    try { localStorage.setItem(RD_HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
  }
  function snapshot() {
    const attempted = {};
    let history = {};
    try { history = JSON.parse(localStorage.getItem(RD_HISTORY_KEY) || '{}'); } catch (e) {}
    Object.keys(history).forEach(qid => attempted[qid] = []);
    document.querySelectorAll('[id^="qcard-"], .q').forEach((card, idx) => {
      const selected = [...card.querySelectorAll('.option.selected, input:checked')].map(el => el.dataset?.key || el.value).filter(Boolean);
      const questionId = questionIdForCard(card, idx);
      if (selected.length) attempted[questionId] = [...new Set(selected)].sort();
    });
    return {card_key: RD_CARD_KEY, card_filename: RD_CARD_FILE, date: RD_DATE, attempted: attempted, updated_at: new Date().toISOString()};
  }
  function questionIdForCard(card, idx) { return questionId(card, idx); }
  function paint(data) {
    let el = document.getElementById('rdAutoProgress');
    if (!el) { el = document.createElement('div'); el.id = 'rdAutoProgress'; el.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:9999;background:#fff;padding:8px 12px;border-radius:8px;box-shadow:0 2px 10px #0002;font-size:13px;color:#555'; document.body.appendChild(el); }
    el.textContent = '已自动记录：' + Object.keys(data.attempted || {}).length + '题';
  }
  function apply(data) {
    const attempted = data && data.attempted || {};
    Object.entries(attempted).forEach(([qid, values]) => {
      let index = -1;
      try { index = QUESTIONS.findIndex(q => String(q.id) === String(qid)); } catch (e) {}
      const card = index >= 0 ? (document.getElementById('qcard-' + index) || document.getElementById('c' + (index + 1))) : null;
      if (!card) return;
      (values || []).forEach(key => {
        const option = card.querySelector('.option[data-key="' + key + '"], input[value="' + key + '"]');
        if (option && option.classList && option.classList.contains('option')) option.click();
        else if (option) option.checked = true;
      });
    });
    paint(data || {attempted: {}});
  }
  async function restore() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(RD_STORAGE_KEY) || 'null'); } catch (e) {}
    if (localHost()) {
      try {
        const r = await fetch(location.origin + '/api/progress?date=' + encodeURIComponent(RD_DATE) + '&card_key=' + encodeURIComponent(RD_CARD_KEY));
        if (r.ok) data = await r.json();
      } catch (e) {}
    }
    if (data) apply(data);
  }
  function save() {
    const data = snapshot();
    try { localStorage.setItem(RD_STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    paint(data);
    if (localHost()) {
      try { navigator.sendBeacon(location.origin + '/api/progress', new Blob([JSON.stringify(data)], {type:'application/json'})); } catch (e) {}
    }
  }
  function init() {
    document.addEventListener('click', e => {
      const target = e.target.closest('.option, .op, input');
      if (!target) return;
      const card = target.closest('[id^="qcard-"], .q');
      if (card) { const cards = [...document.querySelectorAll('[id^="qcard-"], .q')]; remember(card, cards.indexOf(card)); }
      setTimeout(save, 0);
    });
    document.addEventListener('change', e => {
      const card = e.target.closest('[id^="qcard-"], .q');
      if (card) { const cards = [...document.querySelectorAll('[id^="qcard-"], .q')]; remember(card, cards.indexOf(card)); }
      save();
    });
    window.addEventListener('beforeunload', save);
    restore().finally(() => setTimeout(save, 300));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script></body>
