<script>
const QUESTIONS = [{"id": 212, "index": 1, "type": "multiple", "stem": "未经许可从事食品生产经营活动，或者未经许可生产食品添加剂的，由有关主管部门按照各自职责分工 ，没收（ ）；违法生产经营的食品、食品添加剂货值金额不足一万元的，并处二千元以上五万元以下罚款 ；货值金额一万元以上的，并处货值金额五倍以上十倍以下罚款。", "options": {"A": "违法活动场所", "B": "违法所得", "C": "违法生产经营的食品、食品添加剂", "D": "用于违法生产经营的工具、设备、原料等物品"}, "answer": ["B", "C", "D"], "explanation": "对于未经许可从事相关食品生产经营活动的处罚，通常会没收违法所得、违法生产经营的食品 及添加剂以及用于违法生产经营的工具等物品。答案：BCD 。（A选项违法活动场所一般不是没收，多是查封 等处理方式 ）", "module": "食品卫生", "is_single": false}, {"id": 706, "index": 2, "type": "multiple", "stem": "下列哪些食品属于速食食品？（ ）", "options": {"A": "小吃", "B": "快餐食品", "C": "方便食品", "D": "休闲食品", "E": "婴幼儿补充食品"}, "answer": ["B", "C", "D"], "explanation": "答案：BCD速食食品主要包括快餐食品、方便食品和休闲食品，这类食品的特点是方便快捷，可 以迅速准备和食用。小吃虽然也可以较快食用，但不属于速食食品的主要分类。婴幼儿补充食品则是针对特 定人群设计的，不属于速食食品范畴。", "module": "食品卫生", "is_single": false}, {"id": 1881, "index": 3, "type": "multiple", "stem": "以下属于专业服务营销中7P的有（ ）", "options": {"A": "产品（Product）", "B": "合同（Pact）", "C": "分销（Place）与促销（Promotion）", "D": "物理特征（PhysicalEvidence）", "E": "流程（Processes）与人员（People）"}, "answer": ["A", "C", "D", "E"], "explanation": "专业服务营销7P包括产品（Product）、价格（Price）、渠道（Place，也可称分销）、促销 （Promotion）、人员（People）、流程（Processes）、有形展示（Physical Evidence ，即物理特征 ）。 选项A、C、D、E均属于7P内容，B选项合同（Pact）不属于。答案：ACDE 。", "module": "食品卫生", "is_single": false}, {"id": 648, "index": 4, "type": "multiple", "stem": "（ ）建立有效的食品安全信息沟通机制，共同做好重大活动餐饮服务食品安全保障工作", "options": {"A": "餐饮服务食品安全监管部门", "B": "重大活动主办单位", "C": "餐饮服务从业人员", "D": "餐饮服务提供者"}, "answer": ["A", "B", "D"], "explanation": "重大活动餐饮服务食品安全保障工作需要多方协作，餐饮服务食品安全监管部门、重大活动主 办单位、餐饮服务提供者三方需建立有效的食品安全信息沟通机制，共同保障食品安全，而餐饮服务从业人 员属于餐饮服务提供者范畴内。答案：ABD", "module": "食品卫生", "is_single": false}, {"id": 1864, "index": 5, "type": "multiple", "stem": "下列关于家庭贮存食物安全指导正确的有（ ）。", "options": {"A": "食品冷藏应注意“急冻缓化”", "B": "盐腌保藏食品使用的食盐浓度应达到10%以上", "C": "吃剩的食品一定要冷藏，因冷藏能完全阻止食品的腐败变质", "D": "酸渍是指用醋酸或食醋浸泡食品，其醋酸浓度应达到1.7%以上", "E": "食品加热至60℃以上即属于热处理"}, "answer": ["A", "B", "D", "E"], "explanation": "A选项“急冻缓化”利于保持食物品质，正确；B选项盐腌浓度达10%以上可抑制微生物，正确 ；C选项冷藏不能完全阻止食品腐败变质，错误；D选项醋酸浓度达1.7%以上能一定程度保藏食品，正确；E选 项食品加热至60℃以上属热处理，正确。答案：ABDE", "module": "食品卫生", "is_single": false}, {"id": 563, "index": 6, "type": "multiple", "stem": "贫困地区，通常容易缺乏的营养素包括（ ）。", "options": {"A": "蛋白质", "B": "碳水化合物", "C": "维生素A", "D": "钙", "E": "维生素B2"}, "answer": ["A", "C", "D", "E"], "explanation": "贫困地区往往因食物资源相对匮乏，动物性食物、新鲜蔬果等摄入不足，易缺乏蛋白质、维生 素A、钙、维生素B2 等营养素。碳水化合物一般在常见主食如谷物、薯类中含量丰富，贫困地区主食相对能 保障，不易缺乏。答案：ACDE", "module": "食品卫生", "is_single": false}, {"id": 4139, "index": 7, "type": "single", "stem": "常见的食物中毒是", "options": {"A": "毒簟中毒", "B": "化学性食物中毒", "C": "植物性食物中毒", "D": "细菌性食物中毒"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P373。细菌性食物中毒在国内外都是最常见的食物中毒，发病率高，但病死率则因致病菌的不同而有较大差异。", "module": "食品卫生", "is_single": true}, {"id": 4249, "index": 8, "type": "single", "stem": "下列关于杂环胺化合物的表述,错误的是", "options": {"A": "高温烹调鱼、肉类过程中容易产生", "B": "致癌靶器官为胃", "C": "有很强的致突变性", "D": "可通过改变不良烹调方式来预防"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P283。肝脏为杂环胺化合物致癌靶器官,因此选择B。", "module": "食品卫生", "is_single": true}, {"id": 4195, "index": 9, "type": "single", "stem": "碳水化合物在高温加热时易产生的致癌物是", "options": {"A": "苯并[a]芘", "B": "丙烯酰胺", "C": "杂环胺", "D": "氯丙醇"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P286。碳水化合物在高温加热时易产生的致癌物是丙烯酰胺。", "module": "食品卫生", "is_single": true}, {"id": 4242, "index": 10, "type": "single", "stem": "可以引起脑和神经系统损伤的重金属是", "options": {"A": "汞", "B": "镉", "C": "硫", "D": "砷"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P273。大脑对汞亲和力很强，脑中汞浓度可比血液中浓度高3~6倍，采进入大脑后导致脑和神经系统损伤。", "module": "食品卫生", "is_single": true}, {"id": 4279, "index": 11, "type": "single", "stem": "食品安全标准的本质是", "options": {"A": "政策法规性", "B": "科学技术性", "C": "强制性", "D": "经济性"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P247。食品安全标准的本质是科学技术性。", "module": "食品卫生", "is_single": true}, {"id": 4251, "index": 12, "type": "single", "stem": "营养素/食物的风险-收益评估最早用于评估", "options": {"A": "禽肉类", "B": "蛋奶类", "C": "畜肉类", "D": "鱼类"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P245-246。风险-收益评估最早主要用于鱼类等风险与收益较为突出的食物,答案为D。", "module": "食品卫生", "is_single": true}, {"id": 4163, "index": 13, "type": "single", "stem": "以下引起食物中毒因素中可留下后遗症的是", "options": {"A": "霉变甘蔗", "B": "四季豆", "C": "赤霉病麦", "D": "肉毒毒素"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P391。霉变甘蔗中毒者会留下后遗症或终身残疾,其他选项引起中毒一般预后良好。", "module": "食品卫生", "is_single": true}, {"id": 4191, "index": 14, "type": "single", "stem": "低温冷藏食品的主要卫生问题是", "options": {"A": "蛋白质腐败", "B": "糖酵解", "C": "脂肪酸败", "D": "霉变"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P263、P327。低温可以降低或停止微生物的增殖速度,食品中酶活力或一切化学反应也同时降低,但解脂酶需在-20℃才能基本停止活动,所以低温条件下食品的主要变化是脂肪酸败。", "module": "食品卫生", "is_single": true}, {"id": 4183, "index": 15, "type": "single", "stem": "神经精神型毒蕈中毒的特效解毒药物是", "options": {"A": "阿托品", "B": "亚甲蓝", "C": "二巯基丙磺酸钠", "D": "肾上腺皮质激素"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P395。神经精神型可以采用阿托品治疗。", "module": "食品卫生", "is_single": true}, {"id": 4149, "index": 16, "type": "single", "stem": "会出现神经损伤症状食物中毒的是", "options": {"A": "霉变甘蔗", "B": "四季豆", "C": "亚硝酸钠", "D": "葡萄球菌肠毒素"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P391。病人可死于呼吸衰竭，幸存者则留下严重的神经系统后遗症，导致终生残疾。", "module": "食品卫生", "is_single": true}, {"id": 4219, "index": 17, "type": "single", "stem": "HACCP中应用控制措施时确定的能确保消除或降低危害的技术指标是", "options": {"A": "危害分析", "B": "关键控制点", "C": "关键限值", "D": "监控程序"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P438。危害分析关键控制点(hazard analysis and critical control point,HACCP)是一种食品安全保证体系,其基本含义是,为保障食品安全,对食品生产加工过程中造成食品污染发生或发展的各种危害因素进行系统和全面的分析,确定能有效预防、减轻或消除危害的加工环节(即“关键控制点”)进而在关键控制点对危害因素进行控制,同时监测控制效果,发生偏差时予以纠正,并随时对控制方法进行矫正和补充。关键限值是指应用控制措施时确定的能确保消除或降低危害的技术指标，即区分可接受水平和不可接受水平的标准值。", "module": "食品卫生", "is_single": true}, {"id": 4176, "index": 18, "type": "single", "stem": "不易引起亚硝酸盐中毒的是", "options": {"A": "苦井水", "B": "不新鲜蔬菜", "C": "腌菜", "D": "腐竹"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P399。选项A、B、C均为常见亚硝酸盐来源,因此选D。", "module": "食品卫生", "is_single": true}, {"id": 4130, "index": 19, "type": "single", "stem": "引起沙门氏菌食物中毒的主要食物是", "options": {"A": "蔬菜、水果", "B": "豆类及豆制品", "C": "谷类", "D": "肉类、奶类及其制品"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P375。沙门氏菌污染肉类食物的概率很高，特别是在家畜中的猪、牛、马、羊、猫、犬，家禽中的鸡、鸭、鹅等。", "module": "食品卫生", "is_single": true}, {"id": 4226, "index": 20, "type": "single", "stem": "肉毒梭菌毒素食物中毒的主要症状为", "options": {"A": "剧烈呕吐", "B": "上腹部阵发性绞痛", "C": "败血症、脑膜炎", "D": "运动神经麻痹"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P385。《营养与食品卫生学》第8版P451。肉毒梭菌食物中毒以运动神经麻痹的症状为主，而胃肠道症状少见。临床特征表现为对称性脑神经受损的症状。早期表现为头痛、头晕、乏力、走路不稳，以后逐渐出现视力模糊、眼睑下垂、瞳孔散大等神经麻痹症状。 重症病人则首先表现为对光反射迟钝，逐渐发展为语言不清、吞咽困难、声音嘶哑等，严重时出现呼吸困难，常因呼吸衰竭而死亡。", "module": "食品卫生", "is_single": true}, {"id": 4328, "index": 21, "type": "single", "stem": "真菌毒素的性质包括①耐高温②无抗原性③耐低温④主要侵害实质器官⑤专一性", "options": {"A": "①②③", "B": "①②④", "C": "①②⑤", "D": "②③⑤"}, "answer": "B", "explanation": "《营养与食品卫生学》第8版P305。真菌毒素通常具有耐高温、无抗原性、主要侵害实质器官的特性。", "module": "食品卫生", "is_single": true}, {"id": 4266, "index": 22, "type": "single", "stem": "下列作为预防N-亚硝基化合物对人体健康危害的重要措施的是", "options": {"A": "防止食品霉变", "B": "减少蔬菜的摄入", "C": "减少维生素C的摄入", "D": "减少钼肥施用"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P280。预防N-亚硝基化合物污染的措施包括防止食物被微生物污染、控制食品加工中硝酸盐及亚硝酸盐用量、施用钼肥以及阻断亚硝基化反应。维生素C、维生素E以及酚类及黄酮类化合物有较强的阻断亚硝基化反应的作用。", "module": "食品卫生", "is_single": true}, {"id": 4215, "index": 23, "type": "single", "stem": "下列食品添加剂可以用于防腐的是", "options": {"A": "丁基羟基茴香醚(BHA)", "B": "亚硫酸钠", "C": "亚硫酸氢钠", "D": "苯甲酸"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P306、P312丁基羟基茴香醚(BHA)为常用抗氧化剂,亚硫酸钠和亚硫酸氢钠为漂白剂,苯甲酸为防腐剂。", "module": "食品卫生", "is_single": true}, {"id": 4137, "index": 24, "type": "single", "stem": "无论发生次数还是中毒人数,在我国占食物中毒总数第一位的是", "options": {"A": "细菌性食物中毒", "B": "有毒动植物食物中毒", "C": "化学性食物中毒", "D": "霉变食物引起的食物中毒"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P373。细菌性食物中毒在国内外都是最常见的食物中毒，发病率高，但病死率则因致病菌的不同而有较大差异。", "module": "食品卫生", "is_single": true}, {"id": 4314, "index": 25, "type": "single", "stem": "硝酸盐和亚硝酸盐对其有特殊抑制作用的细菌为?", "options": {"A": "葡萄球菌", "B": "沙门氏菌", "C": "变形杆菌", "D": "肉毒梭状芽胞杆菌"}, "answer": "D", "explanation": "《营养与食品卫生学》第8版P371。（亚）硝酸盐除对肉制品有护色作用外，还对微生物的繁殖有一定的抑制作用，特别是对肉毒梭状芽胞杆菌有特殊抑制作用。", "module": "食品卫生", "is_single": true}, {"id": 4155, "index": 26, "type": "single", "stem": "易引起银耳变质中毒的是", "options": {"A": "椰毒假单胞菌", "B": "葡萄球菌", "C": "副溶血性弧菌", "D": "沙门氏菌"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P389。椰毒假单胞菌为革兰氏阴性菌，在自然界分布广泛，产毒的椰毒假单胞菌检出率为1.1%，在玉米、臭米面、银耳中都能检出。", "module": "食品卫生", "is_single": true}, {"id": 4218, "index": 27, "type": "single", "stem": "与黄曲霉毒素直接相关的癌症是", "options": {"A": "肝癌", "B": "肾癌", "C": "大肠癌", "D": "肺癌"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P256。黄曲霉毒素可诱发多种动物的肝癌。流行病学调查也显示黄曲霉毒素摄入水平与原发性肝癌的发生呈正相关,因此正确答案为A。", "module": "食品卫生", "is_single": true}, {"id": 4302, "index": 28, "type": "single", "stem": "杂环胺致癌的主要靶器官为", "options": {"A": "肝脏", "B": "胃", "C": "组织", "D": "血管"}, "answer": "A", "explanation": "《营养与食品卫生学》第8版P339。杂环胺经口摄入后，很快吸收并通过血液分布于体内的大部分的组织，肝脏是其重要的代谢器官，肠、肺、肾等组织也有一定的代谢能力。", "module": "食品卫生", "is_single": true}, {"id": 4236, "index": 29, "type": "single", "stem": "食品腐败变质的物理鉴定指标包括", "options": {"A": "食品浸出物量,浸出液电导度", "B": "挥发性盐基总氮", "C": "三甲胺", "D": "酸价"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P261。腐败变质的物理指标包括:食品浸出物量、浸出液电导度、冰点、折光率以及黏度等。", "module": "食品卫生", "is_single": true}, {"id": 4327, "index": 30, "type": "single", "stem": "微生物污染主要包括①细菌污染②细菌毒素污染③真菌污染④真菌毒素污染⑤病毒污染", "options": {"A": "②③④⑤", "B": "①②④⑤", "C": "①②③⑤", "D": "①②③④⑤"}, "answer": "D", "explanation": "《营养与食品卫生学》第8版P301。微生物污染主要有细菌与细菌毒素、真菌与真菌毒素以及病毒等的污染。", "module": "食品卫生", "is_single": true}, {"id": 4135, "index": 31, "type": "single", "stem": "从临床表现上来看,感染型与毒素型食物中毒最大的区别在于", "options": {"A": "有无恶心、呕吐", "B": "有无腹痛、腹泻", "C": "有无体温升高", "D": "病死率不同"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P372。感染型食物中毒的临床表现多有发热症状。", "module": "食品卫生", "is_single": true}, {"id": 3842, "index": 32, "type": "single", "stem": "谷类中含有的主要矿物质是", "options": {"A": "钙", "B": "铁", "C": "锌", "D": "硒"}, "answer": "A", "explanation": "谷类中含有的矿物质主要是磷、钙。", "module": "食物营养", "is_single": true}, {"id": 5193, "index": 33, "type": "single", "stem": "血浆蛋白的主要生理功能是①多种代谢物的运输载体②维持血浆胶体渗透压③参与机体免疫 const userAnswers = {};

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const isSingle = q.is_single;
    const optionsHtml = Object.entries(q.options).map(([key, val]) =>
      `<div class="option ${isSingle?'option-single':'option-multi'}" data-q="${i}" data-key="${key}" onclick="selectOption(${i},'${key}',${isSingle})"><span class="option-key">${key}.</span><span>${val}</span></div>`
    ).join('');

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `qcard-${i}`;
    card.innerHTML = `
      <div class="q-header">
        <span class="q-number">#${i+1} <span style="font-weight:400;color:#999;font-size:13px">/ ${QUESTIONS.length}</span></span>
        <span><span class="q-type">${isSingle?'单选题':'多选题'}</span><span class="q-module">${q.module}</span></span>
      </div>
      <div class="q-stem">${q.stem}</div>
      <div class="options">${optionsHtml}</div>
      <div class="exp-toggle"><button id="expBtn-${i}" onclick="toggleExp(${i})" style="background:none;border:1px solid #d0d0d0;border-radius:6px;padding:4px 14px;font-size:13px;cursor:pointer;color:#667eea">📖 查看解析</button></div>
      <div class="explanation-box" id="exp-${i}">
        <div class="exp-label">📖 解析</div>
        <div>${q.explanation.replace('\n','<br>')}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function selectOption(qIdx, key, isSingle) {
  const card = document.getElementById(`qcard-${qIdx}`);
  const opts = card.querySelectorAll('.option');
  if (isSingle) {
    opts.forEach(o => o.classList.remove('selected'));
    opts.forEach(o => {
      if (o.dataset.key === key) o.classList.add('selected');
    });
    userAnswers[qIdx] = [key];
  } else {
    const el = card.querySelector(`.option[data-key="${key}"]`);
    el.classList.toggle('selected');
    const selected = [...card.querySelectorAll('.option.selected')].map(o => o.dataset.key);
    userAnswers[qIdx] = selected.length > 0 ? selected : null;
  }
}

function toggleExp(qIdx) {
  const box = document.getElementById(`exp-${qIdx}`);
  const btn = document.getElementById(`expBtn-${qIdx}`);
  if (box.classList.contains('show')) {
    box.classList.remove('show');
    btn.innerHTML = '📖 查看解析';
  } else {
    box.classList.add('show');
    btn.innerHTML = '📎 收起解析';
  }
}

function submitQuiz() {
  let correct = 0, wrong = 0;
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    const opts = card.querySelectorAll('.option');
    const exp = document.getElementById(`exp-${i}`);
    const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
    const userAns = userAnswers[i] || [];
    const isCorrect = userAns.length > 0 && JSON.stringify(userAns.slice().sort()) === JSON.stringify(correctAnswer);

    opts.forEach(o => o.classList.add('disabled'));
    if (isCorrect) {
      card.classList.add('correct');
      correct++;
    } else {
      card.classList.add('wrong');
      wrong++;
    }
    // Highlight correct/incorrect options
    opts.forEach(o => {
      const k = o.dataset.key;
      const isUser = userAns.includes(k);
      const isRight = correctAnswer.includes(k);
      if (isUser && isRight) o.classList.add('correct-answer');
      else if (isUser && !isRight) o.classList.add('wrong-answer');
      else if (!isUser && isRight) o.classList.add('correct-answer');
    });
    exp.classList.add('show');
  });

  const total = QUESTIONS.length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreBadge').innerHTML = `${correct}/${total} (${pct}%)`;
  document.getElementById('scoreBadge').style.color = pct >= 70 ? '#52c41a' : pct >= 50 ? '#faad14' : '#ff4d4f';

  // Update summary
  document.getElementById('summaryTotal').textContent = total;
  document.getElementById('summaryCorrect').textContent = correct;
  document.getElementById('summaryWrong').textContent = wrong;
  document.getElementById('summaryRate').textContent = pct + '%';
  document.getElementById('summaryBar').classList.add('show');

  // Scroll to top
  window.scrollTo({top: 0, behavior: 'smooth'});

  // Show wrong list with detail
  const wrongIndices = [];
  const wrongDetails = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) {
      wrongIndices.push(i + 1);
      const userAns = userAnswers[i] || [];
      const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
      wrongDetails.push({
        idx: i + 1,
        id: q.id,
        module: q.module,
        stem: q.stem,
        userAnswer: userAns.length ? userAns.join(', ') : '（未作答）',
        correctAnswer: correctAnswer.join(', '),
      });
    }
  });
  const wrongNumsEl = document.getElementById('wrongNums');
  const detailText = document.getElementById('wrongDetailText');
  if (wrongIndices.length > 0) {
    wrongNumsEl.innerHTML = wrongIndices.map(n => `<span>#${n}</span>`).join('');
    // Build detail text for copying
    let text = '===== RD 错题报告 =====\n';
    text += '共 ' + wrongIndices.length + ' 题\n\n';
    wrongDetails.forEach((w, i) => {
      text += '--- 第' + w.idx + '题 ---\n';
      text += '题号: ' + w.idx + '  (数据库ID: ' + w.id + ')\n';
      text += '模块: ' + w.module + '\n';
      text += '题干: ' + w.stem + '\n';
      text += '你的答案: ' + w.userAnswer + '\n';
      text += '正确答案: ' + w.correctAnswer + '\n';
      text += '——————————————\n';
    });
    text += '\n请帮我分析这些错题的错因和薄弱点。';
    detailText.value = text;
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = '';
  } else {
    wrongNumsEl.innerHTML = '<span style="color:#52c41a;font-weight:600;">🎉 全部正确！</span>';
    detailText.value = '🎉 全部正确，太棒了！';
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = 'none';
  }
}

function resetQuiz() {
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    card.className = 'question-card';
    card.querySelectorAll('.option').forEach(o => {
      o.classList.remove('selected', 'correct-answer', 'wrong-answer', 'disabled');
    });
    document.getElementById(`exp-${i}`).classList.remove('show');
  });
  document.getElementById('scoreBadge').innerHTML = '待提交';
  document.getElementById('scoreBadge').style.color = '#667eea';
  document.getElementById('wrongList').classList.remove('show');
  document.getElementById('copyWrongBtn').style.display = 'none';
}

function copyWrongDetail() {
  const ta = document.getElementById('wrongDetailText');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try {
    navigator.clipboard.writeText(ta.value).then(() => {
      alert('✅ 已复制错题详情，请发给教练分析！');
    }).catch(() => {
      document.execCommand('copy');
      alert('✅ 已复制，请发给教练分析！');
    });
  } catch(e) {
    document.execCommand('copy');
    alert('✅ 已复制，请发给教练分析！');
  }
}

function copyWrongAnswers() {
  const wrongIndices = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) wrongIndices.push(i + 1);
  });
  if (wrongIndices.length === 0) {
    alert('🎉 全部正确，没有错题！');
    return;
  }
  const text = wrongIndices.join(', ');
  navigator.clipboard.writeText(text).then(() => {
    alert(`✅ 已复制错题号：${text}`);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert(`✅ 已复制错题号：${text}`);
  });
}

try {
  renderQuestions();
  document.getElementById('jsFallback').style.display = 'none';
} catch(e) {
  document.getElementById('jsFallback').innerHTML =
    '<div style="font-size:48px;margin-bottom:16px;">❌</div>' +
    '<div style="font-size:16px;color:#ff4d4f;">题目加载失败</div>' +
    '<div style="font-size:13px;margin-top:8px;color:#999;">错误: ' + e.message + '</div>' +
    '<div style="font-size:13px;margin-top:4px;color:#999;">请截屏此错误信息发给教练修复</div>';
  console.error('RD题卡渲染错误:', e);
}

  function localHost() {
    const h = location.hostname;
    return location.protocol === "http:" && (h === "localhost" || h === "127.0.0.1" || /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(h));
  }
  function questionId(card, idx) {
    let index = card && card.id.indexOf('qcard-') === 0 ? Number(card.id.slice(6)) : idx;
    try { if (QUESTIONS[index]) return String(QUESTIONS[index].id); } catch (e) {}
    return String(index + 1);
  }
  function remember(card, idx) {
    const qid = questionId(card, idx);
    let history = {};
    try { history = JSON.parse(localStorage.getItem(RD_HISTORY_KEY) || '{}'); } catch (e) {}
    history[qid] = true;
    try { localStorage.setItem(RD_HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
  }
  function snapshot() {
    const attempted = {};
    let history = {};
    try { history = JSON.parse(localStorage.getItem(RD_HISTORY_KEY) || '{}'); } catch (e) {}
    Object.keys(history).forEach(qid => attempted[qid] = []);
    document.querySelectorAll('[id^="qcard-"], .q').forEach((card, idx) => {
      const selected = [...card.querySelectorAll('.option.selected, input:checked')].map(el => el.dataset?.key || el.value).filter(Boolean);
      const questionId = questionIdForCard(card, idx);
      if (selected.length) attempted[questionId] = [...new Set(selected)].sort();
    });
    return {card_key: RD_CARD_KEY, card_filename: RD_CARD_FILE, date: RD_DATE, attempted: attempted, updated_at: new Date().toISOString()};
  }
  function questionIdForCard(card, idx) { return questionId(card, idx); }
  function paint(data) {
    let el = document.getElementById('rdAutoProgress');
    if (!el) { el = document.createElement('div'); el.id = 'rdAutoProgress'; el.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:9999;background:#fff;padding:8px 12px;border-radius:8px;box-shadow:0 2px 10px #0002;font-size:13px;color:#555'; document.body.appendChild(el); }
    el.textContent = '已自动记录：' + Object.keys(data.attempted || {}).length + '题';
  }
  function apply(data) {
    const attempted = data && data.attempted || {};
    Object.entries(attempted).forEach(([qid, values]) => {
      let index = -1;
      try { index = QUESTIONS.findIndex(q => String(q.id) === String(qid)); } catch (e) {}
      const card = index >= 0 ? (document.getElementById('qcard-' + index) || document.getElementById('c' + (index + 1))) : null;
      if (!card) return;
      (values || []).forEach(key => {
        const option = card.querySelector('.option[data-key="' + key + '"], input[value="' + key + '"]');
        if (option && option.classList && option.classList.contains('option')) option.click();
        else if (option) option.checked = true;
      });
    });
    paint(data || {attempted: {}});
  }
  async function restore() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(RD_STORAGE_KEY) || 'null'); } catch (e) {}
    if (localHost()) {
      try {
        const r = await fetch(location.origin + '/api/progress?date=' + encodeURIComponent(RD_DATE) + '&card_key=' + encodeURIComponent(RD_CARD_KEY));
        if (r.ok) data = await r.json();
      } catch (e) {}
    }
    if (data) apply(data);
  }
  function save() {
    const data = snapshot();
    try { localStorage.setItem(RD_STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    paint(data);
    if (localHost()) {
      try { navigator.sendBeacon(location.origin + '/api/progress', new Blob([JSON.stringify(data)], {type:'application/json'})); } catch (e) {}
    }
  }
  function init() {
    document.addEventListener('click', e => {
      const target = e.target.closest('.option, .op, input');
      if (!target) return;
      const card = target.closest('[id^="qcard-"], .q');
      if (card) { const cards = [...document.querySelectorAll('[id^="qcard-"], .q')]; remember(card, cards.indexOf(card)); }
      setTimeout(save, 0);
    });
    document.addEventListener('change', e => {
      const card = e.target.closest('[id^="qcard-"], .q');
      if (card) { const cards = [...document.querySelectorAll('[id^="qcard-"], .q')]; remember(card, cards.indexOf(card)); }
      save();
    });
    window.addEventListener('beforeunload', save);
    restore().finally(() => setTimeout(save, 300));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script></body>
</html>
