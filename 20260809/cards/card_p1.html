<script>
const QUESTIONS = [{"id": 1637, "index": 1, "type": "multiple", "stem": "儿童膳食铁的良好来源有（ ）。", "options": {"A": "动物血", "B": "牛奶", "C": "动物肝脏", "D": "豆类", "E": "瘦肉"}, "answer": ["A", "C", "D", "E"], "explanation": "动物血、动物肝脏、瘦肉含有丰富的血红素铁，生物利用率高，是铁的良好来源；豆类也含有 一定量铁。而牛奶中铁含量低。答案：ACDE", "module": "人群营养", "is_single": false}, {"id": 710, "index": 2, "type": "multiple", "stem": "国家食品药品监督管理局负责对重大活动餐饮服务食品安全管理工作进行（ ）。", "options": {"A": "指导", "B": "协调", "C": "监督", "D": "控制"}, "answer": ["A", "B", "C"], "explanation": "正确答案：A、B、C。选项解析：A.指导；B.协调；C.监督；D.控制。建议查阅教材相应章节巩固知识。", "module": "食品卫生", "is_single": false}, {"id": 2846, "index": 3, "type": "multiple", "stem": "食品腐败变质的鉴定指标包括（ ）。", "options": {"A": "感观指标", "B": "微生物指标", "C": "化学指标", "D": "物理指标", "E": "放射性指标"}, "answer": ["A", "B", "C", "D"], "explanation": "食品腐败变质鉴定指标主要有感官、微生物、化学和物理指标。感官指标通过人的感觉器官判 断食品外观等变化；微生物指标看微生物数量等；化学指标检测食品成分分解产物；物理指标观察食品的一 些物理性质改变。放射性指标并非食品腐败变质的鉴定指标。答案：ABCD", "module": "人群营养", "is_single": false}, {"id": 569, "index": 4, "type": "multiple", "stem": "确定一周成人膳食营养需要的工作程序包括（ ）。", "options": {"A": "询问基本情况", "B": "测量身高和体重", "C": "估算体质指数（BMI）", "D": "估算能量需要量", "E": "计算产能营养素需要量"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "确定一周成人膳食营养需要，首先要了解基本情况（A），通过身高体重（B）估算BMI（C）来 判断营养状况，进而估算能量需要量（D），最后计算产能营养素需要量（E），这些都是该工作程序的步骤 。答案：ABCDE", "module": "食品卫生", "is_single": false}, {"id": 811, "index": 5, "type": "multiple", "stem": "食品安全性毒理学评价主要包括哪些阶段（ ）。", "options": {"A": "急性毒性试验", "B": "急性畸形试验", "C": "蓄积毒性、致突变和代谢试验", "D": "亚慢性毒性试验", "E": "慢性毒性试验"}, "answer": ["A", "C", "D", "E"], "explanation": "食品安全性毒理学评价通常分为四个阶段，分别为急性毒性试验、蓄积毒性、致突变和代谢试 验、亚慢性毒性试验、慢性毒性试验。急性畸形试验不属于常规食品安全性毒理学评价阶段。答案：ACDE", "module": "食品卫生", "is_single": false}, {"id": 3071, "index": 6, "type": "multiple", "stem": "与鲜乳相比，酸乳中的（ ）含量得到了提高。", "options": {"A": "游离氨基酸和肽", "B": "乳糖", "C": "乳脂肪", "D": "可溶性钙和磷", "E": "叶酸、胆碱等B族维生素"}, "answer": ["A", "D", "E"], "explanation": "正确答案：A、D、E。选项解析：A.游离氨基酸和肽；B.乳糖；C.乳脂肪；D.可溶性钙和磷；E.叶酸、胆碱等B族维生素。建议查阅教材相应章节巩固知识。", "module": "人群营养", "is_single": false}, {"id": 3610, "index": 7, "type": "single", "stem": "反映体内最近期、近期、远期功能硒水平的指标分别为", "options": {"A": "血小板、血浆、红细胞谷胱甘肽过氧化物酶活性", "B": "血小板硒、血浆硒、红细胞硒", "C": "血浆、血小板、红细胞谷胱甘肽过氧化物酶活性", "D": "血小板硒、红细胞硒、血浆硒"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P66。谷胱甘肽过氧化酶活性代表硒在体内的活性形式,所以可以作为远期功能硒指标。", "module": "基础营养", "is_single": true}, {"id": 5418, "index": 8, "type": "single", "stem": "CO2过多引起脑血管舒张的中介物是", "options": {"A": "乳酸", "B": "H+", "C": "Ach", "D": "NE"}, "answer": "B", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 4510, "index": 9, "type": "single", "stem": "对于飞行人员，糖的代谢主要改变是", "options": {"A": "有氧氧化增强", "B": "酵解作用增强", "C": "糖原合成增强", "D": "无氧酵解减弱"}, "answer": "B", "explanation": "《中国营养科学全书》第2版P1206。缺氧时糖原分解加速。", "module": "人群营养", "is_single": true}, {"id": 4345, "index": 10, "type": "single", "stem": "妊娠期间严重缺乏可导致孕妇营养不良性水肿的是", "options": {"A": "钙", "B": "碘", "C": "维生素B1", "D": "维生素C"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P135。妊娠期营养对母体和胎儿的影响 营养不良性水肿：妊娠期蛋白质严重摄入不足可致营养不良性水肿。蛋白质缺乏轻者仅出现下肢水肿，严重者可出现全身水肿。此外，维生素B1严重缺乏者亦可引起水肿。", "module": "人群营养", "is_single": true}, {"id": 4295, "index": 11, "type": "single", "stem": "为判断冷冻食品是否被人或温血动物粪便污染,可检测", "options": {"A": "大肠菌群", "B": "沙门氏菌", "C": "葡萄球菌", "D": "肠球菌"}, "answer": "D", "explanation": "《营养与食品卫生学》第8版P304。大肠菌群可以作为食品卫生质量的鉴定指标，但由于大肠菌群是嗜温菌，在5℃以下基本不能生长，所以对低温菌占优势的水产品，特别是冷冻食品未必适用。因此，近年来也有用肠球菌作为粪便污染的指示菌。", "module": "食品卫生", "is_single": true}, {"id": 4050, "index": 12, "type": "single", "stem": "下列关于肾上腺皮质功能代谢膳食的说法，错误的是", "options": {"A": "为不平衡膳食", "B": "适用于胆固醇增多症患者", "C": "多选用含钾丰富的食物", "D": "试验期内停用中药和饮茶"}, "answer": "A", "explanation": "肾上腺皮质功能代谢膳食为平衡膳食。", "module": "临床营养", "is_single": true}, {"id": 4117, "index": 13, "type": "single", "stem": "【技师不做】下列不是反流性食管炎病因的是", "options": {"A": "饮烈酒", "B": "腹内压增高", "C": "胃肠插管", "D": "胃酸分泌少"}, "answer": "D", "explanation": "本题考查的是反流性食管炎的病因,反流性食管炎的病因主要包括三方面:①食管下端括约肌功能障碍,比如饮烈酒、腹内压增高、胃肠插管等;②反流物对食管黏膜的损害;③食管对反流物清除能力减弱。", "module": "临床营养", "is_single": true}, {"id": 3812, "index": 14, "type": "single", "stem": "肉类经烹调后,含量变化不大但有利于消化吸收的营养素是", "options": {"A": "维生素A", "B": "B族维生素", "C": "维生素C", "D": "蛋白质"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P130。畜、禽、鱼等肉类的烹调方法多种多样，常用有炒、焖、蒸、炖、煮、煎炸、熏烤等。在烹调过程中，蛋白质含量变化不大，而且经烹调后，蛋白质变性更有利于消化吸收。", "module": "食物营养", "is_single": true}, {"id": 4604, "index": 15, "type": "single", "stem": "能反映长期营养状况及其造成的影响的指标是", "options": {"A": "皮褶厚度", "B": "年龄别身高", "C": "身高别体重", "D": "体质指数"}, "answer": "B", "explanation": "我国尚未系统地开展社会营养监测，根据国外的一些主张和做法将营养监测分为长期营养监测、规划效果评价性监测、及时报警和干预监测3种类型。其中，通过长期营养监测可对社会人群营养现状及其制约因素等进行动态观察、分析和预测，从而制定社会人群营养的各项政策和规划；规划效果评价性监测则是利用已制定的政策和规划，监测人群营养指标的变化；及时报警和干预监测的目的在于发现、预防和减轻重点人群的短期恶化。", "module": "公共营养", "is_single": true}, {"id": 4518, "index": 16, "type": "single", "stem": "公共营养监测的主要任务是", "options": {"A": "研究营养政策", "B": "研究人群的营养状况与发育状况", "C": "分析评价营养缺乏与营养过剩的种类、发病率、原因和发展趋势", "D": "分析社会因素和探讨能采取的社会性措施"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P170。公共营养监测的主要特点之一是营养状况信息向营养政策上反馈。它在分析营养状况与影响关系因素之后，直接研究、制订、修订和执行营养政策，研究营养政策是它的主要任务。", "module": "公共营养", "is_single": true}, {"id": 6331, "index": 17, "type": "single", "stem": "在脂肪酸β-氧化、酮体生成、酮体体用及胆固醇合成代谢中均出现的是", "options": {"A": "乙酰乙酸", "B": "β-羟丁酸", "C": "HMG-CoA", "D": "乙酰乙酸CoA"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P148-P151、P162。", "module": "脂质代谢", "is_single": true}, {"id": 6456, "index": 18, "type": "single", "stem": "发生严重肝病时", "options": {"A": "血浆渗透压升高", "B": "球蛋白含量下降", "C": "清蛋白//球蛋白比值上升", "D": "发生水肿"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P350-P351（P359-P360也有类似描述）。 急性肝炎时出现非典型的急性时相反应前清蛋白（prealbuminPAB）是肝功能损害的敏感指标。肝硬化时血浆蛋白质含量呈现特征性改变，如清蛋白减少，球蛋白增加，清蛋白/球蛋白（A/G）倒置等。 当血浆蛋白质浓度，尤其是清蛋白浓度过低时血浆胶体渗透压下降，导致水分在组织间隙潴留.出现水肿。", "module": "蛋白质的结构与功能", "is_single": true}, {"id": 6640, "index": 19, "type": "single", "stem": "下列关于核酶叙述正确的是", "options": {"A": "即核酸酶", "B": "本质是蛋白质", "C": "本质是核糖核酸", "D": "最早发现的一种酶"}, "answer": "C", "explanation": "暂无解析", "module": "酶与酶促反应", "is_single": true}, {"id": 5586, "index": 20, "type": "single", "stem": "胆囊造影时,为检查胆囊的收缩功能,让受试者进食油煎荷包蛋是为了促", "options": {"A": "胆盐的合成", "B": "胆固醇的合成", "C": "胃泌素的分泌", "D": "缩胆囊素的分泌"}, "answer": "D", "explanation": "《生理学》第9版P194。缩胆囊素一个重要作用是促进胆囊强烈收缩，引起缩胆囊素释放的因素按由强至弱的顺序为蛋白质分解产物、脂酸钠、盐酸、脂肪；糖类有刺激作用。", "module": "消化系统", "is_single": true}, {"id": 5556, "index": 21, "type": "single", "stem": "缩胆囊素能引起胰腺分泌", "options": {"A": "酶多、碳酸氢钠与水较少", "B": "酶少、碳酸氢钠与水多", "C": "酶、碳酸氢钠与水同样多", "D": "酶与碳酸氢钠均多、水少"}, "answer": "A", "explanation": "《生理学》第9版P194。缩胆囊素能够促进胰液中各种酶的分泌，还有较少的碳酸氢钠与水。故选A。", "module": "消化系统", "is_single": true}, {"id": 5439, "index": 22, "type": "single", "stem": "下列哪种因素将导致静脉血PO2降低", "options": {"A": "贫血", "B": "CO中毒", "C": "剧烈运动", "D": "亚硝酸盐中毒"}, "answer": "C", "explanation": "《生理学》第9版P166。因为贫血、CO中毒和亚硝酸盐中毒主要是Hb含量降低或Hb构型改变，使携O2量减少，血氧含量降低，对PO2影响不明显；过度通气时吸入更多新鲜空气，不导致PO2降低；而剧烈运动时，代谢明显增强，耗氧量增加，可导致静脉血PO2降低。", "module": "呼吸", "is_single": true}, {"id": 5448, "index": 23, "type": "single", "stem": "下列有关氧在血液中运输的描述,错误的是", "options": {"A": "O2主要与Hb结合运输", "B": "O2与Hb结合反应迅速可逆", "C": "O2与Hb的结合反应需要酶催化", "D": "O2与Hb结合反应受PO2影响"}, "answer": "C", "explanation": "《生理学》第9版P163。血液中所含的O298.5%以化学结合的形式运输，Hb成为有效的运输O2的载体。O2与Hb结合反应快，可逆，解离也很快，结合和解离不需酶的催化，但可受PO2影响。故答案ABC均正确，C错误。", "module": "呼吸", "is_single": true}, {"id": 5208, "index": 24, "type": "single", "stem": "患儿,女,1岁,出生后常出现全身皮肤瘀点、瘀斑现象,近一个月来多次发生鼻出血,双亲为近亲婚配,家系中均无类似出血情况。实验室检查发现,外周血血小板计数正常,出血时间延长,凝血时间正常,血小板膜表面糖蛋白Ⅱb显著降低,基因诊断证实糖蛋白Ⅱb(GPⅡb)基因错义突变。该患儿出血时间延长与血小板的哪项功能有关", "options": {"A": "黏附能力降低", "B": "聚集能力降低", "C": "释放能力降低", "D": "收缩能力降低"}, "answer": "B", "explanation": "《生理学》第9版P70。血小板与血小板之间的相互黏着，称为血小板聚集。这一过程需要纤维蛋白原、Ca2+和血小板膜上GPⅡb/Ⅲa的参与。在未受刺激的静息血小板膜上的GPⅡb/Ⅲa处于低亲和力状态，不能与纤维蛋白原结合。当血小板黏附于血管破损处或在致聚剂的激活下，GPⅡb/Ⅲa活化，与纤维蛋白原的亲和力增高，在Ca2+的作用下纤维蛋白原可与之结合，从而连接相邻的血小板，充当聚集的桥梁，使血小板聚集成团。GPⅡb/Ⅲa的异常（血小板无力症）或纤维蛋白原缺乏均可引起血小板聚集障碍。", "module": "血液", "is_single": true}, {"id": 5154, "index": 25, "type": "single", "stem": "下列关于生理止血的错误描述是", "options": {"A": "包括局部血管收缩、血小板血栓形成和血凝块", "B": "血小板与凝血块的形成有关", "C": "局部缩血管反应持续时间较短", "D": "血小板减少时,凝血时间明显延长"}, "answer": "D", "explanation": "《生理学》第9版P73。出血时间延长主要反映血小板异常和血管异常所致的止血障碍，而凝血时间延长主要反映内源性凝血途径的障碍，因此血小板减少时表现为出血时间延长。凝血因子由肝脏产生，故肝功能障碍时凝血时间延长。", "module": "血液", "is_single": true}, {"id": 5790, "index": 26, "type": "single", "stem": "某物质可自由通过滤过膜,既可重吸收,也可分泌,但分泌大于重吸收,其", "options": {"A": "血浆清除率为零", "B": "血浆清除率等于GFR", "C": "血浆清除率大于GFR(125ml/min)", "D": "血浆清除率小于GFR"}, "answer": "C", "explanation": "《生理学》第9版P251。在测定肾小球滤过率时，已知肾每分钟排出某物质（x)的量为Ux*V,如果该物质可经肾小球自由滤过而进入肾小管，并被肾小管和集合管重吸收和分泌，则Ux*V应等于每钟肾小球滤过量、重吸收量（Rx)和分泌量（Sx)代数和。每分钟内肾小球滤过的该物质的量应等于肾小球滤过率（GFR)与该物质血浆浓度（Px）的乘积，因而肾每分钟排出该物质的量，即Ux*V=GFR*Px-Rx+Sx（x物质的清除率=肾小球滤过率*x物质血浆浓度-重吸收量+分泌量）而Ux*V=Px*Cx，即Px*Cx= GFR*Px-Rx+Sx，分泌大于重吸收，即-Rx+Sx为正值，血浆清除率大于GFR。", "module": "尿的生成和排出", "is_single": true}, {"id": 5775, "index": 27, "type": "single", "stem": "某物质可自由通过滤过膜,既可重吸收,也可分泌,但重吸收大于分泌,其", "options": {"A": "血浆清除率为零", "B": "血浆清除率等于GFR", "C": "血浆清除率大于GFR(125ml/min)", "D": "血浆清除率小于GFR"}, "answer": "D", "explanation": "《生理学》第9版P251。在测定肾小球滤过率时，已知肾每分钟排出某物质（x)的量为Ux*V,如果该物质可经肾小球自由滤过而进入肾小管，并被肾小管和集合管重吸收和分泌，则Ux*V应等于每钟肾小球滤过量、重吸收量（Rx)和分泌量（Sx)代数和。每分钟内肾小球滤过的该物质的量应等于肾小球滤过率（GFR)与该物质血浆浓度（Px）的乘积，因而肾每分钟排出该物质的量，即Ux*V=GFR*Px-Rx+Sx（x物质的清除率=肾小球滤过率*x物质血浆浓度-重吸收量+分泌量）而Ux*V=Px*Cx，即Px*Cx= GFR*Px-Rx+Sx，重吸收大于分泌，即-Rx+Sx为负值，血浆清除率小于GFR。", "module": "尿的生成和排出", "is_single": true}, {"id": 6288, "index": 28, "type": "single", "stem": "体温调节的重要中枢部位是", "options": {"A": "脊髓灰质侧角", "B": "脑干网状结构", "C": "中脑中央灰质", "D": "视前区-下丘脑前部"}, "answer": "D", "explanation": "《生理学》第9版P222。自主性体温调节主要是通过反馈控制系统实现对体温的调节，维持体温的相对稳定。在这个控制系统中，下丘脑的体温调节中枢属于控制部分，由此发出的传出信息控制受控系统的活动，如驱动骨骼肌战栗产热，改变皮肤血管口径，促进汗腺分泌等，从而使机体的产热量和散热量保持平衡。", "module": "能量代谢和体温", "is_single": true}, {"id": 6255, "index": 29, "type": "single", "stem": "一名新生儿因为发生新生儿黄疸而住院接受治疗,医生给予苯巴比妥进行治疗。使用该药物的原因是", "options": {"A": "有镇静催眠作用", "B": "影响生物转化第一相反应", "C": "抑制胆红素的合成", "D": "可诱导UDP-葡糖醛酸转移酶合成"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P367。 苯巴比妥肝微粒体可诱导UDP-葡糖醛酸转移酶合成，增加机体对游离胆红素的结合转化，治疗新生儿黄疸。", "module": "肝的生物化学", "is_single": true}, {"id": 6587, const userAnswers = {};

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const isSingle = q.is_single;
    const optionsHtml = Object.entries(q.options).map(([key, val]) =>
      `<div class="option ${isSingle?'option-single':'option-multi'}" data-q="${i}" data-key="${key}" onclick="selectOption(${i},'${key}',${isSingle})"><span class="option-key">${key}.</span><span>${val}</span></div>`
    ).join('');

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `qcard-${i}`;
    card.innerHTML = `
      <div class="q-header">
        <span class="q-number">#${i+1} <span style="font-weight:400;color:#999;font-size:13px">/ ${QUESTIONS.length}</span></span>
        <span><span class="q-type">${isSingle?'单选题':'多选题'}</span><span class="q-module">${q.module}</span></span>
      </div>
      <div class="q-stem">${q.stem}</div>
      <div class="options">${optionsHtml}</div>
      <div class="exp-toggle"><button id="expBtn-${i}" onclick="toggleExp(${i})" style="background:none;border:1px solid #d0d0d0;border-radius:6px;padding:4px 14px;font-size:13px;cursor:pointer;color:#667eea">📖 查看解析</button></div>
      <div class="explanation-box" id="exp-${i}">
        <div class="exp-label">📖 解析</div>
        <div>${q.explanation.replace('\n','<br>')}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function selectOption(qIdx, key, isSingle) {
  const card = document.getElementById(`qcard-${qIdx}`);
  const opts = card.querySelectorAll('.option');
  if (isSingle) {
    opts.forEach(o => o.classList.remove('selected'));
    opts.forEach(o => {
      if (o.dataset.key === key) o.classList.add('selected');
    });
    userAnswers[qIdx] = [key];
  } else {
    const el = card.querySelector(`.option[data-key="${key}"]`);
    el.classList.toggle('selected');
    const selected = [...card.querySelectorAll('.option.selected')].map(o => o.dataset.key);
    userAnswers[qIdx] = selected.length > 0 ? selected : null;
  }
}

function toggleExp(qIdx) {
  const box = document.getElementById(`exp-${qIdx}`);
  const btn = document.getElementById(`expBtn-${qIdx}`);
  if (box.classList.contains('show')) {
    box.classList.remove('show');
    btn.innerHTML = '📖 查看解析';
  } else {
    box.classList.add('show');
    btn.innerHTML = '📎 收起解析';
  }
}

function submitQuiz() {
  let correct = 0, wrong = 0;
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    const opts = card.querySelectorAll('.option');
    const exp = document.getElementById(`exp-${i}`);
    const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
    const userAns = userAnswers[i] || [];
    const isCorrect = userAns.length > 0 && JSON.stringify(userAns.slice().sort()) === JSON.stringify(correctAnswer);

    opts.forEach(o => o.classList.add('disabled'));
    if (isCorrect) {
      card.classList.add('correct');
      correct++;
    } else {
      card.classList.add('wrong');
      wrong++;
    }
    // Highlight correct/incorrect options
    opts.forEach(o => {
      const k = o.dataset.key;
      const isUser = userAns.includes(k);
      const isRight = correctAnswer.includes(k);
      if (isUser && isRight) o.classList.add('correct-answer');
      else if (isUser && !isRight) o.classList.add('wrong-answer');
      else if (!isUser && isRight) o.classList.add('correct-answer');
    });
    exp.classList.add('show');
  });

  const total = QUESTIONS.length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreBadge').innerHTML = `${correct}/${total} (${pct}%)`;
  document.getElementById('scoreBadge').style.color = pct >= 70 ? '#52c41a' : pct >= 50 ? '#faad14' : '#ff4d4f';

  // Update summary
  document.getElementById('summaryTotal').textContent = total;
  document.getElementById('summaryCorrect').textContent = correct;
  document.getElementById('summaryWrong').textContent = wrong;
  document.getElementById('summaryRate').textContent = pct + '%';
  document.getElementById('summaryBar').classList.add('show');

  // Scroll to top
  window.scrollTo({top: 0, behavior: 'smooth'});

  // Show wrong list with detail
  const wrongIndices = [];
  const wrongDetails = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) {
      wrongIndices.push(i + 1);
      const userAns = userAnswers[i] || [];
      const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
      wrongDetails.push({
        idx: i + 1,
        id: q.id,
        module: q.module,
        stem: q.stem,
        userAnswer: userAns.length ? userAns.join(', ') : '（未作答）',
        correctAnswer: correctAnswer.join(', '),
      });
    }
  });
  const wrongNumsEl = document.getElementById('wrongNums');
  const detailText = document.getElementById('wrongDetailText');
  if (wrongIndices.length > 0) {
    wrongNumsEl.innerHTML = wrongIndices.map(n => `<span>#${n}</span>`).join('');
    // Build detail text for copying
    let text = '===== RD 错题报告 =====\n';
    text += '共 ' + wrongIndices.length + ' 题\n\n';
    wrongDetails.forEach((w, i) => {
      text += '--- 第' + w.idx + '题 ---\n';
      text += '题号: ' + w.idx + '  (数据库ID: ' + w.id + ')\n';
      text += '模块: ' + w.module + '\n';
      text += '题干: ' + w.stem + '\n';
      text += '你的答案: ' + w.userAnswer + '\n';
      text += '正确答案: ' + w.correctAnswer + '\n';
      text += '——————————————\n';
    });
    text += '\n请帮我分析这些错题的错因和薄弱点。';
    detailText.value = text;
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = '';
  } else {
    wrongNumsEl.innerHTML = '<span style="color:#52c41a;font-weight:600;">🎉 全部正确！</span>';
    detailText.value = '🎉 全部正确，太棒了！';
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = 'none';
  }
}

function resetQuiz() {
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    card.className = 'question-card';
    card.querySelectorAll('.option').forEach(o => {
      o.classList.remove('selected', 'correct-answer', 'wrong-answer', 'disabled');
    });
    document.getElementById(`exp-${i}`).classList.remove('show');
  });
  document.getElementById('scoreBadge').innerHTML = '待提交';
  document.getElementById('scoreBadge').style.color = '#667eea';
  document.getElementById('wrongList').classList.remove('show');
  document.getElementById('copyWrongBtn').style.display = 'none';
}

function copyWrongDetail() {
  const ta = document.getElementById('wrongDetailText');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try {
    navigator.clipboard.writeText(ta.value).then(() => {
      alert('✅ 已复制错题详情，请发给教练分析！');
    }).catch(() => {
      document.execCommand('copy');
      alert('✅ 已复制，请发给教练分析！');
    });
  } catch(e) {
    document.execCommand('copy');
    alert('✅ 已复制，请发给教练分析！');
  }
}

function copyWrongAnswers() {
  const wrongIndices = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) wrongIndices.push(i + 1);
  });
  if (wrongIndices.length === 0) {
    alert('🎉 全部正确，没有错题！');
    return;
  }
  const text = wrongIndices.join(', ');
  navigator.clipboard.writeText(text).then(() => {
    alert(`✅ 已复制错题号：${text}`);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert(`✅ 已复制错题号：${text}`);
  });
}

try {
  renderQuestions();
  document.getElementById('jsFallback').style.display = 'none';
} catch(e) {
  document.getElementById('jsFallback').innerHTML =
    '<div style="font-size:48px;margin-bottom:16px;">❌</div>' +
    '<div style="font-size:16px;color:#ff4d4f;">题目加载失败</div>' +
    '<div style="font-size:13px;margin-top:8px;color:#999;">错误: ' + e.message + '</div>' +
    '<div style="font-size:13px;margin-top:4px;color:#999;">请截屏此错误信息发给教练修复</div>';
  console.error('RD题卡渲染错误:', e);
}
</script>
<script>
(function() {
  const RD_CARD_KEY = "2026-08-09-RD每日题卡_20260809_Part1_上午50题";
  const RD_CARD_FILE = "RD每日题卡_20260809_Part1_上午50题.html";
  const RD_DATE = "2026-08-09";
  const RD_STORAGE_KEY = "rd-progress:" + RD_CARD_KEY;
  const RD_HISTORY_KEY = RD_STORAGE_KEY + ":attempted";
  function localHost() {
    const h = location.hostname;
    return location.protocol === "http:" && (h === "localhost" || h === "127.0.0.1" || /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(h));
  }
  function questionId(card, idx) {
    let index = card && card.id.indexOf('qcard-') === 0 ? Number(card.id.slice(6)) : idx;
    try { if (QUESTIONS[index]) return String(QUESTIONS[index].id); } catch (e) {}
    return String(index + 1);
  }
  function remember(card, idx) {
    const qid = questionId(card, idx);
    let history = {};
    try { history = JSON.parse(localStorage.getItem(RD_HISTORY_KEY) || '{}'); } catch (e) {}
    history[qid] = true;
    try { localStorage.setItem(RD_HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
  }
  function snapshot() {
    const attempted = {};
    let history = {};
    try { history = JSON.parse(localStorage.getItem(RD_HISTORY_KEY) || '{}'); } catch (e) {}
    Object.keys(history).forEach(qid => attempted[qid] = []);
    document.querySelectorAll('[id^="qcard-"], .q').forEach((card, idx) => {
      const selected = [...card.querySelectorAll('.option.selected, input:checked')].map(el => el.dataset?.key || el.value).filter(Boolean);
      const questionId = questionIdForCard(card, idx);
      if (selected.length) attempted[questionId] = [...new Set(selected)].sort();
    });
    return {card_key: RD_CARD_KEY, card_filename: RD_CARD_FILE, date: RD_DATE, attempted: attempted, updated_at: new Date().toISOString()};
  }
  function questionIdForCard(card, idx) { return questionId(card, idx); }
  function paint(data) {
    let el = document.getElementById('rdAutoProgress');
    if (!el) { el = document.createElement('div'); el.id = 'rdAutoProgress'; el.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:9999;background:#fff;padding:8px 12px;border-radius:8px;box-shadow:0 2px 10px #0002;font-size:13px;color:#555'; document.body.appendChild(el); }
    el.textContent = '已自动记录：' + Object.keys(data.attempted || {}).length + '题';
  }
  function apply(data) {
    const attempted = data && data.attempted || {};
    Object.entries(attempted).forEach(([qid, values]) => {
      let index = -1;
      try { index = QUESTIONS.findIndex(q => String(q.id) === String(qid)); } catch (e) {}
      const card = index >= 0 ? (document.getElementById('qcard-' + index) || document.getElementById('c' + (index + 1))) : null;
      if (!card) return;
      (values || []).forEach(key => {
        const option = card.querySelector('.option[data-key="' + key + '"], input[value="' + key + '"]');
        if (option && option.classList && option.classList.contains('option')) option.click();
        else if (option) option.checked = true;
      });
    });
    paint(data || {attempted: {}});
  }
  async function restore() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(RD_STORAGE_KEY) || 'null'); } catch (e) {}
    if (localHost()) {
      try {
        const r = await fetch(location.origin + '/api/progress?date=' + encodeURIComponent(RD_DATE) + '&card_key=' + encodeURIComponent(RD_CARD_KEY));
        if (r.ok) data = await r.json();
      } catch (e) {}
    }
    if (data) apply(data);
  }
  function save() {
    const data = snapshot();
    try { localStorage.setItem(RD_STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    paint(data);
    if (localHost()) {
      try { navigator.sendBeacon(location.origin + '/api/progress', new Blob([JSON.stringify(data)], {type:'application/json'})); } catch (e) {}
    }
  }
  function init() {
    document.addEventListener('click', e => {
      const target = e.target.closest('.option, .op, input');
      if (!target) return;
      const card = target.closest('[id^="qcard-"], .q');
      if (card) { const cards = [...document.querySelectorAll('[id^="qcard-"], .q')]; remember(card, cards.indexOf(card)); }
      setTimeout(save, 0);
    });
    document.addEventListener('change', e => {
      const card = e.target.closest('[id^="qcard-"], .q');
      if (card) { const cards = [...document.querySelectorAll('[id^="qcard-"], .q')]; remember(card, cards.indexOf(card)); }
      save();
    });
    window.addEventListener('beforeunload', save);
    restore().finally(() => setTimeout(save, 300));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script></body>
</html>
