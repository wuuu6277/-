<script>
const QUESTIONS = [{"id": 899, "index": 1, "type": "multiple", "stem": "蛋白质-能量营养不良的治疗原则包括（ ）。", "options": {"A": "纠正并发症", "B": "改进喂养方法", "C": "调整饮食", "D": "消除病因"}, "answer": ["A", "B", "C", "D"], "explanation": "蛋白质 - 能量营养不良治疗原则是综合的，消除病因可去除导致营养不良的根源；调整饮食能 提供合适营养；改进喂养方法有助于营养更好摄入；纠正并发症避免病情加重危及生命。这几个方面都很关 键。答案：ABCD", "module": "膳食指南", "is_single": false}, {"id": 1037, "index": 2, "type": "multiple", "stem": "下列关于婴儿体重生长的说法正确的有（ ）。", "options": {"A": "婴儿期是一生中生长发育最快的时期", "B": "后6个月体重平均增长0.5kg", "C": "前6个月体重平均增长0.6kg", "D": "前半岁体重（kg）=出生体重+月龄×0.6", "E": "后半岁体重（kg）=出生体重+月龄×0.5"}, "answer": ["A", "B", "C", "D"], "explanation": "婴儿期的确是一生中生长发育最快的时期，A正确。 婴儿前6个月体重平均每月增长约0.6kg ，C正确。 根据婴儿体重计算公式，前半岁体重（kg） = 出生体重 + 月龄×0.6 ，D正确。 后6个月体重平 均每月增长约0.5kg ，B正确。 后半岁体重（kg） = 出生体重 + 6×0.6 +（月龄 - 6）×0.5 ，E错误。答 案：ABCD", "module": "食物营养", "is_single": false}, {"id": 2023, "index": 3, "type": "multiple", "stem": "在进行食物归类计算时，（ ）需要先进行折算才能相加。", "options": {"A": "鱼虾类", "B": "谷类及其制品", "C": "蔬菜水果类", "D": "豆类及其制品", "E": "奶类及其制品"}, "answer": ["D", "E"], "explanation": "正确答案：D、E。选项解析：A.鱼虾类；B.谷类及其制品；C.蔬菜水果类；D.豆类及其制品；E.奶类及其制品。建议查阅教材相应章节巩固知识。", "module": "DRIs", "is_single": false}, {"id": 2090, "index": 4, "type": "multiple", "stem": "在进行膳食能量评价时，属于纯热能的食物有（ ）。", "options": {"A": "谷类", "B": "植物油", "C": "动物油", "D": "薯类", "E": "淀粉"}, "answer": ["B", "C", "E"], "explanation": "纯热能食物主要包括动植物油、淀粉、食用糖和酒类等，谷类和薯类除提供能量外，还含有其 他多种营养成分。答案：BCE", "module": "人群营养", "is_single": false}, {"id": 1630, "index": 5, "type": "multiple", "stem": "以下属于退行性疾的是（ ）", "options": {"A": "乙型肝炎", "B": "糖尿病", "C": "骨性关节炎", "D": "流感", "E": "大肠癌"}, "answer": ["B", "C", "E"], "explanation": "正确答案：B、C、E。选项解析：A.乙型肝炎；B.糖尿病；C.骨性关节炎；D.流感；E.大肠癌。建议查阅教材相应章节巩固知识。", "module": "人群营养", "is_single": false}, {"id": 2078, "index": 6, "type": "multiple", "stem": "尊重患者的隐私和为患者保守秘密是医疗工作中的一个重要的伦理学原则，也是医生的传统义务。然而在 有些情况下，医生可以违背保密原则。以下对保密原则的违背可以得到伦理学辩护的情况是（ ）", "options": {"A": "继续保密涉及到对公众福利的危害", "B": "继续保密会危及确定的第三方生命或重大健康风险", "C": "患者的配偶向医生询问有关患者的健康状况和预后", "D": "患者的单位向医生询问患者的病情", "E": "患者的医疗保险公司向医生询间有关患者的健康状况"}, "answer": ["A", "B"], "explanation": "当继续保密涉及对公众福利危害或危及确定第三方生命或重大健康风险时，为保护更大利益 ，违背保密原则可得到伦理学辩护。而C中配偶、D中单位、E中医疗保险公司询问病情，若无特殊情况，不应 随意违背保密原则告知。答案：AB", "module": "人群营养", "is_single": false}, {"id": 2013, "index": 7, "type": "multiple", "stem": "维生素B2主要存在于（ ）食物中。", "options": {"A": "奶类", "B": "肉类", "C": "肝脏", "D": "蛋类", "E": "蔬菜"}, "answer": ["A", "B", "C", "D"], "explanation": "答案:ABCD维生素B2主要存在于奶类、蛋类、肉类和肝脏等食物中，蔬菜中的含量相对较少。", "module": "DRIs", "is_single": false}, {"id": 49, "index": 8, "type": "multiple", "stem": "下列属于植物化学物分类及功能的有？", "options": {"A": "多酚类(如茶多酚、原花青素)具有抗氧化作用", "B": "类胡萝卜素(如番茄红素、叶黄素)具有抗氧化和光保护作用", "C": "植物固醇可降低胆固醇吸收，其作用机制与抑制脂肪酶活性有关", "D": "硫苷类(如十字花科蔬菜中的芥子油苷)具有抗癌潜力", "E": "植物化学物属于必需营养素，缺乏会引致缺乏症"}, "answer": ["A", "B", "D"], "explanation": "**考点定位**：植物化学物的分类及功能。属RD考试基础营养中非营养素生物活性物质的核心考点。\n**解题思路**：逐一判断——A（多酚类抗氧化）正确；B（类胡萝卜素抗氧化/光保护）正确；D（硫苷类抗癌）正确。\n不选C：植物固醇降胆固醇机制是与胆固醇竞争混合胶束（减少吸收），非抑制脂肪酶。不选E：植物化学物不属于必需营养素——缺乏不会致病，但\"非必需而有益\"。\n**易错点**：C选项的\"抑制脂肪酶\"是常见陷阱（那是奥利司他的机制）。植物固醇的机制是\"竞争性抑制吸收\"。\n**记忆点**：植物化学物不是营养素但有益——多酚（抗氧化）、类胡萝卜素（抗氧化/光保护）、植物固醇（竞争降胆固醇）、硫苷类（抗癌）。\n（教材回扣：《营养与食品卫生学》第2章·植物化学物概述）", "module": "基础营养", "is_single": false}, {"id": 2913, "index": 9, "type": "multiple", "stem": "非语言传播包括（ ）。", "options": {"A": "类语言", "B": "动态体语", "C": "时间语言", "D": "静态体语", "E": "空间语言"}, "answer": ["A", "B", "C", "D", "E"], "explanation": "非语言传播包括动态体语（如手势、表情等身体动作）、静态体语（姿势等）、类语言（如声 音的音量、音调等）、时间语言（如准时、时间长短等暗示）、空间语言（人际距离等） 。答案：ABCDE", "module": "DRIs", "is_single": false}, {"id": 1325, "index": 10, "type": "multiple", "stem": "营养标签中营养成分含量的比较常以（ ）作为参考。", "options": {"A": "NRVs", "B": "EAR", "C": "UL", "D": "ARE", "E": "DRIs"}, "answer": ["A", "E"], "explanation": "正确答案：A、E。选项解析：A.NRVs；B.EAR；C.UL；D.ARE；E.DRIs。建议查阅教材相应章节巩固知识。", "module": "食品卫生", "is_single": false}, {"id": 3632, "index": 11, "type": "single", "stem": "能够降低非血红素铁的吸收利用程度的膳食成分是", "options": {"A": "植酸盐和草酸盐", "B": "果胶", "C": "磷", "D": "维生素C"}, "answer": "A", "explanation": "植酸、多酚类物质、钙、大豆蛋白都对膳食非血红素铁的吸收有抑制作用。", "module": "基础营养", "is_single": true}, {"id": 5907, "index": 12, "type": "single", "stem": "生物体内氨基酸脱氨基的主要方式是", "options": {"A": "氧化脱氨基作用", "B": "转氨基作用", "C": "直接脱氨基作用", "D": "联合脱氨基作用"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P177，P179。氨基酸分解代谢的主要反应是脱氨基作用，可以通过多种方式如转氨基、氧化脱氨基及非氧化脱氨基等方式脱去氨基。转氨基作用只是把氨基酸分子中的氨基转移给a-酮戊二酸或其他α-酮酸，并没有真正实现脱氨基。若氨基转移酶与L-谷氨酸脱氢酶协同作用，首先通过转氨基作用使其他氨基酸的氨基转移至 a-酮戊二酸生成L-谷氨酸，然后L-谷氨酸再脱氨基，就可以使氨基酸脱氨生成NH3。这种方式需要氨基转移酶与L谷氨酸脱氢酶联合作用，即转氨基作用与L-谷氨酸的氧化脱氨基作用偶联进行，被称作转氨脱氨作用（transdeamination），又称联合脱氨作用。故选D。", "module": "氨基酸代谢", "is_single": true}, {"id": 5323, "index": 13, "type": "single", "stem": "肌肉运动时,其血流量增加,主要是因为", "options": {"A": "毛细血管主动舒张", "B": "肌肉收缩时局部代谢产物增多", "C": "相邻不活动肌肉血管收缩", "D": "交感缩血管纤维紧张性活动减弱"}, "answer": "B", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 5378, "index": 14, "type": "single", "stem": "在心肺感受器引起的心血管反射中,心房内血容量增加引起", "options": {"A": "迷走神经传入冲动减少", "B": "心率、心输出量和外周阻力增加", "C": "血管升压素和醛固酮水平升高", "D": "血压降低,循环血量和细胞外液量减少"}, "answer": "D", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 5383, "index": 15, "type": "single", "stem": "浦肯野细胞动作电位0期去极化", "options": {"A": "因Na+内流而产生", "B": "因Ca2+内流而产生", "C": "因Cl-内流而产", "D": "因K+内流而产生"}, "answer": "A", "explanation": "暂无解析", "module": "血液循环", "is_single": true}, {"id": 4372, "index": 16, "type": "single", "stem": "孕妇易出现生理性贫血，主要因为", "options": {"A": "血液被稀释", "B": "红细胞数量减少", "C": "缺铁", "D": "营养不良"}, "answer": "A", "explanation": "从孕妇的生理变化看，由于血容量扩大，血浆容积增长较快，容积增加约为45%～50%；红细胞数量增加较慢，增加约为15%～20%，使血液相对稀释，而容易导致生理性贫血。", "module": "人群营养", "is_single": true}, {"id": 4509, "index": 17, "type": "single", "stem": "下列关于潜水作业特点不正确的是", "options": {"A": "高气压环境", "B": "能量丢失增加", "C": "精神高度紧张", "D": "电离辐射"}, "answer": "D", "explanation": "《中国营养科学全书》第2版P1212。潜水作业一般不存在电离辐射。", "module": "人群营养", "is_single": true}, {"id": 4471, "index": 18, "type": "single", "stem": "下列食品对防治放射损伤较有作用的是", "options": {"A": "酪蛋白", "B": "橄榄油", "C": "玉米粉", "D": "玉米粉与脱脂大豆混合"}, "answer": "B", "explanation": "《营养与食品卫生学》第9版P158。能量、蛋白质和必需氨基酸摄入不足增加机体对辐射的敏感性，从而加重组织损伤和延缓机体恢复。一般建议蛋白质供能占总能量的12%~18%，以补充优质蛋白质为主；碳水化合物占60%~65%；注意适量增加必需脂肪酸和ω-3多不饱和脂肪酸的摄入，控制血脂水平，不建议增加脂肪占总能量的比例。保证足量的维生素C和适量脂溶性维生素的摄入，以减少辐射介导的活性氧对机体的损伤。同时，选择富含B族维生素（如烟酸、辅酶Q10）的食物，增加机体抗辐射效果。在保持水盐代谢平衡的基础上，适量增加微量元素和常量元素的摄入量，可选择瘦肉、动物内脏、鱼类、紫菜、蘑菇、土豆等含矿物质丰富的食物，但需注意矿物质之间的平衡。某些植物天然成分或植物化学物具有抗辐射、抗氧化的作用，如黄酮类、多酚类、皂苷类、多糖、黄芪、姜黄、红景天等。橄榄油有助于放射损伤的恢复，它可缩短白细胞恢复到正常水平的时间。", "module": "人群营养", "is_single": true}, {"id": 4187, "index": 19, "type": "single", "stem": "下列能引起化学性食物中毒的是", "options": {"A": "真菌", "B": "河豚毒素", "C": "苦井水", "D": "抗生素"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P399。苦井水中的亚硝酸盐含量较高,可引起中毒,属于化学性食物中毒。", "module": "食品卫生", "is_single": true}, {"id": 4141, "index": 20, "type": "single", "stem": "赤霉病麦中毒的病原物质为", "options": {"A": "黄曲霉毒素", "B": "3-硝基丙酸", "C": "单端孢霉烯族化合物", "D": "展青霉素"}, "answer": "C", "explanation": "《营养与食品卫生学》第9版P390。赤霉病麦中的主要毒性物质是这些镰刀菌产生的毒素，包括单端孢霉烯族化合物中的脱氧雪腐镰刀菌烯醇、雪腐镰刀菌烯醇和另一种镰刀菌毒素玉米赤霉烯酮。", "module": "食品卫生", "is_single": true}, {"id": 3966, "index": 21, "type": "single", "stem": "关于高血压患者营养治疗策略,错误的是", "options": {"A": "适当控制总能量", "B": "合理控制体重", "C": "限制饱和脂肪的摄入", "D": "保证充足的维生素"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P215，高血压的营养防治：吃动平衡，健康体重；适度减少钠盐，增加富含钾、钙、镁的食物摄入；减少膳食脂肪摄入量，增加优质蛋白摄入；提高碳水化合物含量，限制含糖饮料和高糖食品；限制饮酒；选择适宜的膳食模式。没有提到充足的维生素与高血压的治疗有关。", "module": "临床营养", "is_single": true}, {"id": 3957, "index": 22, "type": "single", "stem": "糖尿病的诊断是空腹血糖水平大于等于", "options": {"A": "7.0mmol/L", "B": "8.0mmol/L", "C": "9.0mmol/L", "D": "10.0mmol/L"}, "answer": "A", "explanation": "《中国2型糖尿病防治指南（2020版）。》", "module": "临床营养", "is_single": true}, {"id": 3994, "index": 23, "type": "single", "stem": "【技师不做】下列关于甲状旁腺功能试验膳食的说法,不正确的是", "options": {"A": "目的是诊断甲状旁腺功能亢进", "B": "调整饮食中磷、钙的含量,观察甲状旁腺的功能", "C": "食物称重,膳食可做成汤", "D": "对钙磷代谢有影响的药物应暂停服用"}, "answer": "C", "explanation": "《中国营养科学全书 》第2版P1474。本题考查的是甲状旁腺功能试验膳食的要求,如果使用低钙、正常磷代谢膳食,膳食不应做成汤。", "module": "临床营养", "is_single": true}, {"id": 3819, "index": 24, "type": "single", "stem": "蔬菜的春化作用是", "options": {"A": "蔬菜打破休眠而发生发芽或抽薹变化", "B": "重新分布蔬菜体内的养分,提高其营养价值", "C": "在酶的参与下,在有氧存在下加速蔬菜中的有机物分解", "D": "在蔬菜采摘后进一步成熟的过程"}, "answer": "A", "explanation": "《营养与食品卫生学》第9版P130。 蔬菜的春化作用即蔬菜打破休眠而发生发芽或抽薹变化，如马铃薯发芽、洋葱大蒜的抽薹等，这会大量消耗蔬菜体内的养分，使其营养价值降低。", "module": "食物营养", "is_single": true}, {"id": 3804, "index": 25, "type": "single", "stem": "大豆中含量较多、可弥补谷类食物不足的氨基酸是", "options": {"A": "蛋氨酸", "B": "苏氨酸", "C": "缬氨酸", "D": "赖氨酸"}, "answer": "D", "explanation": "《营养与食品卫生学》第8版P145。大豆蛋白质赖氨酸含量较多，氨基酸模式较好，具有较高的营养价值，属于优质蛋白质。大豆与谷类食物混合食用，可较好地发挥蛋白质的互补作用。", "module": "食物营养", "is_single": true}, {"id": 4579, "index": 26, "type": "single", "stem": "某女，38岁，身高162cm，体重77kg。根据BMI判断该女性的营养状况为", "options": {"A": "肥胖", "B": "超重", "C": "正常", "D": "消瘦"}, "answer": "A", "explanation": "《营养与食品卫生学》第8版P215。体质指数（BMI）是目前评价人体营养状况最常用的方法之一，BMI=体重（kg）/[身高（m）]2。 2003年“中国肥胖问题工作组”根据我国20多个地区流行病学数据与BMI的关系分析，提出我国成人BMI标准：BMI&lt;18.5为消瘦，18.5~23.9为正常，24~27.9为超重，≥28为肥胖。 该女性的BMI=77/(1.62)2=29.34，为肥胖。", "module": "公共营养", "is_single": true}, {"id": 4616, "index": 27, "type": "single", "stem": "用于计算人均收入增长率的公式为", "options": {"A": "食品的开支/家庭总收入×100%", "B": "食品购买力增长（%）/收入增长（%）", "C": "实际收入/家庭人口数", "D": "[（第二年度人均收入—第一年度人均收入）/第一年人均收入]×100%"}, "answer": "D", "explanation": "《营养与食品卫生学》第9版P172。人均收入增长率=[（第二年度人均收入—第一年度人均收入）/第一年人均收入]×100%， Engel指数=用于食品的开支/家庭总收入×100%， 收入弹性=食品购买力增长（%）/收入增长（%）， 人均收入=实际收入/家庭人口数。", "module": "公共营养", "is_single": true}, {"id": 4596, "index": 28, "type": "single", "stem": "《中国居民膳食指南（2022）》一般人群膳食指南的适用人群是", "options": {"A": "2岁以上健康人群", "B": "6岁以上健康人群", "C": "14岁以上健康人群", "D": "18岁以上健康人群"}, "answer": "A", "explanation": "《中国居民膳食指南（2022）》P2。一般人群膳食指南的适用人群是2岁以上健康人群。", "module": "公共营养", "is_single": true}, {"id": 6128, "index": 29, "type": "single", "stem": "淀粉经α-淀粉酶作用后的主要产物是", "options": {"A": "麦芽糖及蔗糖", "B": "葡萄糖及麦芽糖", "C": "葡萄糖及蔗糖", "D": "麦芽糖及极限糊精"}, "answer": "D", "explanation": "《生物化学与分子生物学》第9版P90。 淀粉消化主要在小肠内进行，在胰液淀粉酶作用下，淀粉被水解的产物为麦芽糖、麦芽三糖，还生成少量含有异麦芽糖、带分支的寡聚葡萄糖混合物（α-极限糊精）。", "module": "糖代谢", "is_single" const userAnswers = {};

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const isSingle = q.is_single;
    const optionsHtml = Object.entries(q.options).map(([key, val]) =>
      `<div class="option ${isSingle?'option-single':'option-multi'}" data-q="${i}" data-key="${key}" onclick="selectOption(${i},'${key}',${isSingle})"><span class="option-key">${key}.</span><span>${val}</span></div>`
    ).join('');

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `qcard-${i}`;
    card.innerHTML = `
      <div class="q-header">
        <span class="q-number">#${i+1} <span style="font-weight:400;color:#999;font-size:13px">/ ${QUESTIONS.length}</span></span>
        <span><span class="q-type">${isSingle?'单选题':'多选题'}</span><span class="q-module">${q.module}</span></span>
      </div>
      <div class="q-stem">${q.stem}</div>
      <div class="options">${optionsHtml}</div>
      <div class="exp-toggle"><button id="expBtn-${i}" onclick="toggleExp(${i})" style="background:none;border:1px solid #d0d0d0;border-radius:6px;padding:4px 14px;font-size:13px;cursor:pointer;color:#667eea">📖 查看解析</button></div>
      <div class="explanation-box" id="exp-${i}">
        <div class="exp-label">📖 解析</div>
        <div>${q.explanation.replace('\n','<br>')}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function selectOption(qIdx, key, isSingle) {
  const card = document.getElementById(`qcard-${qIdx}`);
  const opts = card.querySelectorAll('.option');
  if (isSingle) {
    opts.forEach(o => o.classList.remove('selected'));
    opts.forEach(o => {
      if (o.dataset.key === key) o.classList.add('selected');
    });
    userAnswers[qIdx] = [key];
  } else {
    const el = card.querySelector(`.option[data-key="${key}"]`);
    el.classList.toggle('selected');
    const selected = [...card.querySelectorAll('.option.selected')].map(o => o.dataset.key);
    userAnswers[qIdx] = selected.length > 0 ? selected : null;
  }
}

function toggleExp(qIdx) {
  const box = document.getElementById(`exp-${qIdx}`);
  const btn = document.getElementById(`expBtn-${qIdx}`);
  if (box.classList.contains('show')) {
    box.classList.remove('show');
    btn.innerHTML = '📖 查看解析';
  } else {
    box.classList.add('show');
    btn.innerHTML = '📎 收起解析';
  }
}

function submitQuiz() {
  let correct = 0, wrong = 0;
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    const opts = card.querySelectorAll('.option');
    const exp = document.getElementById(`exp-${i}`);
    const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
    const userAns = userAnswers[i] || [];
    const isCorrect = userAns.length > 0 && JSON.stringify(userAns.slice().sort()) === JSON.stringify(correctAnswer);

    opts.forEach(o => o.classList.add('disabled'));
    if (isCorrect) {
      card.classList.add('correct');
      correct++;
    } else {
      card.classList.add('wrong');
      wrong++;
    }
    // Highlight correct/incorrect options
    opts.forEach(o => {
      const k = o.dataset.key;
      const isUser = userAns.includes(k);
      const isRight = correctAnswer.includes(k);
      if (isUser && isRight) o.classList.add('correct-answer');
      else if (isUser && !isRight) o.classList.add('wrong-answer');
      else if (!isUser && isRight) o.classList.add('correct-answer');
    });
    exp.classList.add('show');
  });

  const total = QUESTIONS.length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreBadge').innerHTML = `${correct}/${total} (${pct}%)`;
  document.getElementById('scoreBadge').style.color = pct >= 70 ? '#52c41a' : pct >= 50 ? '#faad14' : '#ff4d4f';

  // Update summary
  document.getElementById('summaryTotal').textContent = total;
  document.getElementById('summaryCorrect').textContent = correct;
  document.getElementById('summaryWrong').textContent = wrong;
  document.getElementById('summaryRate').textContent = pct + '%';
  document.getElementById('summaryBar').classList.add('show');

  // Scroll to top
  window.scrollTo({top: 0, behavior: 'smooth'});

  // Show wrong list with detail
  const wrongIndices = [];
  const wrongDetails = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) {
      wrongIndices.push(i + 1);
      const userAns = userAnswers[i] || [];
      const correctAnswer = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
      wrongDetails.push({
        idx: i + 1,
        id: q.id,
        module: q.module,
        stem: q.stem,
        userAnswer: userAns.length ? userAns.join(', ') : '（未作答）',
        correctAnswer: correctAnswer.join(', '),
      });
    }
  });
  const wrongNumsEl = document.getElementById('wrongNums');
  const detailText = document.getElementById('wrongDetailText');
  if (wrongIndices.length > 0) {
    wrongNumsEl.innerHTML = wrongIndices.map(n => `<span>#${n}</span>`).join('');
    // Build detail text for copying
    let text = '===== RD 错题报告 =====\n';
    text += '共 ' + wrongIndices.length + ' 题\n\n';
    wrongDetails.forEach((w, i) => {
      text += '--- 第' + w.idx + '题 ---\n';
      text += '题号: ' + w.idx + '  (数据库ID: ' + w.id + ')\n';
      text += '模块: ' + w.module + '\n';
      text += '题干: ' + w.stem + '\n';
      text += '你的答案: ' + w.userAnswer + '\n';
      text += '正确答案: ' + w.correctAnswer + '\n';
      text += '——————————————\n';
    });
    text += '\n请帮我分析这些错题的错因和薄弱点。';
    detailText.value = text;
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = '';
  } else {
    wrongNumsEl.innerHTML = '<span style="color:#52c41a;font-weight:600;">🎉 全部正确！</span>';
    detailText.value = '🎉 全部正确，太棒了！';
    document.getElementById('wrongList').classList.add('show');
    document.getElementById('copyWrongBtn').style.display = 'none';
  }
}

function resetQuiz() {
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    card.className = 'question-card';
    card.querySelectorAll('.option').forEach(o => {
      o.classList.remove('selected', 'correct-answer', 'wrong-answer', 'disabled');
    });
    document.getElementById(`exp-${i}`).classList.remove('show');
  });
  document.getElementById('scoreBadge').innerHTML = '待提交';
  document.getElementById('scoreBadge').style.color = '#667eea';
  document.getElementById('wrongList').classList.remove('show');
  document.getElementById('copyWrongBtn').style.display = 'none';
}

function copyWrongDetail() {
  const ta = document.getElementById('wrongDetailText');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try {
    navigator.clipboard.writeText(ta.value).then(() => {
      alert('✅ 已复制错题详情，请发给教练分析！');
    }).catch(() => {
      document.execCommand('copy');
      alert('✅ 已复制，请发给教练分析！');
    });
  } catch(e) {
    document.execCommand('copy');
    alert('✅ 已复制，请发给教练分析！');
  }
}

function copyWrongAnswers() {
  const wrongIndices = [];
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card.classList.contains('wrong')) wrongIndices.push(i + 1);
  });
  if (wrongIndices.length === 0) {
    alert('🎉 全部正确，没有错题！');
    return;
  }
  const text = wrongIndices.join(', ');
  navigator.clipboard.writeText(text).then(() => {
    alert(`✅ 已复制错题号：${text}`);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert(`✅ 已复制错题号：${text}`);
  });
}

try {
  renderQuestions();
  document.getElementById('jsFallback').style.display = 'none';
} catch(e) {
  document.getElementById('jsFallback').innerHTML =
    '<div style="font-size:48px;margin-bottom:16px;">❌</div>' +
    '<div style="font-size:16px;color:#ff4d4f;">题目加载失败</div>' +
    '<div style="font-size:13px;margin-top:8px;color:#999;">错误: ' + e.message + '</div>' +
    '<div style="font-size:13px;margin-top:4px;color:#999;">请截屏此错误信息发给教练修复</div>';
  console.error('RD题卡渲染错误:', e);
}
</script>
<script>
(function() {
  const RD_CARD_KEY = "2026-08-09-RD每日题卡_20260809_Part2_晚上50题";
  const RD_CARD_FILE = "RD每日题卡_20260809_Part2_晚上50题.html";
  const RD_DATE = "2026-08-09";
  const RD_STORAGE_KEY = "rd-progress:" + RD_CARD_KEY;
  const RD_HISTORY_KEY = RD_STORAGE_KEY + ":attempted";
  function localHost() {
    const h = location.hostname;
    return location.protocol === "http:" && (h === "localhost" || h === "127.0.0.1" || /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(h));
  }
  function questionId(card, idx) {
    let index = card && card.id.indexOf('qcard-') === 0 ? Number(card.id.slice(6)) : idx;
    try { if (QUESTIONS[index]) return String(QUESTIONS[index].id); } catch (e) {}
    return String(index + 1);
  }
  function remember(card, idx) {
    const qid = questionId(card, idx);
    let history = {};
    try { history = JSON.parse(localStorage.getItem(RD_HISTORY_KEY) || '{}'); } catch (e) {}
    history[qid] = true;
    try { localStorage.setItem(RD_HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
  }
  function snapshot() {
    const attempted = {};
    let history = {};
    try { history = JSON.parse(localStorage.getItem(RD_HISTORY_KEY) || '{}'); } catch (e) {}
    Object.keys(history).forEach(qid => attempted[qid] = []);
    document.querySelectorAll('[id^="qcard-"], .q').forEach((card, idx) => {
      const selected = [...card.querySelectorAll('.option.selected, input:checked')].map(el => el.dataset?.key || el.value).filter(Boolean);
      const questionId = questionIdForCard(card, idx);
      if (selected.length) attempted[questionId] = [...new Set(selected)].sort();
    });
    return {card_key: RD_CARD_KEY, card_filename: RD_CARD_FILE, date: RD_DATE, attempted: attempted, updated_at: new Date().toISOString()};
  }
  function questionIdForCard(card, idx) { return questionId(card, idx); }
  function paint(data) {
    let el = document.getElementById('rdAutoProgress');
    if (!el) { el = document.createElement('div'); el.id = 'rdAutoProgress'; el.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:9999;background:#fff;padding:8px 12px;border-radius:8px;box-shadow:0 2px 10px #0002;font-size:13px;color:#555'; document.body.appendChild(el); }
    el.textContent = '已自动记录：' + Object.keys(data.attempted || {}).length + '题';
  }
  function apply(data) {
    const attempted = data && data.attempted || {};
    Object.entries(attempted).forEach(([qid, values]) => {
      let index = -1;
      try { index = QUESTIONS.findIndex(q => String(q.id) === String(qid)); } catch (e) {}
      const card = index >= 0 ? (document.getElementById('qcard-' + index) || document.getElementById('c' + (index + 1))) : null;
      if (!card) return;
      (values || []).forEach(key => {
        const option = card.querySelector('.option[data-key="' + key + '"], input[value="' + key + '"]');
        if (option && option.classList && option.classList.contains('option')) option.click();
        else if (option) option.checked = true;
      });
    });
    paint(data || {attempted: {}});
  }
  async function restore() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(RD_STORAGE_KEY) || 'null'); } catch (e) {}
    if (localHost()) {
      try {
        const r = await fetch(location.origin + '/api/progress?date=' + encodeURIComponent(RD_DATE) + '&card_key=' + encodeURIComponent(RD_CARD_KEY));
        if (r.ok) data = await r.json();
      } catch (e) {}
    }
    if (data) apply(data);
  }
  function save() {
    const data = snapshot();
    try { localStorage.setItem(RD_STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    paint(data);
    if (localHost()) {
      try { navigator.sendBeacon(location.origin + '/api/progress', new Blob([JSON.stringify(data)], {type:'application/json'})); } catch (e) {}
    }
  }
  function init() {
    document.addEventListener('click', e => {
      const target = e.target.closest('.option, .op, input');
      if (!target) return;
      const card = target.closest('[id^="qcard-"], .q');
      if (card) { const cards = [...document.querySelectorAll('[id^="qcard-"], .q')]; remember(card, cards.indexOf(card)); }
      setTimeout(save, 0);
    });
    document.addEventListener('change', e => {
      const card = e.target.closest('[id^="qcard-"], .q');
      if (card) { const cards = [...document.querySelectorAll('[id^="qcard-"], .q')]; remember(card, cards.indexOf(card)); }
      save();
    });
    window.addEventListener('beforeunload', save);
    restore().finally(() => setTimeout(save, 300));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script></body>
